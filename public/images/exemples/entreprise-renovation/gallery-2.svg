<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <defs>
    <linearGradient id="er-g2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2330"/>
      <stop offset="100%" style="stop-color:#2a2d3a"/>
    </linearGradient>
    <!-- Marble gradient -->
    <linearGradient id="er-g2-marble1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f0"/>
      <stop offset="30%" style="stop-color:#ececec"/>
      <stop offset="60%" style="stop-color:#e0dcdc"/>
      <stop offset="100%" style="stop-color:#f2f0ee"/>
    </linearGradient>
    <!-- Wood grain gradient -->
    <linearGradient id="er-g2-wood1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8884a"/>
      <stop offset="35%" style="stop-color:#b07030"/>
      <stop offset="65%" style="stop-color:#c88848"/>
      <stop offset="100%" style="stop-color:#a86828"/>
    </linearGradient>
    <linearGradient id="er-g2-wood2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d8945a"/>
      <stop offset="50%" style="stop-color:#b87840"/>
      <stop offset="100%" style="stop-color:#d09050"/>
    </linearGradient>
    <linearGradient id="er-g2-cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e3340"/>
      <stop offset="100%" style="stop-color:#252830"/>
    </linearGradient>
    <filter id="er-g2-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#00000066"/>
    </filter>
    <filter id="er-g2-tileShad">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="360" fill="url(#er-g2-bg)"/>
  <!-- Subtle grid background -->
  <g stroke="#2d3240" stroke-width="0.5" fill="none" opacity="0.5">
    <line x1="0" y1="40" x2="520" y2="40"/><line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="120" x2="520" y2="120"/><line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="200" x2="520" y2="200"/><line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="0" y1="280" x2="520" y2="280"/><line x1="0" y1="320" x2="520" y2="320"/>
    <line x1="60" y1="0" x2="60" y2="360"/><line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/><line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/><line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="420" y1="0" x2="420" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- TOP LABEL -->
  <rect x="0" y="0" width="520" height="40" fill="#334155"/>
  <rect x="0" y="37" width="520" height="3" fill="#F97316"/>
  <text x="260" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" letter-spacing="2">MATÉRIAUX PREMIUM</text>

  <!-- === MARBLE SWATCH (top-left) === -->
  <g filter="url(#er-g2-shadow)">
    <rect x="28" y="58" width="140" height="110" rx="8" fill="url(#er-g2-marble1)"/>
    <!-- Marble veins -->
    <path d="M35 70 Q60 80 80 68 Q100 58 120 72 Q140 84 160 70" stroke="#c0bcb8" stroke-width="1.2" fill="none" opacity="0.7" clip-path="url(#er-g2-marbleClip)"/>
    <path d="M40 90 Q65 100 90 88 Q110 78 130 90 Q150 102 168 90" stroke="#b8b4b0" stroke-width="0.9" fill="none" opacity="0.6" clip-path="url(#er-g2-marbleClip)"/>
    <path d="M30 110 Q55 118 80 108 Q100 100 125 112 Q145 122 162 108" stroke="#c8c4c0" stroke-width="0.8" fill="none" opacity="0.5" clip-path="url(#er-g2-marbleClip)"/>
    <path d="M50 130 Q80 140 110 128 Q135 118 155 132" stroke="#b0acaa" stroke-width="1" fill="none" opacity="0.55" clip-path="url(#er-g2-marbleClip)"/>
    <path d="M35 150 Q70 158 100 148 Q125 138 155 150 Q165 155 168 155" stroke="#c4c0bc" stroke-width="0.7" fill="none" opacity="0.4"/>
    <!-- Marble label tag -->
    <rect x="38" y="148" width="80" height="14" rx="3" fill="#334155" opacity="0.85"/>
    <text x="78" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Marbre Calacatta</text>
  </g>

  <!-- === WOOD SWATCH 1 (top-center) === -->
  <g filter="url(#er-g2-shadow)">
    <rect x="190" y="58" width="140" height="110" rx="8" fill="url(#er-g2-wood1)"/>
    <!-- Wood grain lines -->
    <g stroke="#9a5820" stroke-width="0.8" fill="none" opacity="0.5">
      <path d="M190 75 Q220 72 260 75 Q290 78 330 74"/>
      <path d="M190 85 Q215 82 250 86 Q280 89 330 84"/>
      <path d="M190 96 Q225 93 260 96 Q300 100 330 95"/>
      <path d="M190 108 Q220 105 255 108 Q295 111 330 107"/>
      <path d="M190 120 Q230 117 265 120 Q300 123 330 119"/>
      <path d="M190 132 Q220 129 258 132 Q295 135 330 130"/>
      <path d="M190 144 Q225 141 262 144 Q298 147 330 142"/>
      <path d="M190 155 Q220 152 255 155 Q290 158 330 153"/>
    </g>
    <!-- Knot detail -->
    <ellipse cx="290" cy="95" rx="12" ry="8" fill="#8a4815" opacity="0.4"/>
    <ellipse cx="290" cy="95" rx="6" ry="4" fill="#7a3c10" opacity="0.3"/>
    <!-- Wood label -->
    <rect x="200" y="148" width="80" height="14" rx="3" fill="#334155" opacity="0.85"/>
    <text x="240" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Chêne Massif</text>
  </g>

  <!-- === WOOD SWATCH 2 - darker walnut (top-right) === -->
  <g filter="url(#er-g2-shadow)">
    <rect x="352" y="58" width="140" height="110" rx="8" fill="url(#er-g2-wood2)"/>
    <g stroke="#8a4e20" stroke-width="0.8" fill="none" opacity="0.45">
      <path d="M352 72 Q380 68 415 73 Q445 78 492 70"/>
      <path d="M352 84 Q385 80 420 84 Q452 88 492 82"/>
      <path d="M352 97 Q382 93 418 97 Q450 101 492 95"/>
      <path d="M352 110 Q388 106 420 110 Q455 114 492 108"/>
      <path d="M352 123 Q385 119 422 123 Q458 127 492 121"/>
      <path d="M352 136 Q383 132 420 136 Q455 140 492 134"/>
      <path d="M352 149 Q383 145 418 149 Q454 153 492 147"/>
    </g>
    <rect x="362" y="148" width="80" height="14" rx="3" fill="#334155" opacity="0.85"/>
    <text x="402" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Noyer Américain</text>
  </g>

  <!-- === PAINT SWATCHES row (bottom-left cluster) === -->
  <g filter="url(#er-g2-tileShad)">
    <!-- Swatch card container -->
    <rect x="28" y="185" width="220" height="140" rx="8" fill="url(#er-g2-cardBg)"/>
    <text x="138" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" letter-spacing="1">PALETTE COULEURS</text>
    <!-- Paint strip 1: Warm cream -->
    <rect x="40" y="212" width="30" height="90" rx="3" fill="#FEF3C7"/>
    <rect x="40" y="290" width="30" height="12" rx="2" fill="#e8dab0"/>
    <text x="55" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#334155">Crème</text>
    <!-- Paint strip 2: Slate -->
    <rect x="75" y="212" width="30" height="90" rx="3" fill="#334155"/>
    <rect x="75" y="290" width="30" height="12" rx="2" fill="#2a3548"/>
    <text x="90" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#94A3B8">Ardoise</text>
    <!-- Paint strip 3: Warm grey -->
    <rect x="110" y="212" width="30" height="90" rx="3" fill="#94A3B8"/>
    <rect x="110" y="290" width="30" height="12" rx="2" fill="#7a8ea0"/>
    <text x="125" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">Béton</text>
    <!-- Paint strip 4: Orange accent -->
    <rect x="145" y="212" width="30" height="90" rx="3" fill="#F97316"/>
    <rect x="145" y="290" width="30" height="12" rx="2" fill="#e06010"/>
    <text x="160" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">Cuivre</text>
    <!-- Paint strip 5: Off-white -->
    <rect x="180" y="212" width="30" height="90" rx="3" fill="#f8f4ee"/>
    <rect x="180" y="290" width="30" height="12" rx="2" fill="#e8e4d8"/>
    <text x="195" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#334155">Lin</text>
    <!-- Color chip connector lines -->
    <line x1="55" y1="212" x2="55" y2="212" stroke="#F97316" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- === FABRIC / TILE SWATCHES (bottom-right) === -->
  <g filter="url(#er-g2-tileShad)">
    <rect x="268" y="185" width="224" height="140" rx="8" fill="url(#er-g2-cardBg)"/>
    <text x="380" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" letter-spacing="1">REVÊTEMENTS</text>
    <!-- Tile hexagon pattern -->
    <g transform="translate(280, 218)">
      <polygon points="18,0 36,10 36,30 18,40 0,30 0,10" fill="#e8e0d8" stroke="#c8c0b8" stroke-width="0.8"/>
      <polygon points="18,42 36,52 36,72 18,82 0,72 0,52" fill="#d8d0c8" stroke="#c0b8b0" stroke-width="0.8"/>
      <polygon points="37,21 55,31 55,51 37,61 36,51 36,31" fill="#e0d8d0" stroke="#c8c0b8" stroke-width="0.8"/>
      <polygon points="37,63 55,73 55,93 37,103 36,93 36,73" fill="#e8e0d8" stroke="#c8c0b8" stroke-width="0.8"/>
      <text x="28" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94A3B8">Mosaïque</text>
    </g>
    <!-- Fabric swatch -->
    <g transform="translate(360, 218)">
      <rect x="0" y="0" width="60" height="85" rx="3" fill="#c8b890"/>
      <!-- Fabric weave lines -->
      <g stroke="#a89870" stroke-width="0.8" fill="none" opacity="0.6">
        <line x1="0" y1="10" x2="60" y2="10"/><line x1="0" y1="20" x2="60" y2="20"/>
        <line x1="0" y1="30" x2="60" y2="30"/><line x1="0" y1="40" x2="60" y2="40"/>
        <line x1="0" y1="50" x2="60" y2="50"/><line x1="0" y1="60" x2="60" y2="60"/>
        <line x1="0" y1="70" x2="60" y2="70"/><line x1="0" y1="80" x2="60" y2="80"/>
        <line x1="10" y1="0" x2="10" y2="85"/><line x1="20" y1="0" x2="20" y2="85"/>
        <line x1="30" y1="0" x2="30" y2="85"/><line x1="40" y1="0" x2="40" y2="85"/>
        <line x1="50" y1="0" x2="50" y2="85"/>
      </g>
      <text x="30" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94A3B8">Lin Naturel</text>
    </g>
    <!-- Metal accent strip -->
    <g transform="translate(435, 218)">
      <rect x="0" y="0" width="45" height="85" rx="3" fill="#94A3B8"/>
      <rect x="5" y="5" width="35" height="75" rx="2" fill="#7a8ea0"/>
      <!-- Brushed metal lines -->
      <g stroke="#8898aa" stroke-width="0.4" fill="none" opacity="0.8">
        <line x1="0" y1="8" x2="45" y2="8"/><line x1="0" y1="12" x2="45" y2="12"/>
        <line x1="0" y1="16" x2="45" y2="16"/><line x1="0" y1="20" x2="45" y2="20"/>
        <line x1="0" y1="24" x2="45" y2="24"/><line x1="0" y1="28" x2="45" y2="28"/>
        <line x1="0" y1="32" x2="45" y2="32"/><line x1="0" y1="36" x2="45" y2="36"/>
        <line x1="0" y1="40" x2="45" y2="40"/><line x1="0" y1="44" x2="45" y2="44"/>
        <line x1="0" y1="48" x2="45" y2="48"/><line x1="0" y1="52" x2="45" y2="52"/>
        <line x1="0" y1="56" x2="45" y2="56"/><line x1="0" y1="60" x2="45" y2="60"/>
        <line x1="0" y1="64" x2="45" y2="64"/><line x1="0" y1="68" x2="45" y2="68"/>
        <line x1="0" y1="72" x2="45" y2="72"/><line x1="0" y1="76" x2="45" y2="76"/>
        <line x1="0" y1="80" x2="45" y2="80"/>
      </g>
      <text x="22" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94A3B8">Inox Brossé</text>
    </g>
  </g>

  <!-- Premium badge -->
  <g filter="url(#er-g2-shadow)">
    <rect x="195" y="310" width="130" height="30" rx="6" fill="#F97316"/>
    <text x="260" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" letter-spacing="1">★ PREMIUM ★</text>
  </g>
</svg>
