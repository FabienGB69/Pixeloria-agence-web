<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0f1928"/>
    </linearGradient>
    <linearGradient id="card1G" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#253040"/>
      <stop offset="100%" stop-color="#1a2535"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#ea6010"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#f0a050"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000060"/>
    </filter>
    <filter id="numGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="520" height="360" fill="url(#bgG)"/>
  <!-- Dot grid -->
  <g fill="#FAFAF9" opacity="0.04">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/>
    <circle cx="200" cy="50" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="300" cy="50" r="2"/>
    <circle cx="350" cy="50" r="2"/><circle cx="400" cy="50" r="2"/><circle cx="450" cy="50" r="2"/>
    <circle cx="500" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="150" cy="100" r="2"/><circle cx="250" cy="100" r="2"/>
    <circle cx="350" cy="100" r="2"/><circle cx="450" cy="100" r="2"/>
    <circle cx="50" cy="200" r="2"/><circle cx="150" cy="200" r="2"/><circle cx="350" cy="200" r="2"/>
    <circle cx="450" cy="200" r="2"/>
    <circle cx="50" cy="300" r="2"/><circle cx="150" cy="300" r="2"/><circle cx="250" cy="300" r="2"/>
    <circle cx="350" cy="300" r="2"/><circle cx="450" cy="300" r="2"/>
  </g>
  <!-- Header -->
  <text x="260" y="30" text-anchor="middle" font-size="11" fill="#78716C" letter-spacing="3">PROJECT STATISTICS</text>
  <rect x="180" y="35" width="160" height="2" fill="url(#orangeG)" opacity="0.6"/>
  <!-- Metric card 1: Projects -->
  <rect x="14" y="50" width="228" height="130" rx="12" fill="url(#card1G)" filter="url(#cardShadow)"/>
  <rect x="14" y="50" width="228" height="5" rx="3" fill="url(#orangeG)"/>
  <!-- Icon: building/house -->
  <g transform="translate(38 80)" fill="#F97316" opacity="0.9">
    <polygon points="18,0 36,14 0,14" />
    <rect x="4" y="14" width="28" height="20"/>
    <rect x="8" y="20" width="8" height="14"/>
    <rect x="20" y="20" width="8" height="14"/>
  </g>
  <text x="120" y="96" font-size="40" fill="#F97316" font-weight="bold" filter="url(#numGlow)">250+</text>
  <text x="120" y="116" font-size="11" fill="#FAFAF9" opacity="0.7" letter-spacing="1">PROJECTS COMPLETED</text>
  <text x="38" y="152" font-size="9" fill="#78716C">Residential &amp; Commercial</text>
  <!-- Progress bar -->
  <rect x="30" y="158" width="196" height="6" rx="3" fill="#0f1928"/>
  <rect x="30" y="158" width="186" height="6" rx="3" fill="url(#barG)"/>
  <text x="226" y="165" text-anchor="end" font-size="7" fill="#F97316">98%</text>
  <!-- Metric card 2: Years -->
  <rect x="278" y="50" width="228" height="130" rx="12" fill="url(#card1G)" filter="url(#cardShadow)"/>
  <rect x="278" y="50" width="228" height="5" rx="3" fill="#334155"/>
  <!-- Icon: calendar -->
  <g transform="translate(296 78)" fill="#78716C" opacity="0.9">
    <rect x="0" y="0" width="38" height="32" rx="4" fill="none" stroke="#78716C" stroke-width="2.5"/>
    <rect x="0" y="0" width="38" height="10" rx="4" fill="#78716C"/>
    <rect x="8" y="14" width="6" height="6" rx="1"/>
    <rect x="16" y="14" width="6" height="6" rx="1"/>
    <rect x="24" y="14" width="6" height="6" rx="1"/>
    <rect x="8" y="23" width="6" height="6" rx="1"/>
    <rect x="16" y="23" width="6" height="6" rx="1"/>
  </g>
  <text x="384" y="96" font-size="40" fill="#FAFAF9" font-weight="bold">15</text>
  <text x="384" y="116" font-size="11" fill="#FAFAF9" opacity="0.7" letter-spacing="1">YEARS EXPERIENCE</text>
  <text x="296" y="152" font-size="9" fill="#78716C">Est. 2009 · Family Owned</text>
  <rect x="294" y="158" width="196" height="6" rx="3" fill="#0f1928"/>
  <rect x="294" y="158" width="150" height="6" rx="3" fill="#334155"/>
  <!-- Metric card 3: Satisfaction -->
  <rect x="14" y="200" width="228" height="130" rx="12" fill="url(#card1G)" filter="url(#cardShadow)"/>
  <rect x="14" y="200" width="228" height="5" rx="3" fill="url(#orangeG)"/>
  <!-- Icon: star/rating -->
  <text x="52" y="246" font-size="32" fill="#F97316" opacity="0.9">&#9733;</text>
  <text x="74" y="246" font-size="32" fill="#F97316" opacity="0.9">&#9733;</text>
  <text x="96" y="246" font-size="32" fill="#F97316" opacity="0.9">&#9733;</text>
  <text x="52" y="238" font-size="8" fill="#78716C" opacity="0.0">hidden</text>
  <text x="160" y="232" font-size="32" fill="#F97316" font-weight="bold">98%</text>
  <text x="120" y="262" font-size="11" fill="#FAFAF9" opacity="0.7" letter-spacing="1">SATISFACTION RATE</text>
  <text x="38" y="300" font-size="9" fill="#78716C">Based on post-project surveys</text>
  <rect x="30" y="308" width="196" height="6" rx="3" fill="#0f1928"/>
  <rect x="30" y="308" width="192" height="6" rx="3" fill="url(#barG)"/>
  <!-- Metric card 4: Value -->
  <rect x="278" y="200" width="228" height="130" rx="12" fill="url(#card1G)" filter="url(#cardShadow)"/>
  <rect x="278" y="200" width="228" height="5" rx="3" fill="#334155"/>
  <!-- Icon: dollar/value -->
  <g transform="translate(294 216)" fill="#78716C" opacity="0.8">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#78716C" stroke-width="2.5"/>
    <text x="20" y="26" text-anchor="middle" font-size="20" fill="#78716C" font-weight="bold">$</text>
  </g>
  <text x="380" y="248" font-size="28" fill="#FAFAF9" font-weight="bold">$2M+</text>
  <text x="384" y="270" font-size="11" fill="#FAFAF9" opacity="0.7" letter-spacing="1">VALUE DELIVERED</text>
  <text x="296" y="302" font-size="9" fill="#78716C">Total project value since launch</text>
  <rect x="294" y="308" width="196" height="6" rx="3" fill="#0f1928"/>
  <rect x="294" y="308" width="180" height="6" rx="3" fill="#334155"/>
  <!-- Label -->
  <rect x="0" y="340" width="520" height="20" fill="#334155"/>
  <rect x="0" y="338" width="520" height="4" fill="url(#orangeG)"/>
  <text x="260" y="355" text-anchor="middle" font-size="13" fill="#FAFAF9" font-weight="bold" letter-spacing="2">BY THE NUMBERS</text>
</svg>
