<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5edd8"/>
      <stop offset="100%" stop-color="#e8d8c0"/>
    </linearGradient>
    <linearGradient id="shelfG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a870"/>
      <stop offset="100%" stop-color="#a88050"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#b89870"/>
    </linearGradient>
    <radialGradient id="spotG" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f5edd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>
  <!-- Background wall -->
  <rect width="520" height="360" fill="url(#bgG)"/>
  <!-- Brick wall texture (upper) -->
  <g fill="#d8c8a8" opacity="0.4" stroke="#c8b890" stroke-width="0.5">
    <rect x="0" y="0" width="60" height="22" rx="2"/>
    <rect x="65" y="0" width="60" height="22" rx="2"/>
    <rect x="130" y="0" width="60" height="22" rx="2"/>
    <rect x="195" y="0" width="60" height="22" rx="2"/>
    <rect x="260" y="0" width="60" height="22" rx="2"/>
    <rect x="325" y="0" width="60" height="22" rx="2"/>
    <rect x="390" y="0" width="60" height="22" rx="2"/>
    <rect x="455" y="0" width="65" height="22" rx="2"/>
    <rect x="30" y="26" width="60" height="22" rx="2"/>
    <rect x="95" y="26" width="60" height="22" rx="2"/>
    <rect x="160" y="26" width="60" height="22" rx="2"/>
    <rect x="225" y="26" width="60" height="22" rx="2"/>
    <rect x="290" y="26" width="60" height="22" rx="2"/>
    <rect x="355" y="26" width="60" height="22" rx="2"/>
    <rect x="420" y="26" width="60" height="22" rx="2"/>
  </g>
  <!-- Wainscoting -->
  <rect x="0" y="210" width="520" height="8" fill="#b89860" opacity="0.7"/>
  <!-- Floor -->
  <rect x="0" y="290" width="520" height="70" fill="url(#floorG)"/>
  <g stroke="#b89060" stroke-width="0.8" opacity="0.5">
    <line x1="0" y1="305" x2="520" y2="305"/>
    <line x1="0" y1="320" x2="520" y2="320"/>
    <line x1="0" y1="335" x2="520" y2="335"/>
    <line x1="0" y1="350" x2="520" y2="350"/>
    <line x1="105" y1="290" x2="90" y2="360"/>
    <line x1="210" y1="290" x2="200" y2="360"/>
    <line x1="315" y1="290" x2="310" y2="360"/>
    <line x1="420" y1="290" x2="420" y2="360"/>
  </g>
  <!-- Spotlight effects -->
  <ellipse cx="130" cy="0" rx="60" ry="200" fill="url(#spotG)"/>
  <ellipse cx="330" cy="0" rx="60" ry="200" fill="url(#spotG)"/>
  <!-- Left shelf unit -->
  <rect x="20" y="50" width="14" height="250" fill="url(#shelfG)"/>
  <rect x="140" y="50" width="14" height="250" fill="url(#shelfG)"/>
  <!-- Shelf boards -->
  <rect x="18" y="80" width="138" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="18" y="140" width="138" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="18" y="200" width="138" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="18" y="260" width="138" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <!-- Products on left shelf -->
  <!-- Shelf 1 items: jars -->
  <rect x="28" y="56" width="22" height="26" rx="4" fill="#e8c870" stroke="#c8a840" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="29" y="52" width="20" height="8" rx="2" fill="#d4a830"/>
  <rect x="56" y="56" width="22" height="26" rx="4" fill="#c8e090" stroke="#a0c060" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="57" y="52" width="20" height="8" rx="2" fill="#88b040"/>
  <rect x="84" y="52" width="22" height="30" rx="4" fill="#f0b060" stroke="#d08030" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="85" y="48" width="20" height="8" rx="2" fill="#c07020"/>
  <rect x="112" y="56" width="22" height="26" rx="4" fill="#d0c0e8" stroke="#a090c8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="113" y="52" width="20" height="8" rx="2" fill="#9070a8"/>
  <!-- Shelf 2: books -->
  <rect x="28" y="100" width="14" height="42" rx="2" fill="#2a5a8a"/>
  <rect x="44" y="104" width="12" height="38" rx="2" fill="#8a3a2a"/>
  <rect x="58" y="100" width="16" height="42" rx="2" fill="#2a7a3a"/>
  <rect x="76" y="104" width="12" height="38" rx="2" fill="#7a6a3a"/>
  <rect x="90" y="100" width="14" height="42" rx="2" fill="#5a2a7a"/>
  <rect x="106" y="104" width="12" height="38" rx="2" fill="#3a5a2a"/>
  <rect x="120" y="100" width="18" height="42" rx="2" fill="#8a5a2a"/>
  <!-- Shelf 3: crafts -->
  <circle cx="38" cy="172" r="12" fill="#c85030" opacity="0.85"/>
  <circle cx="65" cy="172" r="10" fill="#308060" opacity="0.85"/>
  <rect x="80" y="158" width="20" height="28" rx="4" fill="#d4a030" opacity="0.85"/>
  <rect x="106" y="162" width="30" height="24" rx="3" fill="#4080c0" opacity="0.85"/>
  <!-- Price tags -->
  <rect x="28" y="56" width="22" height="8" rx="2" fill="#ffffff" opacity="0.7"/>
  <text x="39" y="63" text-anchor="middle" font-size="5" fill="#1C1917">$8.99</text>
  <rect x="56" y="56" width="22" height="8" rx="2" fill="#ffffff" opacity="0.7"/>
  <text x="67" y="63" text-anchor="middle" font-size="5" fill="#1C1917">$6.50</text>
  <!-- Center shelf unit -->
  <rect x="190" y="30" width="14" height="270" fill="url(#shelfG)"/>
  <rect x="330" y="30" width="14" height="270" fill="url(#shelfG)"/>
  <rect x="188" y="60" width="158" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="188" y="120" width="158" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="188" y="180" width="158" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="188" y="240" width="158" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
