<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1837;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1060;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111530;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1028;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lineChart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d1ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7a5cff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a3cdf;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d1ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0090c0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="kpi1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2060;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1548;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="labelGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d1ff;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7a5cff;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000020" flood-opacity="0.45"/>
    </filter>
    <clipPath id="chartClip">
      <rect x="38" y="140" width="280" height="130"/>
    </clipPath>
    <clipPath id="barClip">
      <rect x="334" y="142" width="164" height="128"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="520" height="360" fill="url(#bg2)"/>

  <!-- Ambient glows -->
  <ellipse cx="140" cy="200" rx="160" ry="120" fill="url(#glow2)" filter="url(#blur2)" opacity="0.65"/>
  <ellipse cx="400" cy="250" rx="130" ry="100" fill="#00d1ff" filter="url(#blur2)" opacity="0.1"/>

  <!-- Decorative dots/shapes -->
  <circle cx="28" cy="36" r="3" fill="#7a5cff" opacity="0.5"/>
  <circle cx="496" cy="28" r="4" fill="#00d1ff" opacity="0.45"/>
  <circle cx="492" cy="340" r="3" fill="#7a5cff" opacity="0.4"/>
  <circle cx="24" cy="340" r="4" fill="#00d1ff" opacity="0.3"/>
  <polygon points="490,120 500,138 480,138" fill="none" stroke="#7a5cff" stroke-width="1.2" opacity="0.3"/>
  <rect x="14" y="200" width="10" height="10" rx="2" fill="none" stroke="#00d1ff" stroke-width="1.2" opacity="0.3" transform="rotate(20 19 205)"/>

  <!-- Main dashboard panel -->
  <rect x="18" y="18" width="484" height="298" rx="12" fill="url(#panelGrad)" filter="url(#panelShadow)"/>
  <rect x="18" y="18" width="484" height="298" rx="12" fill="none" stroke="#7a5cff" stroke-width="0.8" opacity="0.3"/>

  <!-- Dashboard header -->
  <rect x="18" y="18" width="484" height="38" rx="12" fill="#0a0d22"/>
  <rect x="18" y="44" width="484" height="12" rx="0" fill="#0a0d22"/>
  <!-- Header dots -->
  <circle cx="40" cy="37" r="5" fill="#ff5f57" opacity="0.7"/>
  <circle cx="58" cy="37" r="5" fill="#febc2e" opacity="0.7"/>
  <circle cx="76" cy="37" r="5" fill="#28c840" opacity="0.7"/>
  <!-- Header title -->
  <text x="120" y="41" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#c0b8ff" opacity="0.9">Analytics Dashboard</text>
  <!-- Header action buttons -->
  <rect x="380" y="29" width="50" height="16" rx="8" fill="#7a5cff" opacity="0.6"/>
  <text x="405" y="40" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" opacity="0.9">Export</text>
  <rect x="438" y="29" width="50" height="16" rx="8" fill="#1e1a44" opacity="0.8"/>
  <text x="463" y="40" font-family="Arial, sans-serif" font-size="9" fill="#c0b8ff" text-anchor="middle" opacity="0.9">Filtrer</text>

  <!-- KPI Cards row (4 cards) -->
  <!-- Card 1: Visitors -->
  <rect x="30" y="66" width="106" height="62" rx="8" fill="url(#kpi1Grad)"/>
  <rect x="30" y="66" width="106" height="62" rx="8" fill="none" stroke="#7a5cff" stroke-width="0.8" opacity="0.4"/>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="9" fill="#9090c0" opacity="0.85">Visiteurs</text>
  <text x="42" y="101" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">24.8K</text>
  <text x="42" y="116" font-family="Arial, sans-serif" font-size="9" fill="#00d1ff">&#x2B06; +18.4%</text>
  <circle cx="116" cy="80" r="10" fill="#7a5cff" opacity="0.2"/>
  <text x="116" y="84" font-family="Arial, sans-serif" font-size="11" fill="#7a5cff" text-anchor="middle">&#x1F441;</text>

  <!-- Card 2: Conversion -->
  <rect x="144" y="66" width="106" height="62" rx="8" fill="url(#kpi1Grad)"/>
  <rect x="144" y="66" width="106" height="62" rx="8" fill="none" stroke="#00d1ff" stroke-width="0.8" opacity="0.4"/>
  <text x="156" y="84" font-family="Arial, sans-serif" font-size="9" fill="#9090c0" opacity="0.85">Conversion</text>
  <text x="156" y="101" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">4.7%</text>
  <text x="156" y="116" font-family="Arial, sans-serif" font-size="9" fill="#00d1ff">&#x2B06; +2.1%</text>
  <circle cx="230" cy="80" r="10" fill="#00d1ff" opacity="0.15"/>
  <text x="230" y="84" font-family="Arial, sans-serif" font-size="11" fill="#00d1ff" text-anchor="middle">%</text>

  <!-- Card 3: Load Time -->
  <rect x="258" y="66" width="106" height="62" rx="8" fill="url(#kpi1Grad)"/>
  <rect x="258" y="66" width="106" height="62" rx="8" fill="none" stroke="#7a5cff" stroke-width="0.8" opacity="0.35"/>
  <text x="270" y="84" font-family="Arial, sans-serif" font-size="9" fill="#9090c0" opacity="0.85">Load Time</text>
  <text x="270" y="101" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">1.2s</text>
  <text x="270" y="116" font-family="Arial, sans-serif" font-size="9" fill="#28c840">&#x2B07; -0.3s</text>
  <circle cx="344" cy="80" r="10" fill="#7a5cff" opacity="0.15"/>
  <text x="344" y="84" font-family="Arial, sans-serif" font-size="11" fill="#7a5cff" text-anchor="middle">&#x26A1;</text>

  <!-- Card 4: Score -->
  <rect x="372" y="66" width="106" height="62" rx="8" fill="url(#kpi1Grad)"/>
  <rect x="372" y="66" width="106" height="62" rx="8" fill="none" stroke="#00d1ff" stroke-width="0.8" opacity="0.35"/>
  <text x="384" y="84" font-family="Arial, sans-serif" font-size="9" fill="#9090c0" opacity="0.85">Score</text>
  <text x="384" y="101" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">98</text>
  <text x="384" y="116" font-family="Arial, sans-serif" font-size="9" fill="#28c840">&#x2605; Excellent</text>
  <circle cx="458" cy="80" r="10" fill="#00d1ff" opacity="0.15"/>
  <text x="458" y="84" font-family="Arial, sans-serif" font-size="11" fill="#00d1ff" text-anchor="middle">&#x2605;</text>

  <!-- LINE CHART (traffic growth) -->
  <rect x="30" y="140" width="288" height="144" rx="8" fill="#0a0e22" opacity="0.7"/>
  <rect x="30" y="140" width="288" height="144" rx="8" fill="none" stroke="#7a5cff" stroke-width="0.7" opacity="0.3"/>
  <text x="44" y="158" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#c0b8ff" opacity="0.8">Trafic — 6 derniers mois</text>

  <!-- Chart grid lines -->
  <line x1="42" y1="168" x2="308" y2="168" stroke="#2a2a50" stroke-width="0.8" opacity="0.6"/>
  <line x1="42" y1="184" x2="308" y2="184" stroke="#2a2a50" stroke-width="0.8" opacity="0.6"/>
  <line x1="42" y1="200" x2="308" y2="200" stroke="#2a2a50" stroke-width="0.8" opacity="0.6"/>
  <line x1="42" y1="216" x2="308" y2="216" stroke="#2a2a50" stroke-width="0.8" opacity="0.6"/>
  <line x1="42" y1="232" x2="308" y2="232" stroke="#2a2a50" stroke-width="0.8" opacity="0.6"/>
  <line x1="42" y1="248" x2="308" y2="248" stroke="#2a2a50" stroke-width="0.8" opacity="0.6"/>
  <!-- Y axis labels -->
  <text x="38" y="172" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="end">5K</text>
  <text x="38" y="204" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="end">3K</text>
  <text x="38" y="236" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="end">1K</text>
  <!-- X axis labels -->
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">Jan</text>
  <text x="104" y="270" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">Fév</text>
  <text x="148" y="270" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">Mar</text>
  <text x="192" y="270" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">Avr</text>
  <text x="236" y="270" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">Mai</text>
  <text x="280" y="270" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">Jun</text>

  <!-- Area fill under line chart -->
  <polygon points="60,240 104,228 148,212 192,196 236,176 280,162 280,256 60,256"
           fill="url(#areaFill)" clip-path="url(#chartClip)" opacity="0.8"/>

  <!-- Line chart path (traffic growth) -->
  <polyline points="60,240 104,228 148,212 192,196 236,176 280,162"
            fill="none" stroke="url(#lineChart)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            clip-path="url(#chartClip)"/>

  <!-- Data point circles -->
  <circle cx="60" cy="240" r="3.5" fill="#7a5cff" stroke="white" stroke-width="1.5"/>
  <circle cx="104" cy="228" r="3.5" fill="#7a5cff" stroke="white" stroke-width="1.5"/>
  <circle cx="148" cy="212" r="3.5" fill="#8a6cff" stroke="white" stroke-width="1.5"/>
  <circle cx="192" cy="196" r="3.5" fill="#9a7cff" stroke="white" stroke-width="1.5"/>
  <circle cx="236" cy="176" r="3.5" fill="#40b8f0" stroke="white" stroke-width="1.5"/>
  <!-- Last point highlighted -->
  <circle cx="280" cy="162" r="5" fill="#00d1ff" stroke="white" stroke-width="2"/>
  <!-- Tooltip on last point -->
  <rect x="268" y="148" width="38" height="14" rx="7" fill="#7a5cff"/>
  <text x="287" y="158" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="600">4.8K</text>

  <!-- BAR CHART (weekly traffic) -->
  <rect x="326" y="140" width="176" height="144" rx="8" fill="#0a0e22" opacity="0.7"/>
  <rect x="326" y="140" width="176" height="144" rx="8" fill="none" stroke="#00d1ff" stroke-width="0.7" opacity="0.3"/>
  <text x="338" y="158" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#80eeff" opacity="0.8">Trafic hebdo</text>

  <!-- Bar chart grid -->
  <line x1="340" y1="168" x2="490" y2="168" stroke="#1a1a40" stroke-width="0.8" opacity="0.8"/>
  <line x1="340" y1="185" x2="490" y2="185" stroke="#1a1a40" stroke-width="0.8" opacity="0.8"/>
  <line x1="340" y1="202" x2="490" y2="202" stroke="#1a1a40" stroke-width="0.8" opacity="0.8"/>
  <line x1="340" y1="219" x2="490" y2="219" stroke="#1a1a40" stroke-width="0.8" opacity="0.8"/>
  <line x1="340" y1="236" x2="490" y2="236" stroke="#1a1a40" stroke-width="0.8" opacity="0.8"/>

  <!-- Bars (7 days, Mon-Sun) -->
  <!-- Mon -->
  <rect x="344" y="210" width="16" height="36" rx="3" fill="url(#bar1Grad)" opacity="0.85" clip-path="url(#barClip)"/>
  <!-- Tue -->
  <rect x="364" y="198" width="16" height="48" rx="3" fill="url(#bar1Grad)" opacity="0.85" clip-path="url(#barClip)"/>
  <!-- Wed -->
  <rect x="384" y="185" width="16" height="61" rx="3" fill="url(#bar2Grad)" opacity="0.85" clip-path="url(#barClip)"/>
  <!-- Thu -->
  <rect x="404" y="175" width="16" height="71" rx="3" fill="url(#bar2Grad)" opacity="0.9" clip-path="url(#barClip)"/>
  <!-- Fri -->
  <rect x="424" y="168" width="16" height="78" rx="3" fill="url(#bar2Grad)" opacity="0.9" clip-path="url(#barClip)"/>
  <!-- Sat -->
  <rect x="444" y="205" width="16" height="41" rx="3" fill="url(#bar1Grad)" opacity="0.75" clip-path="url(#barClip)"/>
  <!-- Sun -->
  <rect x="464" y="220" width="16" height="26" rx="3" fill="url(#bar1Grad)" opacity="0.65" clip-path="url(#barClip)"/>

  <!-- Day labels -->
  <text x="352" y="254" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">L</text>
  <text x="372" y="254" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">M</text>
  <text x="392" y="254" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">M</text>
  <text x="412" y="254" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">J</text>
  <text x="432" y="254" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">V</text>
  <text x="452" y="254" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">S</text>
  <text x="472" y="254" font-family="Arial, sans-serif" font-size="8" fill="#6060a0" text-anchor="middle">D</text>

  <!-- Legend row under charts -->
  <circle cx="38" cy="294" r="5" fill="#7a5cff"/>
  <text x="47" y="298" font-family="Arial, sans-serif" font-size="9" fill="#9090c0">Sessions uniques</text>
  <circle cx="168" cy="294" r="5" fill="#00d1ff"/>
  <text x="177" y="298" font-family="Arial, sans-serif" font-size="9" fill="#9090c0">Pages vues</text>

  <!-- Label "PERFORMANCE" -->
  <rect x="160" y="316" width="200" height="36" rx="18" fill="url(#labelGrad2)" opacity="0.97"/>
  <rect x="162" y="318" width="196" height="32" rx="16" fill="white" opacity="0.05"/>
  <text x="260" y="339" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2.5">PERFORMANCE</text>
</svg>
