  <rect x="356" y="218" width="200" height="8" rx="2" fill="#162040"/>
  <circle cx="363" cy="222" r="2.5" fill="#FF5F57"/>
  <circle cx="371" cy="222" r="2.5" fill="#FFBD2E"/>
  <circle cx="379" cy="222" r="2.5" fill="#28C840"/>
  <rect x="388" y="219" width="120" height="6" rx="3" fill="#1E3A5F"/>

  <!-- Laptop keyboard base -->
  <path d="M300 308 L625 308 L635 325 L290 325Z" fill="#2A2A3A"/>
  <!-- Trackpad -->
  <rect x="427" y="313" width="90" height="8" rx="3" fill="#3A3A4A"/>
  <!-- Keyboard area hint -->
  <rect x="310" y="310" width="108" height="6" rx="1" fill="#222232" opacity="0.5"/>
  <rect x="430" y="310" width="108" height="6" rx="1" fill="#222232" opacity="0.5"/>

  <!-- NOTEBOOK on desk -->
  <path d="M620 275 L760 270 L765 315 L625 320Z" fill="#F59E0B" filter="url(#softShadow)"/>
  <path d="M622 278 L758 273 L763 312 L627 317Z" fill="white" opacity="0.85"/>
  <!-- Notebook spiral binding -->
  <rect x="623" y="276" width="6" height="42" rx="3" fill="#C4880A"/>
  <circle cx="626" cy="281" r="3" fill="#C4880A"/>
  <circle cx="626" cy="291" r="3" fill="#C4880A"/>
  <circle cx="626" cy="301" r="3" fill="#C4880A"/>
  <circle cx="626" cy="311" r="3" fill="#C4880A"/>
  <!-- Notebook lines -->
  <line x1="636" y1="284" x2="755" y2="280" stroke="#E8D0A0" stroke-width="1"/>
  <line x1="636" y1="292" x2="756" y2="288" stroke="#E8D0A0" stroke-width="1"/>
  <line x1="636" y1="300" x2="756" y2="296" stroke="#E8D0A0" stroke-width="1"/>
  <line x1="636" y1="308" x2="757" y2="304" stroke="#E8D0A0" stroke-width="1"/>
  <!-- Pen on notebook -->
  <path d="M648 274 L652 318" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
  <path d="M648 274 L650 268 L654 274Z" fill="#F59E0B"/>

  <!-- COFFEE CUP on desk (left of laptop) -->
  <ellipse cx="252" cy="303" rx="26" ry="8" fill="#8B6030" opacity="0.5"/>
  <path d="M228 280 L230 305 Q252 312 274 305 L276 280 Q252 274 228 280Z" fill="#F8F4EE"/>
  <path d="M230 282 Q252 276 274 282 L272 288 Q252 282 232 288Z" fill="#2563EB" opacity="0.8"/>
  <!-- Coffee surface -->
  <ellipse cx="252" cy="281" rx="22" ry="7" fill="#6B3A1A"/>
  <ellipse cx="248" cy="280" rx="8" ry="4" fill="#8B5A2A" opacity="0.6"/>
  <!-- Cup handle -->
  <path d="M274 287 Q290 287 290 295 Q290 303 274 303" stroke="#F0E8DC" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="252" cy="306" rx="30" ry="7" fill="#E8E0D0"/>

  <!-- PLANT on desk (far right) -->
  <rect x="730" y="270" width="28" height="40" rx="4" fill="#2563EB" opacity="0.75"/>
  <rect x="732" y="267" width="24" height="6" rx="2" fill="#1E3A5F"/>
  <ellipse cx="744" cy="258" rx="20" ry="14" fill="#2D6A4F"/>
  <ellipse cx="734" cy="255" rx="14" ry="10" fill="#3A8463" opacity="0.85"/>
  <ellipse cx="754" cy="254" rx="14" ry="10" fill="#2D6A4F" opacity="0.85"/>
  <ellipse cx="744" cy="248" rx="10" ry="12" fill="#3A8463"/>

  <!-- SMALL ITEMS on desk -->
  <!-- USB hub / port -->
  <rect x="185" y="293" width="35" height="14" rx="3" fill="#333"/>
  <rect x="188" y="296" width="8" height="8" rx="1" fill="#555"/>
  <rect x="200" y="296" width="8" height="8" rx="1" fill="#555"/>
  <rect x="212" y="296" width="4" height="8" rx="1" fill="#2563EB" opacity="0.7"/>
  <!-- Phone charging -->
  <rect x="178" y="270" width="22" height="36" rx="4" fill="#222"/>
  <rect x="180" y="273" width="18" height="26" rx="2" fill="#2563EB" opacity="0.7"/>
  <rect x="182" y="276" width="14" height="3" rx="1" fill="#F59E0B" opacity="0.8"/>
  <rect x="182" y="282" width="14" height="3" rx="1" fill="#F8FAFC" opacity="0.5"/>
  <rect x="182" y="288" width="10" height="3" rx="1" fill="#F8FAFC" opacity="0.4"/>
  <line x1="189" y1="306" x2="189" y2="318" stroke="#555" stroke-width="2"/>

  <!-- BADGE "Consultant Freelance" -->
  <rect x="565" y="50" width="270" height="78" rx="12" fill="#1E3A5F" filter="url(#shadow)"/>
  <rect x="570" y="55" width="260" height="68" rx="10" fill="#2563EB" opacity="0.25"/>
  <!-- Badge left accent bar -->
  <rect x="570" y="55" width="5" height="68" rx="3" fill="#F59E0B"/>
  <!-- Badge icon circle -->
  <circle cx="608" cy="89" r="22" fill="#2563EB" opacity="0.4"/>
  <circle cx="608" cy="89" r="16" fill="#2563EB" opacity="0.6"/>
  <!-- Person icon -->
  <circle cx="608" cy="82" r="6" fill="#F8FAFC" opacity="0.9"/>
  <path d="M596 100 Q600 91 608 91 Q616 91 620 100" fill="#F8FAFC" opacity="0.9"/>
  <!-- Badge text -->
  <text x="640" y="80" font-size="11" fill="#F8FAFC" font-weight="bold" letter-spacing="0.5">Consultant Freelance</text>
  <text x="640" y="97" font-size="9" fill="#94BEFF" opacity="0.85">Développement · Design · Conseil</text>
  <!-- Badge star/rating -->
  <text x="640" y="112" font-size="11" fill="#F59E0B">★★★★★</text>
  <text x="698" y="112" font-size="9" fill="#94BEFF">5.0 / 5</text>

  <!-- Floor -->
  <rect x="0" y="450" width="900" height="110" fill="url(#floorGrad)"/>
  <!-- Floor plank lines horizontal -->
  <line x1="0" y1="468" x2="900" y2="468" stroke="#B8A888" stroke-width="1" opacity="0.35"/>
  <line x1="0" y1="486" x2="900" y2="486" stroke="#B8A888" stroke-width="1" opacity="0.30"/>
  <line x1="0" y1="504" x2="900" y2="504" stroke="#B8A888" stroke-width="1" opacity="0.30"/>
  <line x1="0" y1="522" x2="900" y2="522" stroke="#B8A888" stroke-width="1" opacity="0.28"/>
  <!-- Floor plank lines vertical (plank segments) -->
  <line x1="150" y1="450" x2="150" y2="560" stroke="#B8A888" stroke-width="1" opacity="0.25"/>
  <line x1="350" y1="450" x2="350" y2="560" stroke="#B8A888" stroke-width="1" opacity="0.25"/>
  <line x1="550" y1="450" x2="550" y2="560" stroke="#B8A888" stroke-width="1" opacity="0.25"/>
  <line x1="750" y1="450" x2="750" y2="560" stroke="#B8A888" stroke-width="1" opacity="0.25"/>
</svg>
