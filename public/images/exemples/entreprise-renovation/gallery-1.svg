<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <defs>
    <linearGradient id="er-g1-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a38"/>
      <stop offset="100%" style="stop-color:#2d3a4a"/>
    </linearGradient>
    <linearGradient id="er-g1-leftWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a1f12"/>
      <stop offset="100%" style="stop-color:#3d2c1a"/>
    </linearGradient>
    <linearGradient id="er-g1-rightWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e4e0"/>
      <stop offset="100%" style="stop-color:#f2eeea"/>
    </linearGradient>
    <linearGradient id="er-g1-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666"/>
      <stop offset="50%" style="stop-color:#999"/>
      <stop offset="100%" style="stop-color:#666"/>
    </linearGradient>
    <linearGradient id="er-g1-newTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <linearGradient id="er-g1-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94A3B8"/>
      <stop offset="100%" style="stop-color:#7a8ea0"/>
    </linearGradient>
    <linearGradient id="er-g1-toolMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#888"/>
      <stop offset="50%" style="stop-color:#bbb"/>
      <stop offset="100%" style="stop-color:#888"/>
    </linearGradient>
    <filter id="er-g1-shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="360" fill="url(#er-g1-bg)"/>

  <!-- Floor -->
  <rect x="0" y="290" width="520" height="70" fill="url(#er-g1-floor)"/>
  <!-- Floor tiles -->
  <g stroke="#8898aa" stroke-width="0.5" fill="none">
    <line x1="0" y1="310" x2="520" y2="310"/><line x1="0" y1="330" x2="520" y2="330"/><line x1="0" y1="350" x2="520" y2="350"/>
    <line x1="40" y1="290" x2="40" y2="360"/><line x1="80" y1="290" x2="80" y2="360"/>
    <line x1="120" y1="290" x2="120" y2="360"/><line x1="160" y1="290" x2="160" y2="360"/>
    <line x1="200" y1="290" x2="200" y2="360"/><line x1="240" y1="290" x2="240" y2="360"/>
    <line x1="280" y1="290" x2="280" y2="360"/><line x1="320" y1="290" x2="320" y2="360"/>
    <line x1="360" y1="290" x2="360" y2="360"/><line x1="400" y1="290" x2="400" y2="360"/>
    <line x1="440" y1="290" x2="440" y2="360"/><line x1="480" y1="290" x2="480" y2="360"/>
  </g>

  <!-- ===== LEFT SIDE: Old/Exposed wall with pipes ===== -->
  <rect x="0" y="40" width="248" height="250" fill="url(#er-g1-leftWall)"/>
  <!-- Exposed plaster / brick texture hints -->
  <g opacity="0.3">
    <rect x="10" y="55" width="55" height="22" rx="1" fill="#5c3d1e"/>
    <rect x="70" y="55" width="55" height="22" rx="1" fill="#5c3d1e"/>
    <rect x="130" y="55" width="55" height="22" rx="1" fill="#5c3d1e"/>
    <rect x="190" y="55" width="55" height="22" rx="1" fill="#5c3d1e"/>
    <rect x="10" y="82" width="55" height="22" rx="1" fill="#5c3d1e"/>
    <rect x="70" y="82" width="55" height="22" rx="1" fill="#4a2e10"/>
    <rect x="130" y="82" width="55" height="22" rx="1" fill="#5c3d1e"/>
    <rect x="190" y="82" width="55" height="22" rx="1" fill="#4a2e10"/>
    <rect x="10" y="109" width="55" height="22" rx="1" fill="#4a2e10"/>
    <rect x="70" y="109" width="55" height="22" rx="1" fill="#5c3d1e"/>
    <rect x="130" y="109" width="55" height="22" rx="1" fill="#4a2e10"/>
    <rect x="190" y="109" width="55" height="22" rx="1" fill="#5c3d1e"/>
  </g>
  <!-- Exposed area / torn plaster -->
  <path d="M30 135 Q60 128 80 140 Q100 130 120 138 Q150 125 170 135 Q200 128 220 138 L225 290 L25 290 Z" fill="#2a1e0e" opacity="0.6"/>
  <!-- Exposed pipe - vertical main -->
  <rect x="58" y="45" width="14" height="250" rx="7" fill="url(#er-g1-pipe)"/>
  <!-- Pipe joint elbow -->
  <rect x="58" y="120" width="50" height="14" rx="7" fill="url(#er-g1-pipe)"/>
  <circle cx="108" cy="127" r="7" fill="#777" stroke="#555" stroke-width="1"/>
  <!-- Smaller horizontal pipe -->
  <rect x="58" y="170" width="80" height="10" rx="5" fill="url(#er-g1-pipe)" opacity="0.85"/>
  <circle cx="138" cy="175" r="6" fill="#666" stroke="#444" stroke-width="1"/>
  <!-- Vertical drain pipe (thinner) -->
  <rect x="160" y="80" width="9" height="215" rx="4.5" fill="#777" opacity="0.9"/>
  <!-- Pipe fittings/clamps -->
  <rect x="54" y="90" width="22" height="7" rx="3" fill="#555"/>
  <rect x="54" y="190" width="22" height="7" rx="3" fill="#555"/>
  <rect x="54" y="240" width="22" height="7" rx="3" fill="#555"/>
  <!-- Old tiles remnants -->
  <rect x="15" y="45" width="38" height="38" rx="1" fill="#4a3018" stroke="#2d1e0a" stroke-width="1" opacity="0.7"/>
  <rect x="185" y="45" width="38" height="38" rx="1" fill="#4a3018" stroke="#2d1e0a" stroke-width="1" opacity="0.5"/>

  <!-- Center: Progress divider (construction mesh/barrier) -->
  <rect x="247" y="40" width="28" height="253" fill="#334155" opacity="0.7"/>
  <!-- Vertical yellow construction tape -->
  <rect x="249" y="40" width="8" height="253" fill="#F97316" opacity="0.25"/>
  <rect x="261" y="40" width="8" height="253" fill="#F97316" opacity="0.25"/>
  <!-- Mesh pattern on divider -->
  <g stroke="#F97316" stroke-width="0.7" opacity="0.4" fill="none">
    <line x1="249" y1="60" x2="275" y2="80"/><line x1="249" y1="80" x2="275" y2="100"/>
    <line x1="249" y1="100" x2="275" y2="120"/><line x1="249" y1="120" x2="275" y2="140"/>
    <line x1="249" y1="140" x2="275" y2="160"/><line x1="249" y1="160" x2="275" y2="180"/>
    <line x1="249" y1="180" x2="275" y2="200"/><line x1="249" y1="200" x2="275" y2="220"/>
    <line x1="249" y1="220" x2="275" y2="240"/><line x1="249" y1="240" x2="275" y2="260"/>
    <line x1="275" y1="60" x2="249" y2="80"/><line x1="275" y1="80" x2="249" y2="100"/>
    <line x1="275" y1="100" x2="249" y2="120"/><line x1="275" y1="120" x2="249" y2="140"/>
    <line x1="275" y1="140" x2="249" y2="160"/><line x1="275" y1="160" x2="249" y2="180"/>
    <line x1="275" y1="180" x2="249" y2="200"/><line x1="275" y1="200" x2="249" y2="220"/>
    <line x1="275" y1="220" x2="249" y2="240"/>
  </g>

  <!-- ===== RIGHT SIDE: New clean tiles ===== -->
  <rect x="275" y="40" width="245" height="250" fill="url(#er-g1-rightWall)"/>
  <!-- New tile grid - crisp white -->
  <g stroke="#d0cdc8" stroke-width="1" fill="none">
    <line x1="275" y1="80" x2="520" y2="80"/><line x1="275" y1="120" x2="520" y2="120"/>
    <line x1="275" y1="160" x2="520" y2="160"/><line x1="275" y1="200" x2="520" y2="200"/>
    <line x1="275" y1="240" x2="520" y2="240"/><line x1="275" y1="280" x2="520" y2="280"/>
    <line x1="315" y1="40" x2="315" y2="290"/><line x1="355" y1="40" x2="355" y2="290"/>
    <line x1="395" y1="40" x2="395" y2="290"/><line x1="435" y1="40" x2="435" y2="290"/>
    <line x1="475" y1="40" x2="475" y2="290"/>
  </g>
  <!-- New shower niche with chrome fixtures -->
  <rect x="380" y="100" width="80" height="60" rx="3" fill="#e0ddd8" stroke="#c8c5c0" stroke-width="1"/>
  <rect x="385" y="105" width="70" height="50" rx="2" fill="#d8d5d0"/>
  <!-- Chrome shower rod / rail -->
  <rect x="290" y="95" width="130" height="6" rx="3" fill="url(#er-g1-toolMetal)"/>
  <circle cx="290" cy="98" r="5" fill="#999"/>
  <circle cx="420" cy="98" r="5" fill="#999"/>
  <!-- Modern soap niche in wall -->
  <rect x="465" y="145" width="45" height="30" rx="2" fill="#d0ccc8" stroke="#b8b5b0" stroke-width="0.8"/>

  <!-- ===== TOOLS on floor ===== -->
  <!-- Tape measure -->
  <g transform="translate(30, 305)">
    <rect x="0" y="0" width="45" height="30" rx="5" fill="#F97316"/>
    <rect x="3" y="3" width="39" height="24" rx="4" fill="#ea6a0a"/>
    <rect x="18" y="8" width="8" height="14" rx="2" fill="#ffd080"/>
    <rect x="0" y="12" width="18" height="5" rx="2" fill="#c0c0c0"/>
    <text x="22" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff" font-weight="bold">5m</text>
  </g>
  <!-- Level tool -->
  <g transform="translate(90, 310)">
    <rect x="0" y="0" width="90" height="18" rx="4" fill="#334155"/>
    <rect x="4" y="3" width="82" height="12" rx="3" fill="#3d4f66"/>
    <rect x="35" y="5" width="20" height="8" rx="3" fill="#1a2838" stroke="#F97316" stroke-width="0.8"/>
    <circle cx="45" cy="9" r="3" fill="#00d0a0" opacity="0.9"/>
    <line x1="45" y1="9" x2="46" y2="9" stroke="#00d0a0" stroke-width="1" opacity="0.8"/>
  </g>
  <!-- Trowel -->
  <g transform="translate(200, 302)">
    <rect x="0" y="4" width="55" height="16" rx="2" fill="#94A3B8"/>
    <polygon points="55,4 55,20 75,12" fill="#7a8ea0"/>
    <rect x="-10" y="8" width="12" height="8" rx="2" fill="#5c3d1e"/>
    <rect x="-20" y="9" width="12" height="6" rx="3" fill="#4a2e10"/>
  </g>
  <!-- Helmet (hard hat silhouette) -->
  <g transform="translate(340, 295)">
    <ellipse cx="32" cy="30" rx="32" ry="12" fill="#F97316"/>
    <path d="M5 30 Q5 10 32 8 Q59 10 59 30 Z" fill="#F97316"/>
    <path d="M8 30 Q8 14 32 12 Q56 14 56 30 Z" fill="#e86a0a"/>
    <rect x="10" y="28" width="44" height="5" rx="2" fill="#cc5a00"/>
  </g>
  <!-- Bucket of cement -->
  <g transform="translate(420, 295)">
    <path d="M8 0 L52 0 L48 50 L12 50 Z" fill="#94A3B8"/>
    <path d="M8 0 L52 0 L50 8 L10 8 Z" fill="#7a8ea0"/>
    <ellipse cx="30" cy="0" rx="22" ry="5" fill="#aab4c0"/>
    <path d="M12 8 Q30 18 48 8" stroke="#888" stroke-width="1.5" fill="none"/>
    <!-- Cement texture -->
    <ellipse cx="30" cy="30" rx="18" ry="5" fill="#7a8ea0" opacity="0.5"/>
  </g>
  <!-- Paintbrush -->
  <g transform="translate(486, 298)">
    <rect x="8" y="0" width="6" height="40" rx="3" fill="#8B6914"/>
    <rect x="6" y="35" width="10" height="5" fill="#666"/>
    <path d="M6 40 Q11 55 16 40 Z" fill="#4a4a8a"/>
  </g>

  <!-- TOP LABEL BOX -->
  <rect x="0" y="0" width="520" height="40" fill="#334155"/>
  <rect x="0" y="37" width="520" height="3" fill="#F97316"/>
  <text x="260" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" letter-spacing="2">SALLE DE BAIN</text>
  <!-- Progress label -->
  <rect x="195" y="340" width="130" height="16" rx="4" fill="#F97316" opacity="0.9"/>
  <text x="260" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">EN COURS DE RÉNOVATION</text>
</svg>
