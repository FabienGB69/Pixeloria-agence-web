<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1a2540"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1a50d0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="520" height="360" fill="url(#bgG)"/>
  <!-- Grid dots for tech feel -->
  <g fill="#F8FAFC" opacity="0.04">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/>
    <circle cx="160" cy="40" r="2"/><circle cx="200" cy="40" r="2"/><circle cx="240" cy="40" r="2"/>
    <circle cx="280" cy="40" r="2"/><circle cx="320" cy="40" r="2"/><circle cx="360" cy="40" r="2"/>
    <circle cx="400" cy="40" r="2"/><circle cx="440" cy="40" r="2"/><circle cx="480" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/><circle cx="120" cy="80" r="2"/>
    <circle cx="160" cy="80" r="2"/><circle cx="200" cy="80" r="2"/><circle cx="240" cy="80" r="2"/>
    <circle cx="280" cy="80" r="2"/><circle cx="320" cy="80" r="2"/><circle cx="360" cy="80" r="2"/>
    <circle cx="400" cy="80" r="2"/><circle cx="440" cy="80" r="2"/><circle cx="480" cy="80" r="2"/>
    <circle cx="40" cy="160" r="2"/><circle cx="80" cy="160" r="2"/>
    <circle cx="160" cy="160" r="2"/><circle cx="200" cy="160" r="2"/>
    <circle cx="320" cy="160" r="2"/><circle cx="360" cy="160" r="2"/>
    <circle cx="440" cy="160" r="2"/><circle cx="480" cy="160" r="2"/>
    <circle cx="40" cy="240" r="2"/><circle cx="80" cy="240" r="2"/>
    <circle cx="440" cy="240" r="2"/><circle cx="480" cy="240" r="2"/>
    <circle cx="40" cy="280" r="2"/><circle cx="80" cy="280" r="2"/><circle cx="120" cy="280" r="2"/>
    <circle cx="400" cy="280" r="2"/><circle cx="440" cy="280" r="2"/><circle cx="480" cy="280" r="2"/>
  </g>
  <!-- Connection lines from center to nodes -->
  <g stroke="#2563EB" stroke-width="1.5" opacity="0.4">
    <line x1="260" y1="175" x2="90" y2="88"/>
    <line x1="260" y1="175" x2="260" y2="55"/>
    <line x1="260" y1="175" x2="430" y2="88"/>
    <line x1="260" y1="175" x2="460" y2="195"/>
    <line x1="260" y1="175" x2="430" y2="278"/>
    <line x1="260" y1="175" x2="260" y2="295"/>
    <line x1="260" y1="175" x2="90" y2="278"/>
    <line x1="260" y1="175" x2="60" y2="195"/>
  </g>
  <!-- Animated pulse rings on center -->
  <circle cx="260" cy="175" r="55" fill="url(#centerGlow)" opacity="0.5"/>
  <circle cx="260" cy="175" r="40" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  <circle cx="260" cy="175" r="70" fill="none" stroke="#2563EB" stroke-width="0.5" opacity="0.15"/>
  <circle cx="260" cy="175" r="100" fill="none" stroke="#2563EB" stroke-width="0.5" opacity="0.1"/>
  <!-- Center node - Freelancer -->
