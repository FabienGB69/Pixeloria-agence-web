<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <defs>
    <linearGradient id="er-g3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2035"/>
      <stop offset="100%" style="stop-color:#222840"/>
    </linearGradient>
    <linearGradient id="er-g3-activeCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#e06010"/>
    </linearGradient>
    <linearGradient id="er-g3-doneCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#2a3548"/>
    </linearGradient>
    <linearGradient id="er-g3-todoCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#252d3e"/>
      <stop offset="100%" style="stop-color:#1e2635"/>
    </linearGradient>
    <linearGradient id="er-g3-connector" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#94A3B8;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="er-g3-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="er-g3-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#00000055"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="360" fill="url(#er-g3-bg)"/>
  <!-- Subtle radial glow around active step -->
  <radialGradient id="er-g3-activeGlow" cx="50%" cy="55%" r="30%">
    <stop offset="0%" style="stop-color:#F97316;stop-opacity:0.15"/>
    <stop offset="100%" style="stop-color:#F97316;stop-opacity:0"/>
  </radialGradient>
  <ellipse cx="260" cy="200" rx="160" ry="100" fill="url(#er-g3-activeGlow)"/>

  <!-- TOP LABEL -->
  <rect x="0" y="0" width="520" height="40" fill="#334155"/>
  <rect x="0" y="37" width="520" height="3" fill="#F97316"/>
  <text x="260" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" letter-spacing="2">NOTRE PROCESSUS</text>

  <!-- Connector lines between steps -->
  <!-- Step 1 → 2 -->
  <line x1="96" y1="195" x2="148" y2="195" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Step 2 → 3 (active line, orange) -->
  <line x1="208" y1="195" x2="260" y2="195" stroke="#F97316" stroke-width="2.5" opacity="0.8"/>
  <!-- Step 3 (active, glowing) → 4 -->
  <line x1="320" y1="195" x2="372" y2="195" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Step 4 → 5 -->
  <line x1="432" y1="195" x2="480" y2="195" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,3" opacity="0.25"/>

  <!-- ====== STEP 1: DEVIS (Done) ====== -->
  <g transform="translate(48, 195)">
    <circle cx="0" cy="0" r="44" fill="url(#er-g3-doneCircle)" filter="url(#er-g3-shadow)"/>
    <circle cx="0" cy="0" r="40" fill="#2a3548" stroke="#4a6080" stroke-width="1.5"/>
    <!-- Checkmark icon (document with check) -->
    <rect x="-14" y="-18" width="22" height="28" rx="3" fill="#4a6080"/>
    <rect x="-14" y="-18" width="22" height="8" rx="3" fill="#5a7090"/>
    <line x1="-9" y1="-4" x2="4" y2="-4" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="-9" y1="2" x2="4" y2="2" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="-9" y1="8" x2="0" y2="8" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Check overlay -->
    <circle cx="10" cy="10" r="10" fill="#334155" stroke="#4a6080" stroke-width="1"/>
    <polyline points="4,10 8,14 16,6" stroke="#00c870" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Step number -->
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">01</text>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#94A3B8">DEVIS</text>
    <text x="0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#647080">Estimation</text>
    <text x="0" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#647080">gratuite</text>
  </g>

  <!-- ====== STEP 2: PLANIFICATION (Done) ====== -->
  <g transform="translate(178, 195)">
    <circle cx="0" cy="0" r="44" fill="url(#er-g3-doneCircle)" filter="url(#er-g3-shadow)"/>
    <circle cx="0" cy="0" r="40" fill="#2a3548" stroke="#4a6080" stroke-width="1.5"/>
    <!-- Calendar icon -->
    <rect x="-16" y="-18" width="32" height="28" rx="3" fill="#4a6080"/>
    <rect x="-16" y="-18" width="32" height="8" rx="3" fill="#3a5070"/>
    <line x1="-8" y1="-20" x2="-8" y2="-14" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="-20" x2="8" y2="-14" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Calendar grid -->
    <g fill="#94A3B8" opacity="0.7">
      <rect x="-13" y="-6" width="5" height="4" rx="1"/>
      <rect x="-4" y="-6" width="5" height="4" rx="1"/>
      <rect x="5" y="-6" width="5" height="4" rx="1"/>
      <rect x="-13" y="2" width="5" height="4" rx="1"/>
      <rect x="-4" y="2" width="5" height="4" rx="1"/>
      <rect x="5" y="2" width="5" height="4" rx="1" fill="#F97316" opacity="1"/>
    </g>
    <!-- Check -->
    <circle cx="12" cy="12" r="10" fill="#334155" stroke="#4a6080" stroke-width="1"/>
    <polyline points="6,12 10,16 18,8" stroke="#00c870" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">02</text>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">PLANIF.</text>
    <text x="0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#647080">Planning</text>
    <text x="0" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#647080">détaillé</text>
  </g>

  <!-- ====== STEP 3: DÉMOLITION (ACTIVE) ====== -->
  <g transform="translate(292, 195)" filter="url(#er-g3-glow)">
    <circle cx="0" cy="0" r="50" fill="#F97316" opacity="0.15"/>
    <circle cx="0" cy="0" r="46" fill="url(#er-g3-activeCircle)" filter="url(#er-g3-shadow)"/>
    <circle cx="0" cy="0" r="42" fill="#e96c0c" stroke="#ffa040" stroke-width="1.5"/>
    <!-- Hammer/demolition icon -->
    <rect x="-20" y="-6" width="30" height="12" rx="3" fill="white" opacity="0.9"/>
    <rect x="10" y="-3" width="12" height="6" rx="2" fill="#ffe080"/>
    <!-- Handle -->
    <rect x="-22" y="-3" width="6" height="26" rx="3" fill="#cc5500" transform="rotate(-30,-22,-3)"/>
    <!-- Flying debris dots -->
    <circle cx="18" cy="-20" r="2.5" fill="white" opacity="0.7"/>
    <circle cx="24" cy="-14" r="2" fill="white" opacity="0.6"/>
    <circle cx="20" cy="-10" r="1.5" fill="white" opacity="0.5"/>
    <!-- Active indicator pulse ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
    <!-- ACTIVE label -->
    <rect x="-22" y="-64" width="44" height="16" rx="4" fill="white"/>
    <text x="0" y="-53" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#F97316">EN COURS</text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#F97316">03</text>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">DÉMOL.</text>
    <text x="0" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffe0c0">Préparation</text>
    <text x="0" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffe0c0">du chantier</text>
  </g>

  <!-- ====== STEP 4: CONSTRUCTION (Upcoming) ====== -->
  <g transform="translate(406, 195)">
    <circle cx="0" cy="0" r="44" fill="url(#er-g3-todoCircle)" filter="url(#er-g3-shadow)"/>
    <circle cx="0" cy="0" r="40" fill="#1e2635" stroke="#334155" stroke-width="1.5"/>
    <!-- Brick/wall icon -->
    <g fill="#334155" stroke="#4a6080" stroke-width="0.5">
      <rect x="-18" y="-14" width="16" height="8" rx="1"/>
      <rect x="2" y="-14" width="16" height="8" rx="1"/>
      <rect x="-10" y="-4" width="16" height="8" rx="1"/>
      <rect x="-18" y="6" width="10" height="8" rx="1"/>
      <rect x="-6" y="6" width="16" height="8" rx="1"/>
      <rect x="12" y="6" width="6" height="8" rx="1"/>
    </g>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a6080">04</text>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6080">CONSTR.</text>
    <text x="0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3a4a5a">Travaux</text>
    <text x="0" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3a4a5a">complets</text>
  </g>

  <!-- ====== STEP 5: LIVRAISON (Upcoming) ====== -->
  <g transform="translate(492, 195)">
    <circle cx="0" cy="0" r="44" fill="url(#er-g3-todoCircle)" filter="url(#er-g3-shadow)"/>
    <circle cx="0" cy="0" r="40" fill="#1e2635" stroke="#334155" stroke-width="1.5"/>
    <!-- House/keys icon -->
    <polygon points="0,-18 -16,-4 -16,14 16,14 16,-4" fill="none" stroke="#334155" stroke-width="2"/>
    <polygon points="0,-18 -16,-4 16,-4" fill="#2a3548"/>
    <rect x="-6" y="2" width="12" height="12" rx="1" fill="#2a3548" stroke="#334155" stroke-width="1"/>
    <circle cx="-2" cy="8" r="2" fill="#334155"/>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a6080">05</text>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6080">LIVRAISON</text>
    <text x="0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3a4a5a">Remise</text>
    <text x="0" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3a4a5a">des clés</text>
  </g>

  <!-- Progress bar at bottom -->
  <rect x="30" y="320" width="460" height="8" rx="4" fill="#1e2635"/>
  <rect x="30" y="320" width="230" height="8" rx="4" fill="#F97316"/>
  <text x="260" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Avancement global : 50%</text>
</svg>
