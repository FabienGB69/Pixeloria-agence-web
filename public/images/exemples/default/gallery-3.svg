<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif" role="img" aria-label="Livraison de projet et checklist">
  <defs>
    <linearGradient id="g3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1837"/>
      <stop offset="100%" stop-color="#1A2550"/>
    </linearGradient>
    <linearGradient id="g3card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2E5A"/>
      <stop offset="100%" stop-color="#162040"/>
    </linearGradient>
    <linearGradient id="g3green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="g3violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#9B7FFF"/>
    </linearGradient>
  </defs>

  <rect width="520" height="360" fill="url(#g3bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="72" x2="520" y2="72"/>
    <line x1="0" y1="144" x2="520" y2="144"/>
    <line x1="0" y1="216" x2="520" y2="216"/>
    <line x1="0" y1="288" x2="520" y2="288"/>
    <line x1="104" y1="0" x2="104" y2="360"/>
    <line x1="208" y1="0" x2="208" y2="360"/>
    <line x1="312" y1="0" x2="312" y2="360"/>
    <line x1="416" y1="0" x2="416" y2="360"/>
  </g>

  <rect x="16" y="14" width="110" height="26" fill="url(#g3violet)" rx="13"/>
  <text x="71" y="31" text-anchor="middle" font-size="11" font-weight="bold" fill="white" letter-spacing="1">LIVRAISON</text>

  <!-- Confetti -->
  <rect x="360" y="18" width="8" height="8" rx="2" fill="#7A5CFF" opacity="0.8" transform="rotate(20 364 22)"/>
  <rect x="390" y="10" width="6" height="6" rx="1" fill="#00D1FF" opacity="0.7" transform="rotate(-15 393 13)"/>
  <rect x="420" y="22" width="7" height="7" rx="2" fill="#F59E0B" opacity="0.8" transform="rotate(30 423 25)"/>
  <rect x="450" y="12" width="5" height="5" rx="1" fill="#10B981" opacity="0.7" transform="rotate(-25 452 14)"/>
  <rect x="478" y="20" width="8" height="8" rx="2" fill="#7A5CFF" opacity="0.6" transform="rotate(10 482 24)"/>
  <circle cx="375" cy="38" r="3" fill="#00D1FF" opacity="0.6"/>
  <circle cx="438" cy="35" r="2" fill="#F59E0B" opacity="0.7"/>
  <circle cx="495" cy="30" r="3" fill="#10B981" opacity="0.5"/>

  <!-- Checklist card -->
  <rect x="30" y="55" width="320" height="278" rx="14" fill="url(#g3card)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Item 1: Design -->
  <g transform="translate(55, 92)">
    <circle cx="0" cy="0" r="13" fill="url(#g3green)"/>
    <path d="M-6 0 l4 5 l9-9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="22" y="5" font-size="14" font-weight="600" fill="#E2E8F0">Design</text>
    <text x="240" y="5" font-size="11" fill="#10B981" font-weight="600">Terminé</text>
  </g>
  <line x1="45" y1="115" x2="335" y2="115" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Item 2: Development -->
  <g transform="translate(55, 138)">
    <circle cx="0" cy="0" r="13" fill="url(#g3green)"/>
    <path d="M-6 0 l4 5 l9-9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="22" y="5" font-size="14" font-weight="600" fill="#E2E8F0">Développement</text>
    <text x="240" y="5" font-size="11" fill="#10B981" font-weight="600">Terminé</text>
  </g>
  <line x1="45" y1="161" x2="335" y2="161" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Item 3: SEO -->
  <g transform="translate(55, 184)">
    <circle cx="0" cy="0" r="13" fill="url(#g3green)"/>
    <path d="M-6 0 l4 5 l9-9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="22" y="5" font-size="14" font-weight="600" fill="#E2E8F0">SEO &amp; Contenu</text>
    <text x="240" y="5" font-size="11" fill="#10B981" font-weight="600">Terminé</text>
  </g>
  <line x1="45" y1="207" x2="335" y2="207" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Item 4: Tests -->
  <g transform="translate(55, 230)">
    <circle cx="0" cy="0" r="13" fill="url(#g3green)"/>
    <path d="M-6 0 l4 5 l9-9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="22" y="5" font-size="14" font-weight="600" fill="#E2E8F0">Tests &amp; Qualité</text>
    <text x="240" y="5" font-size="11" fill="#10B981" font-weight="600">Terminé</text>
  </g>
  <line x1="45" y1="253" x2="335" y2="253" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Item 5: Launch — highlighted -->
  <g transform="translate(55, 276)">
    <circle cx="0" cy="0" r="13" fill="url(#g3green)"/>
    <path d="M-6 0 l4 5 l9-9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="22" y="5" font-size="14" font-weight="700" fill="#FFFFFF">Mise en ligne</text>
    <rect x="195" y="-11" width="72" height="24" rx="12" fill="url(#g3green)"/>
    <text x="231" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="white">✓ LIVRÉ</text>
  </g>

  <!-- Right panel: stats -->
  <rect x="368" y="55" width="128" height="278" rx="14" fill="url(#g3card)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="432" y="88" text-anchor="middle" font-size="10" fill="#94A3B8" font-weight="600" letter-spacing="0.5">DÉLAI</text>
  <text x="432" y="114" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">14</text>
  <text x="432" y="130" text-anchor="middle" font-size="10" fill="#94A3B8">jours</text>
  <line x1="388" y1="144" x2="476" y2="144" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="432" y="165" text-anchor="middle" font-size="10" fill="#94A3B8" font-weight="600" letter-spacing="0.5">SCORE</text>
  <text x="432" y="192" text-anchor="middle" font-size="30" font-weight="800" fill="#10B981">100</text>
  <text x="432" y="208" text-anchor="middle" font-size="10" fill="#94A3B8">Lighthouse</text>
  <line x1="388" y1="222" x2="476" y2="222" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="432" y="243" text-anchor="middle" font-size="10" fill="#94A3B8" font-weight="600" letter-spacing="0.5">SATISFACTION</text>
  <g fill="#F59E0B">
    <text x="399" y="264" font-size="14">★</text>
    <text x="413" y="264" font-size="14">★</text>
    <text x="427" y="264" font-size="14">★</text>
    <text x="441" y="264" font-size="14">★</text>
    <text x="455" y="264" font-size="14">★</text>
  </g>
  <text x="432" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#F59E0B">5 / 5</text>

  <rect x="388" y="300" width="88" height="20" rx="10" fill="url(#g3violet)" opacity="0.8"/>
  <text x="432" y="314" text-anchor="middle" font-size="10" fill="white" font-weight="600">CLIENT SATISFAIT</text>
</svg>
