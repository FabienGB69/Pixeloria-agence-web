<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#f5f0e4"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#c4a882"/>
    </linearGradient>
    <linearGradient id="ceilingG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece4"/>
    </linearGradient>
    <linearGradient id="windowG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#E0F0FF"/>
      <stop offset="100%" stop-color="#90C8A0"/>
    </linearGradient>
    <linearGradient id="sofaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B9BB4"/>
      <stop offset="100%" stop-color="#6B7B94"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000020"/>
    </filter>
  </defs>
  <!-- Ceiling -->
  <rect width="520" height="360" fill="url(#ceilingG)"/>
  <!-- Floor (light wood) -->
  <rect x="0" y="240" width="520" height="120" fill="url(#floorG)"/>
  <!-- Floor planks -->
  <g stroke="#c09070" stroke-width="0.8" opacity="0.5">
    <line x1="0" y1="255" x2="520" y2="255"/>
    <line x1="0" y1="270" x2="520" y2="270"/>
    <line x1="0" y1="285" x2="520" y2="285"/>
    <line x1="0" y1="300" x2="520" y2="300"/>
    <line x1="0" y1="315" x2="520" y2="315"/>
    <line x1="0" y1="330" x2="520" y2="330"/>
    <line x1="0" y1="345" x2="520" y2="345"/>
    <line x1="130" y1="240" x2="100" y2="360"/>
    <line x1="260" y1="240" x2="240" y2="360"/>
    <line x1="390" y1="240" x2="380" y2="360"/>
  </g>
  <!-- Floor-ceiling window (large) -->
  <rect x="310" y="20" width="196" height="240" fill="url(#windowG)"/>
  <rect x="310" y="20" width="196" height="240" fill="none" stroke="#d8d0c4" stroke-width="6"/>
  <!-- Window frame dividers -->
  <line x1="408" y1="20" x2="408" y2="260" stroke="#d8d0c4" stroke-width="4"/>
  <line x1="310" y1="140" x2="506" y2="140" stroke="#d8d0c4" stroke-width="3"/>
  <!-- View through window - trees/garden -->
  <rect x="312" y="22" width="192" height="116" fill="#87CEEB" opacity="0.8"/>
  <rect x="312" y="138" width="192" height="120" fill="#90C8A0" opacity="0.7"/>
  <ellipse cx="360" cy="140" rx="25" ry="40" fill="#228B22" opacity="0.7"/>
  <ellipse cx="380" cy="145" rx="20" ry="35" fill="#2a7a2a" opacity="0.6"/>
  <ellipse cx="460" cy="142" rx="28" ry="38" fill="#228B22" opacity="0.7"/>
  <!-- Window light cast on floor -->
  <rect x="310" y="240" width="196" height="120" fill="#f0e8c0" opacity="0.3"/>
  <!-- Left wall -->
  <rect x="0" y="0" width="70" height="360" fill="#f4f0e8"/>
  <rect x="68" y="0" width="4" height="360" fill="#e0d8cc"/>
  <!-- Back wall -->
  <rect x="70" y="0" width="240" height="240" fill="#f8f4ee"/>
  <!-- Wall art / painting -->
  <rect x="130" y="50" width="120" height="80" rx="3" fill="#e8e0d4" stroke="#d0c8bc" stroke-width="3"/>
  <rect x="136" y="56" width="108" height="68" fill="#b8d0e8" opacity="0.7"/>
  <ellipse cx="186" cy="76" rx="20" ry="20" fill="#D4A853" opacity="0.6"/>
  <ellipse cx="186" cy="90" rx="30" ry="15" fill="#14532D" opacity="0.5"/>
  <!-- Shelf / console -->
  <rect x="90" y="168" width="200" height="10" rx="2" fill="#c8b89a"/>
  <rect x="90" y="178" width="4" height="50" fill="#c8b89a"/>
  <rect x="286" y="178" width="4" height="50" fill="#c8b89a"/>
  <!-- Console decor -->
  <rect x="108" y="148" width="18" height="22" rx="2" fill="#f5e8d0"/>
  <rect x="138" y="150" width="30" height="20" rx="1" fill="#2a5a8a" opacity="0.7"/>
  <circle cx="240" cy="160" r="12" fill="#7B2D42" opacity="0.6"/>
  <!-- Sectional sofa (L-shape suggestion) -->
  <rect x="100" y="220" width="220" height="70" rx="10" fill="url(#sofaG)" filter="url(#softShadow)"/>
  <rect x="100" y="220" width="220" height="15" rx="6" fill="#9aabb8"/>
  <!-- Sofa cushions -->
  <rect x="108" y="235" width="60" height="50" rx="6" fill="#7888a2"/>
  <rect x="175" y="235" width="60" height="50" rx="6" fill="#7888a2"/>
  <rect x="242" y="235" width="70" height="50" rx="6" fill="#7888a2"/>
  <!-- Sofa arm right -->
  <rect x="320" y="220" width="20" height="70" rx="6" fill="#6B7B94"/>
  <!-- Sofa back piece (L) -->
  <rect x="94" y="210" width="246" height="30" rx="8" fill="#8090a8"/>
  <!-- Coffee table -->
  <rect x="150" y="295" width="120" height="55" rx="5" fill="#d4c4a0" filter="url(#softShadow)"/>
  <rect x="154" y="298" width="112" height="48" rx="4" fill="#c8b890" opacity="0.5"/>
  <!-- Table decor: book, plant, tray -->
  <rect x="165" y="305" width="36" height="22" rx="2" fill="#1E293B" opacity="0.7"/>
  <rect x="167" y="307" width="32" height="18" rx="1" fill="#CA8A04" opacity="0.5"/>
  <circle cx="240" cy="314" r="10" fill="#228B22" opacity="0.7"/>
  <rect x="237" y="323" width="6" height="8" fill="#a06030"/>
  <!-- Rug suggestion -->
  <ellipse cx="215" cy="310" rx="110" ry="30" fill="#d4c0a0" opacity="0.3" stroke="#c0a880" stroke-width="1"/>
  <!-- Label -->
  <rect x="0" y="330" width="520" height="30" fill="#14532D" opacity="0.9"/>
  <rect x="0" y="328" width="520" height="4" fill="#CA8A04"/>
  <text x="260" y="350" text-anchor="middle" font-size="14" fill="#FFFBEB" font-weight="bold" letter-spacing="2">LIVING SPACE</text>
</svg>
