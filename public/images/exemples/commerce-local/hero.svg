    <linearGradient id="windowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4EAF5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#B8D8EE" stop-opacity="0.92"/>
