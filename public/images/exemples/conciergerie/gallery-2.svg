<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F6FA"/>
      <stop offset="100%" stop-color="#E8EFF6"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F1E38"/>
      <stop offset="100%" stop-color="#1A3050"/>
    </linearGradient>
    <linearGradient id="bookedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#E8C870"/>
    </linearGradient>
    <linearGradient id="availGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5AC878"/>
      <stop offset="100%" stop-color="#7AE890"/>
    </linearGradient>
    <linearGradient id="partialGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9A60"/>
      <stop offset="100%" stop-color="#FFB880"/>
    </linearGradient>
    <linearGradient id="statCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F4EE"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F1E38" flood-opacity="0.12"/>
    </filter>
    <filter id="panelShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F1E38" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Dashboard background -->
  <rect width="520" height="360" fill="url(#dashBg)"/>

  <!-- Top header bar -->
  <rect x="0" y="0" width="520" height="52" fill="url(#headerGrad)"/>
  <!-- Header logo/title -->
  <text x="24" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#D4A853" letter-spacing="1">PIXELORIA</text>
  <text x="24" y="38" font-family="Arial, sans-serif" font-size="8" fill="#8AAFC8" letter-spacing="0.5">Conciergerie · Tableau de bord</text>
  <!-- Nav items -->
  <rect x="280" y="16" width="52" height="20" rx="4" fill="#1A2E4A"/>
  <text x="306" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8AAFC8">Réservations</text>
  <rect x="340" y="16" width="44" height="20" rx="4" fill="#D4A853"/>
  <text x="362" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0F1E38" font-weight="700">Calendrier</text>
  <rect x="392" y="16" width="38" height="20" rx="4" fill="#1A2E4A"/>
  <text x="411" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8AAFC8">Finances</text>
  <rect x="438" y="16" width="36" height="20" rx="4" fill="#1A2E4A"/>
  <text x="456" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8AAFC8">Avis</text>
  <!-- Avatar circle -->
  <circle cx="492" cy="26" r="14" fill="#D4A853" opacity="0.2"/>
  <circle cx="492" cy="26" r="10" fill="#D4A853" opacity="0.9"/>
  <text x="492" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#0F1E38">LP</text>

  <!-- Month heading -->
  <text x="24" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0F1E38">Juin 2026</text>
  <!-- Month navigation arrows -->
  <polygon points="248,72 254,66 254,78" fill="#0F1E38" opacity="0.5"/>
  <polygon points="270,72 264,66 264,78" fill="#D4A853"/>

  <!-- Occupancy badge -->
  <rect x="286" y="62" width="98" height="26" rx="6" fill="#0F1E38"/>
  <text x="335" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF">Occupation : </text>
  <text x="395" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#D4A853">87 %</text>

  <!-- Calendar panel -->
  <rect x="16" y="92" width="330" height="240" rx="10" fill="#FFFFFF" filter="url(#panelShadow)"/>

  <!-- Day names row -->
  <rect x="16" y="92" width="330" height="28" rx="10" fill="#F5F0EA"/>
  <rect x="16" y="108" width="330" height="12" fill="#F5F0EA"/>
