  <text x="134" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">10</text>
  <text x="181" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">11</text>
  <text x="228" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">12</text>
  <text x="275" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">13</text>
  <text x="322" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">14</text>
  <!-- Available blocks row 2 -->
  <rect x="18" y="157" width="44" height="30" rx="4" fill="url(#availGrad)" opacity="0.7"/>
  <text x="40" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1A4A28">Libre</text>
  <rect x="253" y="157" width="44" height="30" rx="4" fill="url(#availGrad)" opacity="0.7"/>
  <text x="275" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1A4A28">Libre</text>
  <rect x="300" y="157" width="46" height="30" rx="4" fill="url(#availGrad)" opacity="0.7"/>
  <text x="323" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1A4A28">Libre</text>
  <!-- Booked continued row 2 -->
  <rect x="68" y="157" width="180" height="30" rx="4" fill="url(#bookedGrad)" opacity="0.85"/>
  <text x="158" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#0F1E38">Réservé · M. Dupont</text>

