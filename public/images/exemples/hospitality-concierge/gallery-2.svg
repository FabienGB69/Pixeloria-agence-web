    <text x="185" y="122">6</text><text x="229" y="122">7</text><text x="273" y="122">8</text><text x="305" y="122">9</text>
    <text x="53" y="148">10</text><text x="97" y="148">11</text><text x="141" y="148">12</text>
    <text x="185" y="148">13</text><text x="229" y="148">14</text><text x="273" y="148">15</text><text x="305" y="148">16</text>
    <text x="53" y="174">17</text><text x="97" y="174">18</text><text x="141" y="174">19</text>
    <text x="185" y="174">20</text><text x="229" y="174">21</text><text x="273" y="174">22</text><text x="305" y="174">23</text>
