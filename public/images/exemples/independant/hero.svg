<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6C9B0"/>
      <stop offset="100%" stop-color="#C4B59A"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B898"/>
      <stop offset="100%" stop-color="#A89878"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8C8A8"/>
      <stop offset="100%" stop-color="#C8B898"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F2040"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF9E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF9E8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF8D0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF8D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laptopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E8F0"/>
      <stop offset="100%" stop-color="#C8D4E0"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0B090"/>
      <stop offset="100%" stop-color="#A89070"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#00000025"/>
    </filter>
    <filter id="screenGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Room wall background -->
  <rect width="900" height="560" fill="url(#wallBg)"/>

  <!-- Window light from left side -->
  <rect x="0" y="0" width="900" height="560" fill="url(#sunGlow)"/>

  <!-- Left window -->
  <rect x="0" y="60" width="160" height="330" rx="0" fill="url(#windowLight)"/>
  <!-- Window frame -->
  <rect x="22" y="65" width="120" height="280" rx="4" fill="none" stroke="#D0C4A8" stroke-width="8"/>
  <rect x="26" y="69" width="112" height="272" rx="3" fill="#B8D8F0" opacity="0.4"/>
  <!-- Window glass sky view -->
  <rect x="26" y="69" width="112" height="272" rx="3" fill="#D0E8F8" opacity="0.5"/>
  <!-- Window dividers -->
  <line x1="82" y1="69" x2="82" y2="341" stroke="#D0C4A8" stroke-width="6"/>
  <line x1="26" y1="205" x2="138" y2="205" stroke="#D0C4A8" stroke-width="6"/>
  <!-- Window view: sky/trees -->
  <rect x="26" y="69" width="112" height="136" rx="3" fill="#B8D8F0" opacity="0.6"/>
  <ellipse cx="55" cy="200" rx="28" ry="40" fill="#4A8A5A" opacity="0.6"/>
  <ellipse cx="50" cy="185" rx="22" ry="28" fill="#5A9A6A" opacity="0.55"/>
  <ellipse cx="112" cy="210" rx="24" ry="32" fill="#3A7A4A" opacity="0.55"/>
  <!-- Window light stripe on floor -->
  <path d="M0 345 L160 345 L130 420 L0 420Z" fill="#FFF8D0" opacity="0.25"/>

  <!-- BACK WALL SHELF -->
  <rect x="480" y="65" width="360" height="14" rx="3" fill="url(#shelfGrad)" filter="url(#softShadow)"/>
  <!-- Shelf support brackets -->
  <rect x="496" y="65" width="6" height="55" rx="1" fill="#A89070" opacity="0.5"/>
  <rect x="826" y="65" width="6" height="55" rx="1" fill="#A89070" opacity="0.5"/>
  <!-- Shelf items -->
  <!-- Books -->
  <rect x="496" y="32" width="18" height="34" rx="2" fill="#2563EB"/>
  <rect x="496" y="32" width="4" height="34" fill="#1E3A5F"/>
  <rect x="516" y="34" width="16" height="32" rx="2" fill="#1E3A5F"/>
  <rect x="534" y="30" width="20" height="36" rx="2" fill="#F59E0B"/>
  <rect x="534" y="30" width="4" height="36" fill="#D4880A"/>
  <rect x="556" y="33" width="14" height="33" rx="2" fill="#2D6A4F"/>
  <rect x="572" y="31" width="18" height="35" rx="2" fill="#8B2020"/>
  <!-- Small plant on shelf -->
  <rect x="598" y="48" width="16" height="18" rx="3" fill="#2563EB" opacity="0.7"/>
  <ellipse cx="606" cy="45" rx="12" ry="8" fill="#2D6A4F"/>
  <ellipse cx="600" cy="43" rx="8" ry="6" fill="#3A8463" opacity="0.8"/>
  <ellipse cx="612" cy="42" rx="8" ry="6" fill="#2D6A4F" opacity="0.8"/>
  <!-- Award/frame -->
  <rect x="624" y="30" width="44" height="36" rx="3" fill="#C8B898"/>
  <rect x="628" y="34" width="36" height="28" rx="2" fill="#F8FAFC"/>
  <rect x="630" y="36" width="32" height="6" rx="1" fill="#2563EB" opacity="0.7"/>
  <text x="646" y="52" text-anchor="middle" font-size="6" fill="#1E3A5F" font-weight="bold">CERTIFIÉ</text>
  <text x="646" y="59" text-anchor="middle" font-size="5" fill="#666">2023</text>
  <!-- More books -->
  <rect x="678" y="35" width="16" height="31" rx="2" fill="#2563EB" opacity="0.8"/>
  <rect x="696" y="32" width="20" height="34" rx="2" fill="#F59E0B" opacity="0.85"/>
  <rect x="718" y="34" width="14" height="32" rx="2" fill="#1E3A5F"/>
  <rect x="734" y="30" width="22" height="36" rx="2" fill="#2D6A4F"/>
  <!-- Cactus right end -->
  <rect x="764" y="46" width="18" height="20" rx="2" fill="#2563EB" opacity="0.65"/>
  <rect x="769" y="28" width="8" height="20" rx="4" fill="#2D6A4F"/>
  <rect x="760" y="34" width="10" height="6" rx="3" fill="#2D6A4F" opacity="0.8"/>
  <rect x="778" y="36" width="10" height="6" rx="3" fill="#2D6A4F" opacity="0.8"/>
  <rect x="800" y="34" width="16" height="32" rx="2" fill="#8B2020" opacity="0.8"/>
  <rect x="820" y="32" width="14" height="34" rx="2" fill="#2563EB"/>

  <!-- DESK perspective shape -->
  <path d="M155 310 L750 310 L790 420 L115 420Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <path d="M155 305 L750 305 L755 312 L150 312Z" fill="url(#deskTop)"/>
  <!-- Desk left leg -->
  <path d="M155 310 L125 450 L165 450 L195 420 L155 310Z" fill="#A89878"/>
  <!-- Desk right leg -->
  <path d="M750 310 L780 450 L820 450 L790 420 L750 310Z" fill="#A89878"/>
  <!-- Desk wood grain lines -->
  <line x1="200" y1="307" x2="220" y2="415" stroke="#B8A888" stroke-width="1" opacity="0.35"/>
  <line x1="350" y1="307" x2="380" y2="415" stroke="#B8A888" stroke-width="1" opacity="0.30"/>
  <line x1="500" y1="307" x2="535" y2="415" stroke="#B8A888" stroke-width="1" opacity="0.30"/>
  <line x1="630" y1="307" x2="665" y2="415" stroke="#B8A888" stroke-width="1" opacity="0.28"/>

  <!-- LAPTOP on desk -->
  <!-- Screen base/hinge -->
  <path d="M335 205 L590 205 L580 308 L345 308Z" fill="#2A2A3A" filter="url(#shadow)"/>
  <!-- Screen bezel -->
  <path d="M340 210 L585 210 L575 305 L350 305Z" fill="#1A1A2E"/>
  <!-- Screen content (code/design work) -->
  <path d="M352 218 L572 218 L564 298 L360 298Z" fill="url(#screenGrad)" filter="url(#screenGlow)"/>
  <!-- Code lines on screen -->
  <rect x="362" y="224" width="55" height="5" rx="2" fill="#F59E0B" opacity="0.9"/>
  <rect x="370" y="233" width="80" height="4" rx="2" fill="#60A5FA" opacity="0.8"/>
  <rect x="376" y="241" width="65" height="4" rx="2" fill="#34D399" opacity="0.8"/>
  <rect x="376" y="249" width="90" height="4" rx="2" fill="#F8FAFC" opacity="0.6"/>
  <rect x="370" y="257" width="70" height="4" rx="2" fill="#60A5FA" opacity="0.7"/>
  <rect x="376" y="265" width="55" height="4" rx="2" fill="#34D399" opacity="0.7"/>
  <rect x="376" y="273" width="100" height="4" rx="2" fill="#F8FAFC" opacity="0.5"/>
  <rect x="370" y="281" width="75" height="4" rx="2" fill="#60A5FA" opacity="0.7"/>
  <rect x="376" y="289" width="60" height="4" rx="2" fill="#F59E0B" opacity="0.7"/>
  <!-- Screen sidebar -->
  <rect x="486" y="218" width="70" height="80" rx="2" fill="#0F2040" opacity="0.7"/>
  <rect x="490" y="224" width="60" height="8" rx="2" fill="#2563EB" opacity="0.9"/>
  <rect x="490" y="236" width="45" height="5" rx="1" fill="#F8FAFC" opacity="0.4"/>
  <rect x="490" y="245" width="50" height="5" rx="1" fill="#F8FAFC" opacity="0.35"/>
  <rect x="490" y="254" width="42" height="5" rx="1" fill="#F8FAFC" opacity="0.35"/>
  <rect x="490" y="263" width="48" height="5" rx="1" fill="#F59E0B" opacity="0.6"/>
  <rect x="490" y="272" width="40" height="5" rx="1" fill="#F8FAFC" opacity="0.30"/>
  <rect x="490" y="282" width="55" height="10" rx="3" fill="#2563EB" opacity="0.7"/>
