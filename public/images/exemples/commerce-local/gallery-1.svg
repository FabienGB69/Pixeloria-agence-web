  <rect x="408" y="50" width="22" height="44" rx="4" fill="#8B5E3C"/>
  <rect x="411" y="44" width="16" height="8" rx="3" fill="#8B5E3C"/>
  <rect x="414" y="40" width="10" height="6" rx="2" fill="#C4924A"/>
  <rect x="411" y="60" width="15" height="20" rx="1" fill="#FFF8F0" opacity="0.85"/>
  <text x="419" y="70" text-anchor="middle" font-size="4" fill="#8B5E3C" font-weight="bold">VINAIG.</text>
  <text x="419" y="76" text-anchor="middle" font-size="3.5" fill="#8B5E3C">Balsa.</text>
  <rect x="408" y="90" width="30" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="423" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">9.90€</text>

  <!-- SHELF 2 (middle tier) -->
  <rect x="55" y="175" width="410" height="12" rx="2" fill="url(#shelfGrad)" filter="url(#shadow)"/>
  <rect x="55" y="185" width="410" height="4" rx="1" fill="#5A3010" opacity="0.5"/>
  <rect x="68" y="176" width="8" height="80" rx="1" fill="#7A5020" opacity="0.5"/>
  <rect x="445" y="176" width="8" height="80" rx="1" fill="#7A5020" opacity="0.5"/>

  <!-- Shelf 2 products: breads / pastries -->
  <!-- Baguette -->
  <path d="M70 140 Q145 120 200 138 Q145 152 70 152 Z" fill="#C4924A"/>
  <path d="M80 140 Q145 125 195 140" stroke="#A07030" stroke-width="2" fill="none" opacity="0.6"/>
  <rect x="70" y="168" width="100" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="120" y="176" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">Baguette Tradition 1.20€</text>

  <!-- Round bread -->
  <ellipse cx="248" cy="146" rx="38" ry="24" fill="#B87830"/>
  <ellipse cx="248" cy="143" rx="34" ry="20" fill="#C4924A"/>
  <!-- Bread score lines -->
  <path d="M228 140 Q248 134 268 140" stroke="#8B5E3C" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M228 147 Q248 141 268 147" stroke="#8B5E3C" stroke-width="1.5" fill="none" opacity="0.6"/>
  <rect x="213" y="167" width="70" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="248" y="175" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">Pain campagne 2.80€</text>

  <!-- Croissants -->
  <path d="M340 155 Q350 135 370 140 Q385 130 390 150 Q380 162 360 158 Q345 162 340 155Z" fill="#D4A250"/>
  <path d="M345 153 Q355 136 372 141" stroke="#B87830" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M360 158 Q372 140 386 149" stroke="#B87830" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M390 150 Q400 132 418 138 Q430 128 434 148 Q425 160 405 157 Q393 162 390 150Z" fill="#D4A250"/>
  <rect x="350" y="167" width="80" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="390" y="175" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">Croissant Beurre 1.50€</text>

  <!-- SHELF 3 (bottom tier) -->
  <rect x="55" y="255" width="410" height="12" rx="2" fill="url(#shelfGrad)" filter="url(#shadow)"/>
  <rect x="55" y="265" width="410" height="4" rx="1" fill="#5A3010" opacity="0.5"/>

  <!-- Bottom shelf: seasonal items / produce -->
  <!-- Basket of apples -->
  <path d="M70 218 Q70 248 100 250 Q130 252 130 218Z" fill="#8B5E3C" opacity="0.8"/>
  <rect x="75" y="215" width="50" height="6" rx="2" fill="#A07030"/>
  <!-- Apples -->
  <circle cx="86" cy="236" r="10" fill="#C4201A"/>
  <circle cx="100" cy="232" r="11" fill="#D43020"/>
  <circle cx="115" cy="236" r="10" fill="#B01810"/>
  <path d="M100 222 Q102 216 100 214" stroke="#2D6A4F" stroke-width="2" fill="none"/>
  <rect x="72" y="248" width="58" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="101" y="256" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">Pommes 2.50€/kg</text>

  <!-- Cheese block -->
  <rect x="158" y="218" width="65" height="38" rx="3" fill="#E8C870"/>
  <path d="M158 218 L223 218 L240 240 L175 240Z" fill="#F0D890"/>
  <rect x="163" y="228" width="50" height="18" rx="1" fill="#D4B040" opacity="0.4"/>
  <text x="190" y="238" text-anchor="middle" font-size="5.5" fill="#8B5E3C" font-weight="bold">COMTÉ</text>
  <text x="190" y="246" text-anchor="middle" font-size="5" fill="#8B5E3C">18 mois</text>
  <rect x="158" y="252" width="65" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="190" y="260" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">Comté AOP 3.80€</text>

  <!-- Vegetable bundle -->
  <rect x="264" y="222" width="16" height="34" rx="4" fill="#E8734A"/>
  <rect x="284" y="222" width="16" height="34" rx="4" fill="#E8734A" opacity="0.85"/>
  <rect x="304" y="222" width="16" height="34" rx="4" fill="#D4623A"/>
  <!-- Carrot tops -->
  <path d="M272 222 Q268 210 264 205 Q270 208 274 215" fill="#2D6A4F"/>
  <path d="M292 222 Q288 210 284 205 Q290 208 294 215" fill="#2D6A4F"/>
  <path d="M312 222 Q308 210 304 205 Q310 208 314 215" fill="#2D6A4F"/>
  <line x1="263" y1="236" x2="321" y2="236" stroke="#A07030" stroke-width="2"/>
  <rect x="258" y="252" width="72" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="294" y="260" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">Carottes Botte 1.80€</text>

  <!-- Herb pots row -->
  <rect x="368" y="230" width="20" height="25" rx="2" fill="#E8734A"/>
  <rect x="371" y="228" width="14" height="6" rx="1" fill="#C4623A"/>
  <ellipse cx="378" cy="224" rx="12" ry="8" fill="#2D6A4F"/>
  <ellipse cx="372" cy="221" rx="8" ry="6" fill="#3A8463" opacity="0.8"/>
  <text x="378" y="228" text-anchor="middle" font-size="5" fill="#FFF8F0">B</text>
  <rect x="394" y="230" width="20" height="25" rx="2" fill="#8B5E3C"/>
  <rect x="397" y="228" width="14" height="6" rx="1" fill="#6B4A2A"/>
  <ellipse cx="404" cy="224" rx="12" ry="8" fill="#3A8463"/>
  <ellipse cx="398" cy="221" rx="8" ry="6" fill="#2D6A4F" opacity="0.8"/>
  <text x="404" y="228" text-anchor="middle" font-size="5" fill="#FFF8F0">T</text>
  <rect x="418" y="230" width="20" height="25" rx="2" fill="#E8734A" opacity="0.85"/>
  <rect x="421" y="228" width="14" height="6" rx="1" fill="#C4623A"/>
  <ellipse cx="428" cy="224" rx="12" ry="8" fill="#2D6A4F"/>
  <text x="428" y="228" text-anchor="middle" font-size="5" fill="#FFF8F0">M</text>
  <rect x="358" y="252" width="80" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="398" y="260" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">Herbes aromatiques</text>

  <!-- Window frame inner molding -->
  <rect x="42" y="32" width="436" height="271" rx="3" fill="none" stroke="#8B5E3C" stroke-width="3"/>

  <!-- VITRINE label -->
  <rect x="180" y="318" width="160" height="28" rx="14" fill="#2D6A4F" filter="url(#shadow)"/>
  <text x="260" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF8F0" letter-spacing="3">VITRINE</text>
</svg>
