  <text x="134" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">17</text>
  <!-- Partial block row 3 -->
  <rect x="18" y="192" width="44" height="30" rx="4" fill="url(#availGrad)" opacity="0.7"/>
  <text x="40" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1A4A28">Libre</text>
  <rect x="157" y="192" width="188" height="30" rx="4" fill="url(#partialGrad)" opacity="0.85"/>
  <text x="251" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#7A2800">Réservé · Mme Martin</text>

  <!-- Row 4 day numbers -->
  <text x="40" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">22</text>
  <text x="87" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">23</text>
  <text x="134" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">24</text>
  <text x="181" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">25</text>
  <text x="228" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">26</text>
  <text x="275" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">27</text>
  <text x="322" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">28</text>
