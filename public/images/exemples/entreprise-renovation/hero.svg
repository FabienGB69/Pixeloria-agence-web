<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="er-h-beforeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1208"/>
      <stop offset="100%" style="stop-color:#2d1f0e"/>
    </linearGradient>
    <linearGradient id="er-h-oldCabinet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c3d1e"/>
      <stop offset="100%" style="stop-color:#3d2710"/>
    </linearGradient>
    <linearGradient id="er-h-yellowLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#f5c842;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="er-h-afterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e8edf2"/>
    </linearGradient>
    <linearGradient id="er-h-marble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="40%" style="stop-color:#e4e4e4"/>
      <stop offset="70%" style="stop-color:#d8d8d8"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <linearGradient id="er-h-newCabinet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ebebeb"/>
    </linearGradient>
    <linearGradient id="er-h-pendant" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8b0;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#fff8b0;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="er-h-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <linearGradient id="er-h-divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="er-h-shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000055"/>
    </filter>
    <filter id="er-h-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="er-h-leftClip">
      <rect x="0" y="0" width="449" height="560"/>
    </clipPath>
    <clipPath id="er-h-rightClip">
      <rect x="451" y="0" width="449" height="560"/>
    </clipPath>
  </defs>

  <!-- ===== LEFT HALF: AVANT (Before) ===== -->
  <g clip-path="url(#er-h-leftClip)">
    <rect x="0" y="0" width="449" height="560" fill="url(#er-h-beforeBg)"/>
    <!-- Ceiling -->
    <rect x="0" y="0" width="449" height="85" fill="#1e1508"/>
    <!-- Yellow ambient glow from old lamp -->
    <ellipse cx="224" cy="75" rx="190" ry="110" fill="url(#er-h-yellowLight)"/>
    <!-- Old ceiling light (incandescent) -->
    <rect x="196" y="48" width="56" height="8" rx="3" fill="#7a6520"/>
    <ellipse cx="224" cy="62" rx="20" ry="12" fill="#c9a520" opacity="0.9"/>
    <ellipse cx="224" cy="64" rx="14" ry="8" fill="#ffe050" opacity="0.9"/>
    <!-- Old tile wall -->
    <rect x="0" y="85" width="449" height="300" fill="#3a2c18"/>
    <!-- Tile grid - stained -->
    <g stroke="#271d0d" stroke-width="1" fill="none">
      <line x1="0" y1="115" x2="449" y2="115"/><line x1="0" y1="145" x2="449" y2="145"/>
      <line x1="0" y1="175" x2="449" y2="175"/><line x1="0" y1="205" x2="449" y2="205"/>
      <line x1="0" y1="235" x2="449" y2="235"/><line x1="0" y1="265" x2="449" y2="265"/>
      <line x1="0" y1="295" x2="449" y2="295"/><line x1="0" y1="325" x2="449" y2="325"/>
      <line x1="0" y1="355" x2="449" y2="355"/>
      <line x1="45" y1="85" x2="45" y2="385"/><line x1="90" y1="85" x2="90" y2="385"/>
      <line x1="135" y1="85" x2="135" y2="385"/><line x1="180" y1="85" x2="180" y2="385"/>
      <line x1="225" y1="85" x2="225" y2="385"/><line x1="270" y1="85" x2="270" y2="385"/>
      <line x1="315" y1="85" x2="315" y2="385"/><line x1="360" y1="85" x2="360" y2="385"/>
      <line x1="405" y1="85" x2="405" y2="385"/>
    </g>
    <!-- Stain spots on old tiles -->
    <ellipse cx="100" cy="200" rx="14" ry="7" fill="#150d02" opacity="0.55"/>
    <ellipse cx="270" cy="280" rx="10" ry="5" fill="#150d02" opacity="0.45"/>
    <ellipse cx="60" cy="320" rx="8" ry="4" fill="#150d02" opacity="0.4"/>
    <ellipse cx="380" cy="180" rx="9" ry="5" fill="#150d02" opacity="0.35"/>
    <!-- Upper worn cabinets -->
    <rect x="5" y="85" width="439" height="110" fill="url(#er-h-oldCabinet)"/>
    <rect x="8" y="88" width="86" height="104" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="99" y="88" width="88" height="104" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="192" y="88" width="70" height="104" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="267" y="88" width="88" height="104" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="360" y="88" width="84" height="104" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <!-- Brass handles -->
    <circle cx="51" cy="140" r="5" fill="#9a8028"/>
    <circle cx="143" cy="140" r="5" fill="#9a8028"/>
    <circle cx="227" cy="140" r="5" fill="#9a8028"/>
    <circle cx="311" cy="140" r="5" fill="#9a8028"/>
    <circle cx="402" cy="140" r="5" fill="#9a8028"/>
    <!-- Worn paint chips on cabinet doors -->
    <path d="M32 92 Q38 95 35 100" stroke="#2d1b08" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M280 90 Q286 94 283 99" stroke="#2d1b08" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- Countertop - dark formica/laminate -->
    <rect x="0" y="365" width="449" height="18" fill="#261609"/>
    <rect x="0" y="362" width="449" height="5" fill="#311f0b"/>
    <!-- Old double sink -->
    <rect x="130" y="335" width="160" height="35" rx="4" fill="#3d2810"/>
    <rect x="135" y="338" width="68" height="28" rx="3" fill="#200e04"/>
    <rect x="207" y="338" width="78" height="28" rx="3" fill="#200e04"/>
    <rect x="195" y="328" width="7" height="18" rx="3" fill="#6b4828"/>
    <circle cx="198" cy="328" r="5" fill="#5a3a20"/>
    <!-- Lower worn cabinets -->
    <rect x="0" y="383" width="449" height="177" fill="url(#er-h-oldCabinet)"/>
    <rect x="4" y="386" width="88" height="170" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="97" y="386" width="88" height="170" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="190" y="386" width="70" height="170" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="265" y="386" width="88" height="170" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <rect x="358" y="386" width="87" height="170" rx="2" fill="#4a2e12" stroke="#2d1b08" stroke-width="1"/>
    <circle cx="48" cy="470" r="6" fill="#9a8028"/>
    <circle cx="141" cy="470" r="6" fill="#9a8028"/>
    <circle cx="225" cy="470" r="6" fill="#9a8028"/>
    <circle cx="309" cy="470" r="6" fill="#9a8028"/>
    <circle cx="401" cy="470" r="6" fill="#9a8028"/>
    <!-- AVANT Label -->
    <rect x="14" y="510" width="88" height="30" rx="6" fill="#150d02" opacity="0.85"/>
    <text x="58" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f5c840">AVANT</text>
  </g>

  <!-- ===== RIGHT HALF: APRÈS (After) ===== -->
  <g clip-path="url(#er-h-rightClip)">
    <rect x="451" y="0" width="449" height="560" fill="url(#er-h-afterBg)"/>
    <!-- Ceiling -->
    <rect x="451" y="0" width="449" height="85" fill="#f0f2f5"/>
    <!-- Pendant lights -->
    <line x1="570" y1="0" x2="570" y2="88" stroke="#aaa" stroke-width="1.5"/>
    <ellipse cx="570" cy="92" rx="16" ry="9" fill="#1e1e1e" stroke="#444" stroke-width="1"/>
    <ellipse cx="570" cy="97" rx="12" ry="7" fill="#282828"/>
    <ellipse cx="570" cy="100" rx="8" ry="5" fill="url(#er-h-pendant)" filter="url(#er-h-glow)"/>
    <line x1="720" y1="0" x2="720" y2="88" stroke="#aaa" stroke-width="1.5"/>
    <ellipse cx="720" cy="92" rx="16" ry="9" fill="#1e1e1e" stroke="#444" stroke-width="1"/>
    <ellipse cx="720" cy="97" rx="12" ry="7" fill="#282828"/>
    <ellipse cx="720" cy="100" rx="8" ry="5" fill="url(#er-h-pendant)" filter="url(#er-h-glow)"/>
    <line x1="860" y1="0" x2="860" y2="88" stroke="#aaa" stroke-width="1.5"/>
    <ellipse cx="860" cy="92" rx="16" ry="9" fill="#1e1e1e" stroke="#444" stroke-width="1"/>
    <ellipse cx="860" cy="97" rx="12" ry="7" fill="#282828"/>
    <ellipse cx="860" cy="100" rx="8" ry="5" fill="url(#er-h-pendant)" filter="url(#er-h-glow)"/>
    <!-- Clean light grey wall -->
    <rect x="451" y="85" width="449" height="300" fill="#f0f0ee"/>
    <!-- Subtle horizontal wall line -->
    <line x1="451" y1="86" x2="900" y2="86" stroke="#ddd" stroke-width="1"/>
    <!-- White upper cabinets -->
    <rect x="454" y="85" width="442" height="110" fill="url(#er-h-newCabinet)" stroke="#ddd" stroke-width="0.5"/>
    <rect x="457" y="88" width="80" height="104" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="542" y="88" width="82" height="104" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="629" y="88" width="68" height="104" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="702" y="88" width="82" height="104" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="789" y="88" width="102" height="104" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <!-- Modern bar handles -->
    <rect x="487" y="137" width="20" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="573" y="137" width="20" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="656" y="137" width="20" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="733" y="137" width="20" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="826" y="137" width="20" height="2.5" rx="1.25" fill="#94A3B8"/>
    <!-- Marble countertop -->
    <rect x="451" y="363" width="449" height="22" fill="url(#er-h-marble)" stroke="#c4c4c4" stroke-width="0.5"/>
    <!-- Marble veins -->
    <path d="M470 368 Q510 374 555 369 Q595 364 630 371" stroke="#c8c8c8" stroke-width="0.8" fill="none" opacity="0.8"/>
    <path d="M680 366 Q720 372 760 368 Q800 364 840 370" stroke="#b8b8b8" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M455 375 Q490 380 530 376 Q565 372 600 378" stroke="#d4d4d4" stroke-width="0.5" fill="none" opacity="0.6"/>
    <path d="M750 372 Q780 377 820 373" stroke="#c0c0c0" stroke-width="0.5" fill="none" opacity="0.5"/>
    <!-- Countertop shadow edge -->
    <rect x="451" y="385" width="449" height="3" fill="#b8b8b8" opacity="0.4"/>
    <!-- Modern undermount sink -->
    <rect x="610" y="336" width="155" height="34" rx="6" fill="#dcdcdc" stroke="#c0c0c0" stroke-width="1"/>
    <rect x="615" y="339" width="67" height="26" rx="4" fill="#ccc"/>
    <rect x="687" y="339" width="73" height="26" rx="4" fill="#ccc"/>
    <!-- Modern faucet (matte black) -->
    <rect x="688" y="322" width="5" height="22" rx="2.5" fill="#555"/>
    <path d="M690 322 Q712 315 722 327" stroke="#555" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="722" cy="327" r="3.5" fill="#555"/>
    <!-- Lower white cabinets -->
    <rect x="451" y="388" width="449" height="172" fill="url(#er-h-newCabinet)" stroke="#ddd" stroke-width="0.5"/>
    <rect x="454" y="391" width="84" height="165" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="543" y="391" width="84" height="165" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="632" y="391" width="68" height="165" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="705" y="391" width="85" height="165" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="795" y="391" width="100" height="165" rx="2" fill="white" stroke="#d8d8d8" stroke-width="0.8"/>
    <rect x="483" y="471" width="24" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="572" y="471" width="24" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="660" y="471" width="24" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="735" y="471" width="24" height="2.5" rx="1.25" fill="#94A3B8"/>
    <rect x="830" y="471" width="24" height="2.5" rx="1.25" fill="#94A3B8"/>
    <!-- APRÈS label -->
    <rect x="797" y="510" width="88" height="30" rx="6" fill="#F97316"/>
    <text x="841" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">APRÈS</text>
  </g>

  <!-- ===== DIVIDER LINE ===== -->
  <line x1="450" y1="60" x2="450" y2="560" stroke="url(#er-h-divider)" stroke-width="4"/>
  <!-- Arrow circle -->
  <circle cx="450" cy="280" r="22" fill="#F97316" filter="url(#er-h-shadow)"/>
  <polygon points="432,280 441,272 441,288" fill="white"/>
  <polygon points="468,280 459,272 459,288" fill="white"/>

  <!-- ===== TOP BADGE ===== -->
  <rect x="238" y="10" width="424" height="44" rx="9" fill="url(#er-h-badge)" filter="url(#er-h-shadow)"/>
  <rect x="243" y="15" width="414" height="34" rx="7" fill="none" stroke="#F97316" stroke-width="1" opacity="0.35"/>
  <!-- Icon block -->
  <rect x="245" y="15" width="34" height="34" rx="6" fill="#F97316"/>
  <text x="262" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">R</text>
  <!-- Badge text -->
  <text x="290" y="38" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="white" letter-spacing="0.5">Entreprise</text>
  <text x="400" y="38" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#F97316" letter-spacing="0.5"> Rénovation</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="553" width="900" height="7" fill="#334155"/>
</svg>
