<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1837;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1060;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1230;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="heroBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#00d1ff;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="deviceFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2650;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e1840;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d1ff;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7a5cff;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000020" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="360" fill="url(#bg1)"/>

  <!-- Ambient glows -->
  <ellipse cx="130" cy="260" rx="140" ry="100" fill="url(#glow1)" filter="url(#blur1)" opacity="0.7"/>
  <ellipse cx="390" cy="120" rx="130" ry="90" fill="#00d1ff" filter="url(#blur1)" opacity="0.12"/>

  <!-- Decorative dots -->
  <circle cx="30" cy="40" r="3" fill="#7a5cff" opacity="0.5"/>
  <circle cx="490" cy="320" r="4" fill="#00d1ff" opacity="0.45"/>
  <circle cx="490" cy="60" r="3" fill="#7a5cff" opacity="0.4"/>
  <circle cx="28" cy="310" r="5" fill="#00d1ff" opacity="0.3"/>
  <circle cx="260" cy="24" r="3" fill="#7a5cff" opacity="0.4"/>
  <circle cx="500" cy="180" r="4" fill="#7a5cff" opacity="0.3"/>
  <polygon points="474,40 484,58 464,58" fill="none" stroke="#00d1ff" stroke-width="1.2" opacity="0.3"/>
  <rect x="16" y="140" width="10" height="10" rx="2" fill="none" stroke="#7a5cff" stroke-width="1.2" opacity="0.3" transform="rotate(15 21 145)"/>

  <!-- ======================== -->
  <!-- DESKTOP MONITOR (large)  -->
  <!-- ======================== -->
  <g filter="url(#shadow1)" transform="translate(40, 46)">
    <!-- Monitor outer -->
    <rect x="0" y="0" width="256" height="178" rx="8" fill="url(#deviceFrame)"/>
    <!-- Screen bezel -->
    <rect x="6" y="6" width="244" height="162" rx="5" fill="#080a1c"/>
    <!-- Screen content -->
    <rect x="10" y="10" width="236" height="154" rx="3" fill="url(#screenBg)"/>
    <!-- Navbar on desktop -->
    <rect x="10" y="10" width="236" height="18" rx="3" fill="#0a0d22"/>
    <circle cx="22" cy="19" r="4" fill="#7a5cff"/>
    <rect x="29" y="16" width="28" height="5" rx="2" fill="#c0b8ff" opacity="0.8"/>
    <rect x="136" y="16" width="18" height="4" rx="2" fill="#5050a0" opacity="0.7"/>
    <rect x="160" y="16" width="18" height="4" rx="2" fill="#5050a0" opacity="0.7"/>
    <rect x="184" y="16" width="18" height="4" rx="2" fill="#5050a0" opacity="0.7"/>
    <rect x="212" y="13" width="28" height="10" rx="5" fill="#7a5cff"/>
    <!-- Hero on desktop -->
    <rect x="10" y="28" width="236" height="52" fill="url(#heroBlock)" opacity="0.85"/>
    <rect x="28" y="38" width="80" height="7" rx="2" fill="white" opacity="0.95"/>
    <rect x="28" y="50" width="100" height="5" rx="2" fill="white" opacity="0.65"/>
    <rect x="28" y="62" width="36" height="11" rx="5" fill="white"/>
    <!-- Cards on desktop -->
    <rect x="14" y="86" width="68" height="38" rx="3" fill="#1e1a44" opacity="0.9"/>
    <rect x="88" y="86" width="68" height="38" rx="3" fill="#1e1a44" opacity="0.9"/>
    <rect x="162" y="86" width="68" height="38" rx="3" fill="#1e1a44" opacity="0.9"/>
    <circle cx="26" cy="97" r="5" fill="#7a5cff" opacity="0.8"/>
    <circle cx="100" cy="97" r="5" fill="#00d1ff" opacity="0.8"/>
    <circle cx="174" cy="97" r="5" fill="#7a5cff" opacity="0.7"/>
    <rect x="34" y="93" width="42" height="4" rx="2" fill="#c0b8ff" opacity="0.7"/>
    <rect x="14" y="102" width="60" height="3" rx="2" fill="#5050a0" opacity="0.5"/>
    <rect x="108" y="93" width="42" height="4" rx="2" fill="#80eeff" opacity="0.7"/>
    <rect x="88" y="102" width="60" height="3" rx="2" fill="#5050a0" opacity="0.5"/>
    <rect x="182" y="93" width="42" height="4" rx="2" fill="#c0b8ff" opacity="0.7"/>
    <rect x="162" y="102" width="60" height="3" rx="2" fill="#5050a0" opacity="0.5"/>
    <!-- Footer strip on desktop -->
    <rect x="10" y="132" width="236" height="32" rx="0" fill="#080a1c"/>
    <rect x="60" y="143" width="50" height="4" rx="2" fill="#3040608" opacity="0.4"/>
    <rect x="120" y="143" width="50" height="4" rx="2" fill="#3040608" opacity="0.4"/>
    <!-- Monitor stand -->
    <rect x="106" y="178" width="44" height="10" rx="2" fill="#1e1840"/>
    <rect x="86" y="186" width="84" height="6" rx="3" fill="#252048"/>
  </g>
  <!-- Camera dot -->
  <circle cx="168" cy="50" r="3" fill="#1a1840"/>

  <!-- ======================== -->
  <!-- TABLET (medium, center-right, overlapping) -->
  <!-- ======================== -->
  <g filter="url(#shadow1)" transform="translate(256, 82)">
    <!-- Tablet outer -->
    <rect x="0" y="0" width="136" height="186" rx="10" fill="url(#deviceFrame)"/>
    <!-- Bezel -->
    <rect x="6" y="14" width="124" height="158" rx="5" fill="#080a1c"/>
    <!-- Screen -->
    <rect x="10" y="18" width="116" height="150" rx="3" fill="url(#screenBg)"/>
    <!-- Navbar on tablet -->
    <rect x="10" y="18" width="116" height="16" rx="3" fill="#0a0d22"/>
    <circle cx="20" cy="26" r="3.5" fill="#7a5cff"/>
    <rect x="26" y="23" width="22" height="4" rx="2" fill="#c0b8ff" opacity="0.8"/>
    <rect x="100" y="21" width="22" height="8" rx="4" fill="#7a5cff"/>
    <!-- Hero on tablet -->
    <rect x="10" y="34" width="116" height="44" fill="url(#heroBlock)" opacity="0.85"/>
    <rect x="20" y="41" width="60" height="6" rx="2" fill="white" opacity="0.95"/>
    <rect x="20" y="51" width="76" height="5" rx="2" fill="white" opacity="0.65"/>
    <rect x="20" y="60" width="30" height="10" rx="5" fill="white"/>
    <!-- Cards on tablet (stacked 2) -->
    <rect x="14" y="84" width="50" height="36" rx="3" fill="#1e1a44" opacity="0.9"/>
    <rect x="70" y="84" width="50" height="36" rx="3" fill="#1e1a44" opacity="0.9"/>
    <circle cx="24" cy="94" r="4" fill="#7a5cff" opacity="0.8"/>
    <circle cx="80" cy="94" r="4" fill="#00d1ff" opacity="0.8"/>
    <rect x="30" y="91" width="28" height="4" rx="2" fill="#c0b8ff" opacity="0.7"/>
    <rect x="86" y="91" width="28" height="4" rx="2" fill="#80eeff" opacity="0.7"/>
    <rect x="14" y="100" width="44" height="3" rx="2" fill="#5050a0" opacity="0.5"/>
    <rect x="70" y="100" width="44" height="3" rx="2" fill="#5050a0" opacity="0.5"/>
    <!-- More content rows -->
    <rect x="14" y="128" width="108" height="5" rx="2" fill="#3a3a60" opacity="0.4"/>
    <rect x="14" y="138" width="90" height="5" rx="2" fill="#3a3a60" opacity="0.35"/>
    <rect x="14" y="148" width="100" height="5" rx="2" fill="#3a3a60" opacity="0.3"/>
    <!-- Footer strip -->
    <rect x="10" y="158" width="116" height="10" rx="0" fill="#080a1c"/>
    <!-- Camera dots -->
    <circle cx="68" cy="8" r="3" fill="#1a1840"/>
    <circle cx="68" cy="177" r="3" fill="#1a1840"/>
  </g>

  <!-- ======================== -->
  <!-- SMARTPHONE (small, front-right, overlapping) -->
  <!-- ======================== -->
  <g filter="url(#shadow1)" transform="translate(362, 168)">
    <!-- Phone outer -->
    <rect x="0" y="0" width="86" height="160" rx="12" fill="url(#deviceFrame)"/>
    <!-- Bezel -->
    <rect x="5" y="14" width="76" height="132" rx="7" fill="#080a1c"/>
    <!-- Screen -->
    <rect x="8" y="18" width="70" height="124" rx="4" fill="url(#screenBg)"/>
    <!-- Navbar on phone -->
    <rect x="8" y="18" width="70" height="14" rx="4" fill="#0a0d22"/>
    <circle cx="16" cy="25" r="3" fill="#7a5cff"/>
    <rect x="55" y="22" width="18" height="6" rx="3" fill="#7a5cff"/>
    <!-- Hero on phone -->
    <rect x="8" y="32" width="70" height="40" fill="url(#heroBlock)" opacity="0.85"/>
    <rect x="16" y="38" width="42" height="5" rx="2" fill="white" opacity="0.95"/>
    <rect x="16" y="47" width="52" height="4" rx="2" fill="white" opacity="0.65"/>
    <rect x="16" y="56" width="26" height="9" rx="4" fill="white"/>
    <!-- Content rows on phone -->
    <rect x="12" y="78" width="62" height="24" rx="3" fill="#1e1a44" opacity="0.9"/>
    <circle cx="22" cy="87" r="4" fill="#7a5cff" opacity="0.8"/>
    <rect x="29" y="84" width="38" height="4" rx="2" fill="#c0b8ff" opacity="0.7"/>
    <rect x="12" y="93" width="56" height="3" rx="2" fill="#5050a0" opacity="0.5"/>
    <rect x="12" y="108" width="62" height="14" rx="3" fill="#1e1a44" opacity="0.8"/>
    <rect x="16" y="112" width="54" height="3" rx="2" fill="#5050a0" opacity="0.45"/>
    <rect x="16" y="118" width="44" height="3" rx="2" fill="#5050a0" opacity="0.35"/>
    <!-- Footer on phone -->
    <rect x="8" y="130" width="70" height="12" rx="0" fill="#080a1c"/>
    <!-- Camera notch -->
    <rect x="28" y="5" width="30" height="6" rx="3" fill="#1a1840"/>
  </g>

  <!-- LABEL "RESPONSIVE DESIGN" -->
  <rect x="130" y="310" width="260" height="36" rx="18" fill="url(#labelGrad)" opacity="0.97"/>
  <rect x="132" y="312" width="256" height="32" rx="16" fill="white" opacity="0.05"/>
  <text x="260" y="333" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">RESPONSIVE DESIGN</text>

  <!-- Decorative lines connecting devices -->
  <line x1="296" y1="138" x2="330" y2="150" stroke="#7a5cff" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
  <line x1="392" y1="200" x2="420" y2="220" stroke="#00d1ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
</svg>
