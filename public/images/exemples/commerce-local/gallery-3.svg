<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E8D8"/>
      <stop offset="100%" stop-color="#E4DAC8"/>
    </linearGradient>
    <linearGradient id="parkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A9E68"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <radialGradient id="pinGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E8734A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8734A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000030"/>
    </filter>
    <filter id="pinShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000050"/>
    </filter>
  </defs>

  <!-- Map background -->
  <rect width="520" height="360" fill="url(#mapBg)"/>

  <!-- Map grid / subtle texture -->
  <g stroke="#D8CEBC" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="60" x2="520" y2="60"/>
    <line x1="0" y1="120" x2="520" y2="120"/>
    <line x1="0" y1="180" x2="520" y2="180"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="0" y1="300" x2="520" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- MAIN ROADS -->
  <!-- Horizontal main avenue -->
  <rect x="0" y="148" width="520" height="22" rx="0" fill="#D8CEBC"/>
  <line x1="0" y1="159" x2="520" y2="159" stroke="white" stroke-width="1.5" stroke-dasharray="14,10"/>
  <!-- Label -->
  <text x="40" y="156" font-size="7" fill="#8B7A5A" font-weight="bold">Rue de la République</text>

  <!-- Vertical main road -->
  <rect x="228" y="0" width="20" height="360" fill="#D8CEBC"/>
  <line x1="238" y1="0" x2="238" y2="360" stroke="white" stroke-width="1.5" stroke-dasharray="14,10"/>
  <text x="232" y="50" font-size="6.5" fill="#8B7A5A" font-weight="bold" transform="rotate(90 232 50)">Avenue du Commerce</text>

  <!-- Secondary horizontal road top -->
  <rect x="0" y="72" width="520" height="14" fill="#E0D6C4"/>
  <text x="50" y="80" font-size="6" fill="#A0907A">Rue des Artisans</text>

  <!-- Secondary horizontal road bottom -->
  <rect x="0" y="268" width="520" height="14" fill="#E0D6C4"/>
  <text x="50" y="276" font-size="6" fill="#A0907A">Boulevard des Fleurs</text>

  <!-- Secondary vertical road left -->
  <rect x="108" y="0" width="14" height="360" fill="#E0D6C4"/>

  <!-- Secondary vertical road right -->
  <rect x="388" y="0" width="14" height="360" fill="#E0D6C4"/>

  <!-- PARK block (top-right area) -->
  <rect x="250" y="0" width="135" height="70" rx="4" fill="url(#parkGrad)" opacity="0.82"/>
  <!-- Park trees -->
  <circle cx="275" cy="22" r="12" fill="#3A8463" opacity="0.85"/>
  <circle cx="300" cy="18" r="10" fill="#2D6A4F"/>
  <circle cx="322" cy="25" r="11" fill="#3A8463" opacity="0.80"/>
  <circle cx="345" cy="20" r="10" fill="#2D6A4F"/>
  <circle cx="366" cy="26" r="10" fill="#3A8463" opacity="0.78"/>
  <circle cx="280" cy="48" r="9" fill="#2D6A4F" opacity="0.85"/>
  <circle cx="310" cy="52" r="11" fill="#3A8463" opacity="0.80"/>
  <circle cx="340" cy="48" r="10" fill="#2D6A4F"/>
  <circle cx="368" cy="50" r="9" fill="#3A8463" opacity="0.78"/>
  <!-- Park path -->
  <path d="M252 70 Q290 55 330 40 Q360 30 385 15" stroke="#C4B090" stroke-width="3" fill="none" stroke-dasharray="4,3"/>
  <text x="290" y="64" font-size="9" fill="#FFF8F0" font-weight="bold" opacity="0.9">PARC MUNICIPAL</text>

  <!-- CITY BLOCKS -->
  <!-- Block: top-left area (above main ave, left of main road) -->
  <rect x="124" y="88" width="102" height="58" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="134" y="95" width="30" height="44" rx="2" fill="#D4C4A8"/>
  <rect x="170" y="95" width="46" height="44" rx="2" fill="#C8B898"/>
  <!-- Building detail lines -->
  <line x1="134" y1="115" x2="164" y2="115" stroke="#B8A888" stroke-width="1"/>
  <line x1="170" y1="115" x2="216" y2="115" stroke="#B8A888" stroke-width="1"/>

  <!-- Block top-right (above main ave, right of main road) -->
  <rect x="250" y="88" width="136" height="58" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="258" y="94" width="40" height="46" rx="2" fill="#D4C4A8"/>
  <rect x="304" y="94" width="36" height="46" rx="2" fill="#C8B898"/>
  <rect x="346" y="94" width="32" height="46" rx="2" fill="#D4C4A8"/>

  <!-- Block bottom-left (below main ave, left of main road) -->
  <rect x="124" y="172" width="102" height="92" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="132" y="180" width="35" height="76" rx="2" fill="#D4C4A8"/>
  <rect x="173" y="180" width="45" height="76" rx="2" fill="#C8B898"/>
  <line x1="132" y1="220" x2="167" y2="220" stroke="#B8A888" stroke-width="1"/>
  <line x1="173" y1="220" x2="218" y2="220" stroke="#B8A888" stroke-width="1"/>

  <!-- Block bottom-right area (below main ave) -->
  <rect x="250" y="172" width="136" height="92" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="258" y="180" width="40" height="76" rx="2" fill="#D4C4A8"/>
  <rect x="305" y="180" width="38" height="76" rx="2" fill="#C8B898"/>
  <rect x="350" y="180" width="28" height="76" rx="2" fill="#D4C4A8"/>

  <!-- Block far right top -->
  <rect x="404" y="88" width="110" height="58" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="412" y="95" width="40" height="44" rx="2" fill="#D4C4A8"/>
  <rect x="460" y="95" width="44" height="44" rx="2" fill="#C8B898"/>

  <!-- Block far right bottom -->
  <rect x="404" y="172" width="110" height="92" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="412" y="180" width="40" height="76" rx="2" fill="#D4C4A8"/>
  <rect x="460" y="180" width="44" height="76" rx="2" fill="#C8B898"/>

  <!-- Block far left top -->
  <rect x="0" y="88" width="106" height="58" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="8" y="95" width="38" height="44" rx="2" fill="#D4C4A8"/>
  <rect x="52" y="95" width="46" height="44" rx="2" fill="#C8B898"/>

  <!-- Block far left bottom -->
  <rect x="0" y="172" width="106" height="92" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="8" y="180" width="38" height="76" rx="2" fill="#D4C4A8"/>
  <rect x="52" y="180" width="46" height="76" rx="2" fill="#C8B898"/>

  <!-- Blocks below boulevard des fleurs -->
  <rect x="0" y="284" width="226" height="76" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="8" y="292" width="80" height="58" rx="2" fill="#D4C4A8"/>
  <rect x="96" y="292" width="60" height="58" rx="2" fill="#C8B898"/>
  <rect x="164" y="292" width="52" height="58" rx="2" fill="#D4C4A8"/>
  <rect x="250" y="284" width="266" height="76" rx="3" fill="#E8D8C0" stroke="#C8B898" stroke-width="1"/>
  <rect x="258" y="292" width="60" height="58" rx="2" fill="#C8B898"/>
  <rect x="325" y="292" width="70" height="58" rx="2" fill="#D4C4A8"/>
  <rect x="403" y="292" width="60" height="58" rx="2" fill="#C8B898"/>
  <rect x="470" y="292" width="38" height="58" rx="2" fill="#D4C4A8"/>

  <!-- NEIGHBORING SHOPS (small labeled icons) -->
  <!-- Boulangerie - top-left block -->
  <rect x="130" y="93" width="36" height="28" rx="2" fill="#E8C870" opacity="0.9"/>
  <text x="148" y="105" text-anchor="middle" font-size="6" fill="#5A3A1A" font-weight="bold">Boulan-</text>
  <text x="148" y="113" text-anchor="middle" font-size="6" fill="#5A3A1A" font-weight="bold">gerie</text>
  <!-- Pharmacie -->
  <rect x="170" y="93" width="45" height="28" rx="2" fill="#4AB870" opacity="0.85"/>
  <text x="192" y="108" text-anchor="middle" font-size="7" fill="white" font-weight="bold">Pharmacie</text>
  <!-- Green cross -->
  <rect x="218" y="96" width="8" height="20" rx="1" fill="#4AB870" opacity="0.5"/>

  <!-- Cafe to the right -->
  <rect x="255" y="93" width="42" height="28" rx="2" fill="#C4924A" opacity="0.85"/>
  <text x="276" y="108" text-anchor="middle" font-size="7" fill="white" font-weight="bold">Café</text>

  <!-- Bank far right -->
  <rect x="408" y="93" width="44" height="28" rx="2" fill="#1E3A5F" opacity="0.8"/>
  <text x="430" y="108" text-anchor="middle" font-size="7" fill="white" font-weight="bold">Banque</text>

  <!-- Tabac bottom right block -->
  <rect x="305" y="178" width="38" height="28" rx="2" fill="#CC3333" opacity="0.8"/>
  <text x="324" y="196" text-anchor="middle" font-size="7" fill="white" font-weight="bold">Tabac</text>

  <!-- Librarie -->
  <rect x="258" y="178" width="42" height="28" rx="2" fill="#6A5ACD" opacity="0.8"/>
  <text x="279" y="196" text-anchor="middle" font-size="7" fill="white" font-weight="bold">Librairie</text>

  <!-- Walking distance circles -->
  <circle cx="175" cy="162" r="90" fill="none" stroke="#E8734A" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <circle cx="175" cy="162" r="55" fill="none" stroke="#E8734A" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Distance labels -->
  <rect x="258" y="82" width="50" height="14" rx="7" fill="white" opacity="0.85"/>
  <text x="283" y="92" text-anchor="middle" font-size="6.5" fill="#E8734A" font-weight="bold">5 min à pied</text>
  <rect x="290" y="136" width="58" height="14" rx="7" fill="white" opacity="0.85"/>
  <text x="319" y="146" text-anchor="middle" font-size="6.5" fill="#E8734A" font-weight="bold">10 min à pied</text>

  <!-- LA BOUTIQUE pin (centered around 170,165 area — intersection) -->
  <circle cx="175" cy="162" r="22" fill="url(#pinGlow)"/>
  <!-- Pin shape -->
  <path d="M175 135 C162 135 152 145 152 157 C152 174 175 195 175 195 C175 195 198 174 198 157 C198 145 188 135 175 135Z" fill="#E8734A" filter="url(#pinShadow)"/>
  <circle cx="175" cy="157" r="9" fill="white"/>
  <text x="175" y="161" text-anchor="middle" font-size="8" fill="#E8734A" font-weight="bold">LB</text>

  <!-- Pin label -->
  <rect x="138" y="198" width="74" height="18" rx="9" fill="#2D6A4F" filter="url(#shadow)"/>
  <text x="175" y="211" text-anchor="middle" font-size="8" fill="#FFF8F0" font-weight="bold">La Boutique</text>

  <!-- Compass rose (top-right corner) -->
  <g transform="translate(470,32)">
    <circle cx="0" cy="0" r="18" fill="white" opacity="0.75"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#C4A882" stroke-width="1"/>
    <polygon points="0,-14 3,-4 0,-7 -3,-4" fill="#E8734A"/>
    <polygon points="0,14 3,4 0,7 -3,4" fill="#C4A882" opacity="0.6"/>
    <polygon points="-14,0 -4,-3 -7,0 -4,3" fill="#C4A882" opacity="0.6"/>
    <polygon points="14,0 4,-3 7,0 4,3" fill="#C4A882" opacity="0.6"/>
    <text x="0" y="-17" text-anchor="middle" font-size="7" fill="#E8734A" font-weight="bold">N</text>
  </g>

  <!-- QUARTIER label -->
  <rect x="175" y="322" width="170" height="28" rx="14" fill="#8B5E3C" filter="url(#shadow)"/>
  <text x="260" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF8F0" letter-spacing="2">QUARTIER</text>
</svg>
