<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="wallBackK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F4EE"/>
      <stop offset="100%" stop-color="#EDE8E2"/>
    </linearGradient>
    <linearGradient id="ceilK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2EEE6"/>
      <stop offset="100%" stop-color="#E8E0D4"/>
    </linearGradient>
    <linearGradient id="marbleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0EDE6"/>
      <stop offset="25%" stop-color="#E8E4DC"/>
      <stop offset="50%" stop-color="#F4F0EA"/>
      <stop offset="75%" stop-color="#EAE6DE"/>
      <stop offset="100%" stop-color="#F0EDE6"/>
    </linearGradient>
    <linearGradient id="cabinetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2E24"/>
      <stop offset="100%" stop-color="#2A2018"/>
    </linearGradient>
    <linearGradient id="cabinetLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3C30"/>
      <stop offset="100%" stop-color="#382C20"/>
    </linearGradient>
    <linearGradient id="floorK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B898"/>
      <stop offset="100%" stop-color="#B8A888"/>
    </linearGradient>
    <linearGradient id="lampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A88838"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#FFF8D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF8D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stools" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3C30"/>
      <stop offset="100%" stop-color="#2E2418"/>
    </linearGradient>
    <filter id="kitchenShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background wall -->
  <rect width="520" height="360" fill="url(#wallBackK)"/>

  <!-- Ceiling -->
  <rect x="0" y="0" width="520" height="70" fill="url(#ceilK)"/>
  <!-- Ceiling cornice -->
  <rect x="0" y="68" width="520" height="4" rx="1" fill="#D8D0C4" opacity="0.7"/>

  <!-- Floor -->
  <rect x="0" y="300" width="520" height="60" fill="url(#floorK)"/>
  <!-- Floor tiles -->
  <line x1="0" y1="310" x2="520" y2="310" stroke="#A89878" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="320" x2="520" y2="320" stroke="#A89878" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="330" x2="520" y2="330" stroke="#A89878" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="340" x2="520" y2="340" stroke="#A89878" stroke-width="0.8" opacity="0.4"/>
  <line x1="0" y1="350" x2="520" y2="350" stroke="#A89878" stroke-width="0.8" opacity="0.4"/>
  <line x1="130" y1="300" x2="130" y2="360" stroke="#A89878" stroke-width="0.8" opacity="0.4"/>
  <line x1="260" y1="300" x2="260" y2="360" stroke="#A89878" stroke-width="0.8" opacity="0.4"/>
  <line x1="390" y1="300" x2="390" y2="360" stroke="#A89878" stroke-width="0.8" opacity="0.4"/>

  <!-- Back kitchen counter (island base) -->
  <!-- Upper cabinets on back wall -->
  <rect x="0" y="72" width="180" height="90" rx="3" fill="url(#cabinetGrad)"/>
  <rect x="188" y="72" width="180" height="90" rx="3" fill="url(#cabinetGrad)"/>
  <!-- Cabinet doors detail -->
  <rect x="8" y="80" width="78" height="74" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <rect x="94" y="80" width="78" height="74" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <rect x="196" y="80" width="78" height="74" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <rect x="282" y="80" width="78" height="74" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <!-- Cabinet handles -->
  <rect x="42" y="116" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <rect x="128" y="116" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <rect x="230" y="116" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <rect x="316" y="116" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <!-- Right side: open-plan space / window suggestion -->
  <rect x="376" y="72" width="144" height="228" rx="2" fill="#E8F2F8" opacity="0.5"/>
  <rect x="376" y="72" width="144" height="228" fill="none" stroke="#B8C8D8" stroke-width="2"/>
  <line x1="448" y1="72" x2="448" y2="300" stroke="#B8C8D8" stroke-width="1.5"/>
  <line x1="376" y1="180" x2="520" y2="180" stroke="#B8C8D8" stroke-width="1.5"/>
  <!-- Light through window -->
  <rect x="378" y="74" width="140" height="104" fill="#FFFDF5" opacity="0.25"/>

  <!-- Under-cabinet lighting strip -->
  <rect x="0" y="160" width="368" height="4" rx="2" fill="#C9A84C" opacity="0.4"/>

  <!-- Lower cabinets and countertop (back wall) -->
  <rect x="0" y="164" width="370" height="140" rx="3" fill="url(#cabinetGrad)" filter="url(#kitchenShadow)"/>
  <!-- Marble countertop on back -->
  <rect x="0" y="162" width="375" height="16" rx="2" fill="url(#marbleGrad)"/>
  <!-- Marble veins -->
  <path d="M30,164 C50,168 60,172 90,166 C110,162 130,170 160,165" stroke="#D0C8C0" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M180,163 C200,168 220,164 250,170 C270,174 290,165 320,168" stroke="#C8C0B8" stroke-width="0.8" fill="none" opacity="0.6"/>
  <!-- Lower cabinet doors -->
  <rect x="8" y="172" width="78" height="120" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <rect x="94" y="172" width="78" height="120" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <rect x="180" y="172" width="78" height="120" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <rect x="266" y="172" width="96" height="120" rx="2" fill="none" stroke="#5A4838" stroke-width="1.5"/>
  <!-- Lower handles -->
  <rect x="42" y="230" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <rect x="128" y="230" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <rect x="214" y="230" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <rect x="306" y="230" width="12" height="3" rx="1.5" fill="#C9A84C"/>
  <!-- Sink in counter -->
  <rect x="200" y="164" width="80" height="12" rx="3" fill="#D0CCC8" opacity="0.6"/>
  <ellipse cx="240" cy="170" rx="35" ry="5" fill="#B8B4B0" opacity="0.5"/>
  <!-- Faucet -->
  <rect x="237" y="155" width="6" height="10" rx="3" fill="#C0BCBA"/>
  <rect x="228" y="152" width="18" height="4" rx="2" fill="#C0BCBA"/>

  <!-- Kitchen island with marble top -->
  <rect x="80" y="258" width="300" height="42" rx="5" fill="url(#cabinetLight)" filter="url(#kitchenShadow)"/>
  <!-- Island marble top -->
  <rect x="78" y="250" width="304" height="14" rx="4" fill="url(#marbleGrad)"/>
  <!-- Island marble veins -->
  <path d="M100,253 C130,257 160,251 200,255 C230,258 260,252 300,255" stroke="#D8D0C8" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Island cabinet doors -->
  <rect x="88" y="268" width="88" height="24" rx="2" fill="none" stroke="#5A4838" stroke-width="1"/>
  <rect x="184" y="268" width="88" height="24" rx="2" fill="none" stroke="#5A4838" stroke-width="1"/>
  <rect x="280" y="268" width="88" height="24" rx="2" fill="none" stroke="#5A4838" stroke-width="1"/>
  <rect x="126" y="278" width="14" height="3" rx="1.5" fill="#C9A84C" opacity="0.8"/>
  <rect x="222" y="278" width="14" height="3" rx="1.5" fill="#C9A84C" opacity="0.8"/>
  <rect x="318" y="278" width="14" height="3" rx="1.5" fill="#C9A84C" opacity="0.8"/>

  <!-- Bar stools -->
  <!-- Stool 1 -->
  <ellipse cx="130" cy="250" rx="20" ry="7" fill="url(#stools)"/>
  <rect x="127" y="250" width="6" height="52" rx="3" fill="#3A2E22"/>
  <line x1="118" y1="280" x2="142" y2="280" stroke="#4A3C2E" stroke-width="3" stroke-linecap="round"/>
  <!-- Stool 2 -->
  <ellipse cx="200" cy="250" rx="20" ry="7" fill="url(#stools)"/>
  <rect x="197" y="250" width="6" height="52" rx="3" fill="#3A2E22"/>
  <line x1="188" y1="280" x2="212" y2="280" stroke="#4A3C2E" stroke-width="3" stroke-linecap="round"/>
  <!-- Stool 3 -->
  <ellipse cx="270" cy="250" rx="20" ry="7" fill="url(#stools)"/>
  <rect x="267" y="250" width="6" height="52" rx="3" fill="#3A2E22"/>
  <line x1="258" y1="280" x2="282" y2="280" stroke="#4A3C2E" stroke-width="3" stroke-linecap="round"/>

  <!-- Pendant lights above island -->
  <!-- Light 1 -->
  <line x1="148" y1="0" x2="148" y2="65" stroke="#8A7860" stroke-width="2"/>
  <ellipse cx="148" cy="68" rx="20" ry="7" fill="url(#lampGrad)"/>
  <ellipse cx="148" cy="72" rx="16" ry="5" fill="#E8C95A" opacity="0.8"/>
  <rect x="136" y="72" width="24" height="28" rx="10" fill="url(#lampGrad)"/>
  <ellipse cx="148" cy="72" rx="10" ry="6" fill="url(#lampGlow)"/>
  <!-- Light 2 -->
  <line x1="228" y1="0" x2="228" y2="58" stroke="#8A7860" stroke-width="2"/>
  <ellipse cx="228" cy="62" rx="20" ry="7" fill="url(#lampGrad)"/>
  <ellipse cx="228" cy="66" rx="16" ry="5" fill="#E8C95A" opacity="0.8"/>
  <rect x="216" y="66" width="24" height="28" rx="10" fill="url(#lampGrad)"/>
  <ellipse cx="228" cy="66" rx="10" ry="6" fill="url(#lampGlow)"/>
  <!-- Light 3 -->
  <line x1="308" y1="0" x2="308" y2="65" stroke="#8A7860" stroke-width="2"/>
  <ellipse cx="308" cy="68" rx="20" ry="7" fill="url(#lampGrad)"/>
  <ellipse cx="308" cy="72" rx="16" ry="5" fill="#E8C95A" opacity="0.8"/>
  <rect x="296" y="72" width="24" height="28" rx="10" fill="url(#lampGrad)"/>
  <ellipse cx="308" cy="72" rx="10" ry="6" fill="url(#lampGlow)"/>

  <!-- Small objects on counter -->
  <!-- Wine glass -->
  <ellipse cx="340" cy="159" rx="8" ry="3" fill="#E0D8D0" opacity="0.6"/>
  <path d="M336,159 C334,150 338,140 344,159" stroke="#C8C0B8" stroke-width="1.5" fill="#E8E4E0" opacity="0.5"/>
  <rect x="339" y="150" width="2" height="9" fill="#C8C0B8" opacity="0.5"/>
  <rect x="335" y="148" width="10" height="2" rx="1" fill="#C8C0B8" opacity="0.5"/>
  <!-- Fruit bowl suggestion -->
  <ellipse cx="88" cy="160" rx="20" ry="5" fill="#C8C0B0" opacity="0.5"/>
  <circle cx="80" cy="156" r="5" fill="#E87050" opacity="0.7"/>
  <circle cx="92" cy="155" r="6" fill="#F0A030" opacity="0.7"/>
  <circle cx="102" cy="157" r="4" fill="#D0E050" opacity="0.7"/>

  <!-- CUISINE label badge - top right -->
  <rect x="424" y="10" width="88" height="28" rx="5" fill="#1A2E4A" opacity="0.85"/>
  <text x="468" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" letter-spacing="1">CUISINE</text>
</svg>
