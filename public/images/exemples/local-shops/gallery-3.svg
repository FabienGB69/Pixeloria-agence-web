<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#f0e4cc"/>
    </linearGradient>
    <linearGradient id="bannerG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000022"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="520" height="360" fill="url(#bgG)"/>
  <!-- Seasonal decoration: string lights across top -->
  <line x1="0" y1="22" x2="520" y2="22" stroke="#D4A853" stroke-width="1.5" opacity="0.5"/>
  <g fill="#f5e070" opacity="0.85">
    <circle cx="30" cy="22" r="5"/>
    <circle cx="70" cy="30" r="5"/>
    <circle cx="110" cy="22" r="5"/>
    <circle cx="150" cy="30" r="5"/>
    <circle cx="190" cy="22" r="5"/>
    <circle cx="230" cy="30" r="5"/>
    <circle cx="270" cy="22" r="5"/>
    <circle cx="310" cy="30" r="5"/>
    <circle cx="350" cy="22" r="5"/>
    <circle cx="390" cy="30" r="5"/>
    <circle cx="430" cy="22" r="5"/>
    <circle cx="470" cy="30" r="5"/>
    <circle cx="510" cy="22" r="5"/>
  </g>
  <!-- Open Late banner -->
  <rect x="0" y="36" width="520" height="36" fill="url(#bannerG)"/>
  <text x="260" y="59" text-anchor="middle" font-size="14" fill="#FFFBEB" font-weight="bold" letter-spacing="4">OPEN LATE THIS WEEKEND!</text>
  <!-- Seasonal decorations (leaves/stars) -->
  <g fill="#B45309" opacity="0.3" font-size="20">
    <text x="16" y="56">&#9752;</text>
    <text x="484" y="56">&#9752;</text>
  </g>
  <!-- Calendar event card (large left) -->
  <rect x="14" y="84" width="220" height="170" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="14" y="84" width="220" height="40" rx="10" fill="#B45309"/>
  <rect x="14" y="114" width="220" height="10" fill="#B45309"/>
  <text x="124" y="105" text-anchor="middle" font-size="12" fill="#FFFBEB" font-weight="bold">SUMMER MARKET</text>
  <text x="124" y="116" text-anchor="middle" font-size="9" fill="#FFFBEB" opacity="0.8">Saturday, June 29</text>
  <!-- Event details -->
  <text x="30" y="142" font-size="9" fill="#1C1917" font-weight="bold">Community Market Day</text>
  <text x="30" y="156" font-size="8" fill="#1C1917" opacity="0.7">10:00 AM — 6:00 PM</text>
  <text x="30" y="170" font-size="8" fill="#1C1917" opacity="0.7">Main Street Plaza</text>
  <line x1="22" y1="176" x2="226" y2="176" stroke="#e8d8c0" stroke-width="1"/>
  <text x="30" y="192" font-size="8" fill="#0F766E">&#10003; Live music &amp; food stalls</text>
  <text x="30" y="206" font-size="8" fill="#0F766E">&#10003; Artisan demonstrations</text>
  <text x="30" y="220" font-size="8" fill="#0F766E">&#10003; Kids craft corner</text>
  <rect x="22" y="232" width="100" height="18" rx="9" fill="#B45309"/>
  <text x="72" y="244" text-anchor="middle" font-size="8" fill="#FFFBEB" font-weight="bold">RSVP Free</text>
  <rect x="130" y="232" width="96" height="18" rx="9" fill="#0F766E" opacity="0.15" stroke="#0F766E" stroke-width="1"/>
  <text x="178" y="244" text-anchor="middle" font-size="8" fill="#0F766E">Learn More</text>
  <!-- Gathering photo circles (community) -->
  <!-- Circle 1 -->
  <circle cx="286" cy="128" r="52" fill="#f0e8d8" stroke="#B45309" stroke-width="2"/>
  <!-- People silhouettes in circle 1 -->
  <circle cx="276" cy="120" r="10" fill="#7B5B3A"/>
  <rect x="267" y="130" width="18" height="26" rx="6" fill="#5a4030"/>
  <circle cx="296" cy="118" r="10" fill="#3a6a3a"/>
  <rect x="287" y="128" width="18" height="26" rx="6" fill="#2a5028"/>
  <circle cx="315" cy="122" r="10" fill="#4a3a7a"/>
  <rect x="306" y="132" width="18" height="26" rx="6" fill="#3a2a60"/>
  <text x="286" y="176" text-anchor="middle" font-size="7" fill="#B45309" font-weight="bold">Market Day</text>
  <!-- Circle 2 -->
  <circle cx="398" cy="128" r="52" fill="#e8f4ec" stroke="#0F766E" stroke-width="2"/>
  <circle cx="384" cy="118" r="10" fill="#8B4513"/>
  <rect x="375" y="128" width="18" height="26" rx="6" fill="#6a3510"/>
  <circle cx="404" cy="116" r="10" fill="#6a4a8a"/>
  <rect x="395" y="126" width="18" height="26" rx="6" fill="#504070"/>
  <circle cx="422" cy="120" r="10" fill="#3a6a4a"/>
  <rect x="413" y="130" width="18" height="26" rx="6" fill="#2a5038"/>
  <text x="398" y="176" text-anchor="middle" font-size="7" fill="#0F766E" font-weight="bold">Craft Fair</text>
  <!-- Upcoming events list (bottom) -->
  <rect x="14" y="266" width="492" height="28" rx="6" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="14" y="266" width="6" height="28" rx="3" fill="#B45309"/>
  <text x="30" y="282" font-size="9" fill="#1C1917" font-weight="bold">Jul 6</text>
  <text x="56" y="282" font-size="9" fill="#1C1917">Farmers Market</text>
  <text x="180" y="282" font-size="8" fill="#1C1917" opacity="0.6">9am - 2pm · Town Square</text>
  <rect x="420" y="271" width="78" height="18" rx="9" fill="#0F766E" opacity="0.15"/>
  <text x="459" y="283" text-anchor="middle" font-size="8" fill="#0F766E">Upcoming</text>
  <rect x="14" y="298" width="492" height="28" rx="6" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="14" y="298" width="6" height="28" rx="3" fill="#0F766E"/>
  <text x="30" y="314" font-size="9" fill="#1C1917" font-weight="bold">Jul 13</text>
  <text x="60" y="314" font-size="9" fill="#1C1917">Art Walk Evening</text>
  <text x="180" y="314" font-size="8" fill="#1C1917" opacity="0.6">6pm - 9pm · Main St</text>
  <rect x="420" y="303" width="78" height="18" rx="9" fill="#B45309" opacity="0.15"/>
  <text x="459" y="315" text-anchor="middle" font-size="8" fill="#B45309">Register</text>
  <!-- Label -->
  <rect x="0" y="332" width="520" height="28" fill="#1C1917"/>
  <rect x="0" y="330" width="520" height="4" fill="url(#bannerG)"/>
  <text x="260" y="351" text-anchor="middle" font-size="14" fill="#FFFBEB" font-weight="bold" letter-spacing="2">COMMUNITY</text>
</svg>
