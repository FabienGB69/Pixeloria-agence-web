  <line x1="183" y1="177" x2="183" y2="185" stroke="#D97706" stroke-width="2" opacity="0.5"/>
  <!-- Icon: chart/growth -->
  <rect x="152" y="200" width="6" height="20" rx="2" fill="#D97706" opacity="0.7"/>
  <rect x="162" y="193" width="6" height="27" rx="2" fill="#F59E0B" opacity="0.9"/>
  <rect x="172" y="197" width="6" height="23" rx="2" fill="#D97706" opacity="0.75"/>
  <rect x="182" y="188" width="6" height="32" rx="2" fill="#F59E0B"/>
