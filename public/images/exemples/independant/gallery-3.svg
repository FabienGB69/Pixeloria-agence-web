  <rect x="367" y="200" width="12" height="14" rx="6" fill="#EDE9FE"/>
  <path d="M358 215 Q357 228 373 228 Q389 228 388 215" stroke="#7C3AED" stroke-width="2" fill="none"/>
  <line x1="373" y1="228" x2="373" y2="235" stroke="#7C3AED" stroke-width="2"/>
  <rect x="364" y="235" width="18" height="3" rx="1" fill="#7C3AED" opacity="0.6"/>
  <text x="373" y="252" text-anchor="middle" font-size="8.5" fill="#4C1D95" font-weight="bold">Conférence</text>
  <text x="373" y="262" text-anchor="middle" font-size="8.5" fill="#4C1D95" font-weight="bold">&amp; Formations</text>
  <rect x="331" y="269" width="84" height="12" rx="6" fill="#7C3AED" opacity="0.2"/>
  <text x="373" y="279" text-anchor="middle" font-size="7" fill="#4C1D95">8 conf. · 200+ apprenants</text>

  <!-- MILESTONE 5: 2024 — Agence propre (current) -->
  <circle cx="458" cy="165" r="14" fill="#1E3A5F" filter="url(#mileShadow)"/>
  <circle cx="458" cy="165" r="10" fill="#F59E0B"/>
  <!-- Star / award icon -->
  <polygon points="458,157 460,163 467,163 461,167 463,174 458,170 453,174 455,167 449,163 456,163" fill="white" opacity="0.9"/>

  <!-- Card above line -->
  <rect x="410" y="58" width="96" height="90" rx="8" fill="url(#cardOra)" filter="url(#cardShadow)"/>
  <rect x="410" y="58" width="96" height="6" rx="8" fill="#EA580C" opacity="0.5"/>
  <line x1="458" y1="145" x2="458" y2="151" stroke="#EA580C" stroke-width="2" opacity="0.5"/>
  <!-- Icon: building/company -->
  <rect x="440" y="76" width="36" height="28" rx="3" fill="#EA580C" opacity="0.8"/>
  <rect x="444" y="80" width="8" height="8" rx="1" fill="#FFEDD5"/>
  <rect x="456" y="80" width="8" height="8" rx="1" fill="#FFEDD5"/>
  <rect x="444" y="92" width="8" height="8" rx="1" fill="#FFEDD5"/>
  <rect x="456" y="92" width="8" height="8" rx="1" fill="#FFEDD5"/>
  <rect x="450" y="92" width="8" height="12" rx="1" fill="#FED7AA"/>
  <!-- "NEW" badge -->
  <rect x="458" y="58" width="24" height="12" rx="6" fill="#EF4444"/>
  <text x="470" y="67" text-anchor="middle" font-size="7" fill="white" font-weight="bold">NEW</text>
  <text x="458" y="116" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">Studio Propre</text>
  <text x="458" y="126" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">&amp; Équipe</text>
  <rect x="416" y="133" width="84" height="12" rx="6" fill="#EA580C" opacity="0.2"/>
  <text x="458" y="143" text-anchor="middle" font-size="7" fill="#92400E">3 collaborateurs · 50+ clients</text>

  <!-- Statistics footer bar -->
  <rect x="14" y="300" width="492" height="44" rx="8" fill="#1E3A5F" opacity="0.07"/>
  <!-- Stat 1 -->
  <text x="80" y="320" text-anchor="middle" font-size="20" fill="#2563EB" font-weight="bold">50+</text>
  <text x="80" y="334" text-anchor="middle" font-size="8" fill="#64748B">projets livrés</text>
  <!-- Divider -->
  <line x1="155" y1="305" x2="155" y2="340" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Stat 2 -->
  <text x="215" y="320" text-anchor="middle" font-size="20" fill="#F59E0B" font-weight="bold">5 ans</text>
  <text x="215" y="334" text-anchor="middle" font-size="8" fill="#64748B">d'expérience</text>
  <line x1="275" y1="305" x2="275" y2="340" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Stat 3 -->
  <text x="335" y="320" text-anchor="middle" font-size="20" fill="#10B981" font-weight="bold">98%</text>
  <text x="335" y="334" text-anchor="middle" font-size="8" fill="#64748B">satisfaction clients</text>
  <line x1="400" y1="305" x2="400" y2="340" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Stat 4 -->
  <text x="455" y="320" text-anchor="middle" font-size="20" fill="#8B5CF6" font-weight="bold">4.9★</text>
  <text x="455" y="334" text-anchor="middle" font-size="8" fill="#64748B">note moyenne</text>

  <!-- RÉALISATIONS label -->
  <rect x="155" y="345" width="210" height="14" rx="7" fill="#1E3A5F" opacity="0.85"/>
  <text x="260" y="355" text-anchor="middle" font-size="9" font-weight="bold" fill="#F8FAFC" letter-spacing="1.5">RÉALISATIONS</text>
