<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Façade de maison en cours de rénovation avec échafaudage et ouvrier">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D4E8"/>
      <stop offset="60%" stop-color="#D8E8F0"/>
      <stop offset="100%" stop-color="#EAD8C0"/>
    </linearGradient>
    <!-- Old render gradient (crumbling) -->
    <linearGradient id="oldRenderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8B89A"/>
      <stop offset="100%" stop-color="#B8A888"/>
    </linearGradient>
    <!-- New render gradient (fresh) -->
    <linearGradient id="newRenderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0EBE0"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#6B5535"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000025"/>
    </filter>
    <!-- Scaffold pattern -->
    <pattern id="woodPlanks" x="0" y="0" width="40" height="8" patternUnits="userSpaceOnUse">
      <rect width="40" height="8" fill="#A07840"/>
      <rect width="40" height="1" fill="#8B6830" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="900" height="560" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <ellipse cx="120" cy="70" rx="60" ry="22" fill="white" opacity="0.7"/>
  <ellipse cx="160" cy="60" rx="45" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="90" cy="75" rx="35" ry="16" fill="white" opacity="0.6"/>

  <ellipse cx="720" cy="50" rx="70" ry="24" fill="white" opacity="0.65"/>
  <ellipse cx="760" cy="42" rx="50" ry="18" fill="white" opacity="0.65"/>
  <ellipse cx="690" cy="55" rx="38" ry="15" fill="white" opacity="0.55"/>

  <!-- GROUND -->
  <rect x="0" y="440" width="900" height="120" fill="url(#groundGrad)"/>
  <!-- Ground texture lines -->
  <line x1="0" y1="445" x2="900" y2="445" stroke="#7A6345" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="460" x2="900" y2="460" stroke="#7A6345" stroke-width="0.5" opacity="0.3"/>

  <!-- HOUSE BASE STRUCTURE -->
  <!-- House body left half (old crumbling render) -->
  <rect x="80" y="120" width="370" height="330" fill="url(#oldRenderGrad)" filter="url(#shadow)"/>

  <!-- House body right half (fresh new render) -->
  <rect x="450" y="120" width="370" height="330" fill="url(#newRenderGrad)" filter="url(#shadow)"/>

  <!-- ROOF - left side (old tiles) -->
  <polygon points="55,120 450,120 450,60 252,30" fill="#8B6040"/>
  <polygon points="55,120 252,30 60,30" fill="#7A5030"/>
  <!-- Roof tiles left -->
  <rect x="80" y="40" width="350" height="8" fill="none" stroke="#6B4020" stroke-width="1.5" opacity="0.5"/>
  <rect x="80" y="55" width="350" height="8" fill="none" stroke="#6B4020" stroke-width="1.5" opacity="0.5"/>
  <rect x="80" y="70" width="350" height="8" fill="none" stroke="#6B4020" stroke-width="1.5" opacity="0.5"/>
  <rect x="80" y="85" width="350" height="8" fill="none" stroke="#6B4020" stroke-width="1.5" opacity="0.5"/>
  <rect x="80" y="100" width="350" height="8" fill="none" stroke="#6B4020" stroke-width="1.5" opacity="0.5"/>

  <!-- ROOF - right side (new tiles) -->
  <polygon points="450,120 845,120 840,60 648,30" fill="#A07050"/>
  <polygon points="840,60 648,30 840,30" fill="#8B6040"/>
  <!-- Roof tiles right -->
  <rect x="450" y="40" width="370" height="8" fill="none" stroke="#8B6030" stroke-width="1.5" opacity="0.4"/>
  <rect x="450" y="55" width="370" height="8" fill="none" stroke="#8B6030" stroke-width="1.5" opacity="0.4"/>
  <rect x="450" y="70" width="370" height="8" fill="none" stroke="#8B6030" stroke-width="1.5" opacity="0.4"/>
  <rect x="450" y="85" width="370" height="8" fill="none" stroke="#8B6030" stroke-width="1.5" opacity="0.4"/>
  <rect x="450" y="100" width="370" height="8" fill="none" stroke="#8B6030" stroke-width="1.5" opacity="0.4"/>

  <!-- CRUMBLING RENDER - left half details -->
  <!-- Cracks and patches -->
  <path d="M120,160 Q125,175 118,190 Q122,205 115,220" stroke="#A09080" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M200,200 Q210,215 205,230 Q212,245 208,260" stroke="#A09080" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M280,170 Q275,185 282,200" stroke="#A09080" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Exposed brick patches -->
  <rect x="130" y="280" width="16" height="9" rx="1" fill="#C87050" opacity="0.7"/>
  <rect x="148" y="280" width="16" height="9" rx="1" fill="#C87050" opacity="0.7"/>
  <rect x="122" y="291" width="20" height="9" rx="1" fill="#B86040" opacity="0.7"/>
  <rect x="144" y="291" width="16" height="9" rx="1" fill="#C87050" opacity="0.6"/>
  <rect x="162" y="291" width="10" height="9" rx="1" fill="#B86040" opacity="0.5"/>
  <!-- Water stains -->
  <path d="M350,130 Q348,160 345,200 Q342,240 344,280" stroke="#9A8878" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M380,150 Q378,180 376,210" stroke="#9A8878" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- FRESH RENDER - right half texture -->
  <!-- Smooth texture lines for fresh render -->
  <path d="M470,130 Q520,132 570,130" stroke="#E8E0D5" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M470,145 Q520,147 570,145" stroke="#E8E0D5" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M470,160 Q570,162 670,160" stroke="#E8E0D5" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Corner bead -->
  <rect x="820" y="120" width="6" height="330" fill="#D8D0C5" opacity="0.6"/>

  <!-- LEFT WINDOW (old, weathered) -->
  <rect x="120" y="180" width="100" height="120" rx="3" fill="#B8D4E8" opacity="0.6" filter="url(#softShadow)"/>
  <rect x="120" y="180" width="100" height="120" rx="3" fill="none" stroke="#8B7355" stroke-width="3"/>
  <line x1="170" y1="180" x2="170" y2="300" stroke="#8B7355" stroke-width="2"/>
  <line x1="120" y1="240" x2="220" y2="240" stroke="#8B7355" stroke-width="2"/>
  <!-- Window weathering -->
  <rect x="120" y="180" width="100" height="8" fill="#8B7355" opacity="0.4"/>
  <!-- Shutter left window -->
  <rect x="98" y="180" width="20" height="120" rx="2" fill="#7A5535"/>
  <line x1="103" y1="195" x2="113" y2="195" stroke="#5A3515" stroke-width="1.5"/>
  <line x1="103" y1="210" x2="113" y2="210" stroke="#5A3515" stroke-width="1.5"/>
  <line x1="103" y1="225" x2="113" y2="225" stroke="#5A3515" stroke-width="1.5"/>
  <line x1="103" y1="240" x2="113" y2="240" stroke="#5A3515" stroke-width="1.5"/>
  <line x1="103" y1="255" x2="113" y2="255" stroke="#5A3515" stroke-width="1.5"/>
  <line x1="103" y1="270" x2="113" y2="270" stroke="#5A3515" stroke-width="1.5"/>
  <line x1="103" y1="285" x2="113" y2="285" stroke="#5A3515" stroke-width="1.5"/>

  <!-- RIGHT WINDOW (new, clean) -->
  <rect x="590" y="175" width="110" height="130" rx="3" fill="#B8D4E8" opacity="0.8" filter="url(#softShadow)"/>
  <rect x="590" y="175" width="110" height="130" rx="3" fill="none" stroke="#D0C8B8" stroke-width="3"/>
  <line x1="645" y1="175" x2="645" y2="305" stroke="#D0C8B8" stroke-width="2"/>
  <line x1="590" y1="240" x2="700" y2="240" stroke="#D0C8B8" stroke-width="2"/>
  <!-- Window reflection -->
  <path d="M598,183 Q608,193 598,203" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- New shutter -->
  <rect x="702" y="175" width="22" height="130" rx="2" fill="#8B6340"/>
  <line x1="707" y1="192" x2="719" y2="192" stroke="#6B4320" stroke-width="1.5"/>
  <line x1="707" y1="208" x2="719" y2="208" stroke="#6B4320" stroke-width="1.5"/>
  <line x1="707" y1="224" x2="719" y2="224" stroke="#6B4320" stroke-width="1.5"/>
  <line x1="707" y1="240" x2="719" y2="240" stroke="#6B4320" stroke-width="1.5"/>
  <line x1="707" y1="256" x2="719" y2="256" stroke="#6B4320" stroke-width="1.5"/>
  <line x1="707" y1="272" x2="719" y2="272" stroke="#6B4320" stroke-width="1.5"/>
  <line x1="707" y1="288" x2="719" y2="288" stroke="#6B4320" stroke-width="1.5"/>

  <!-- DOOR (center) -->
  <rect x="380" y="320" width="80" height="130" rx="4" fill="#5A3515"/>
  <rect x="385" y="325" width="32" height="55" rx="2" fill="#4A2505"/>
  <rect x="423" y="325" width="32" height="55" rx="2" fill="#4A2505"/>
  <rect x="385" y="388" width="32" height="55" rx="2" fill="#4A2505"/>
  <rect x="423" y="388" width="32" height="55" rx="2" fill="#4A2505"/>
  <!-- Door handle -->
  <circle cx="418" cy="387" r="4" fill="#F97316"/>

  <!-- SCAFFOLDING STRUCTURE -->
  <!-- Vertical poles -->
  <rect x="430" y="110" width="10" height="345" rx="3" fill="#8B6830" filter="url(#shadow)"/>
  <rect x="460" y="110" width="10" height="345" rx="3" fill="#7A5820"/>
  <!-- Horizontal planks at different levels -->
  <rect x="420" y="175" width="70" height="10" rx="2" fill="url(#woodPlanks)"/>
  <rect x="420" y="265" width="70" height="10" rx="2" fill="url(#woodPlanks)"/>
  <rect x="420" y="355" width="70" height="10" rx="2" fill="url(#woodPlanks)"/>
  <!-- Cross bracing -->
  <line x1="432" y1="120" x2="468" y2="175" stroke="#6B5020" stroke-width="3" opacity="0.7"/>
  <line x1="468" y1="120" x2="432" y2="175" stroke="#6B5020" stroke-width="3" opacity="0.7"/>
  <line x1="432" y1="185" x2="468" y2="260" stroke="#6B5020" stroke-width="3" opacity="0.7"/>
  <line x1="468" y1="185" x2="432" y2="260" stroke="#6B5020" stroke-width="3" opacity="0.7"/>
  <!-- Safety clamps -->
  <circle cx="435" cy="175" r="5" fill="#C0A060"/>
  <circle cx="465" cy="175" r="5" fill="#C0A060"/>
  <circle cx="435" cy="265" r="5" fill="#C0A060"/>
  <circle cx="465" cy="265" r="5" fill="#C0A060"/>

  <!-- WORKER SILHOUETTE on scaffolding -->
  <!-- Body -->
  <rect x="435" y="235" width="22" height="28" rx="4" fill="#3D2E1A"/>
  <!-- Legs -->
  <rect x="437" y="263" width="8" height="14" rx="2" fill="#2A1F10"/>
  <rect x="449" y="263" width="8" height="14" rx="2" fill="#2A1F10"/>
  <!-- Head with hard hat -->
  <circle cx="446" cy="228" r="10" fill="#3D2E1A"/>
  <ellipse cx="446" cy="220" rx="13" ry="7" fill="#F97316"/>
  <rect x="433" y="220" width="26" height="5" rx="2" fill="#E06010"/>
  <!-- Trowel arm -->
  <line x1="457" y1="245" x2="482" y2="238" stroke="#3D2E1A" stroke-width="4" stroke-linecap="round"/>
  <!-- Trowel blade -->
  <polygon points="482,234 492,237 488,245 478,242" fill="#A0A0A0"/>
  <!-- Vest hi-vis stripe -->
  <rect x="435" y="247" width="22" height="3" fill="#F97316" opacity="0.9"/>

  <!-- FRESH RENDER being applied (right side upper area) -->
  <!-- Wet render patch -->
  <rect x="480" y="215" width="180" height="60" rx="4" fill="#F0EBE0" opacity="0.7"/>
  <path d="M480,215 Q510,213 540,217 Q570,221 600,215 Q630,210 660,216" stroke="#E0D8CA" stroke-width="2" fill="none"/>
  <!-- Render texture marks -->
  <path d="M495,230 Q510,228 525,232" stroke="#D8D0C0" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M495,242 Q515,240 535,244" stroke="#D8D0C0" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M540,228 Q560,226 580,230" stroke="#D8D0C0" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M545,242 Q565,240 585,244" stroke="#D8D0C0" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- GROUND LEVEL MATERIALS -->
  <!-- Cement bag -->
  <rect x="100" y="410" width="70" height="40" rx="8" fill="#D8D0C0" filter="url(#shadow)"/>
  <rect x="108" y="418" width="54" height="24" rx="4" fill="#C8C0B0"/>
  <line x1="120" y1="424" x2="160" y2="424" stroke="#A8A098" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="430" x2="160" y2="430" stroke="#A8A098" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="436" x2="160" y2="436" stroke="#A8A098" stroke-width="1.5" opacity="0.5"/>
  <!-- Cement bag tie -->
  <rect x="128" y="408" width="16" height="8" rx="2" fill="#B8B0A0"/>
  <!-- Second bag leaning -->
  <rect x="175" y="415" width="65" height="38" rx="7" fill="#C8C0B0" transform="rotate(-8 175 415)" filter="url(#shadow)"/>

  <!-- Brick pile -->
  <rect x="650" y="410" width="30" height="12" rx="1" fill="#C87050"/>
  <rect x="682" y="410" width="30" height="12" rx="1" fill="#B86040"/>
  <rect x="716" y="410" width="28" height="12" rx="1" fill="#C87050"/>
  <rect x="655" y="422" width="28" height="12" rx="1" fill="#B86040"/>
  <rect x="685" y="422" width="30" height="12" rx="1" fill="#C87050"/>
  <rect x="717" y="422" width="24" height="12" rx="1" fill="#B86040"/>
  <rect x="648" y="434" width="32" height="12" rx="1" fill="#C87050"/>
  <rect x="682" y="434" width="28" height="12" rx="1" fill="#B86040"/>
  <rect x="712" y="434" width="30" height="12" rx="1" fill="#C87050"/>

  <!-- Toolbox -->
  <rect x="500" y="415" width="90" height="45" rx="6" fill="#1C1917" filter="url(#shadow)"/>
  <rect x="500" y="415" width="90" height="18" rx="6" fill="#2C2520"/>
  <!-- Toolbox handle -->
  <path d="M530,415 Q545,402 560,415" stroke="#F97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Toolbox latch -->
  <rect x="538" y="426" width="14" height="8" rx="2" fill="#F97316"/>
  <!-- Tools in box (visible) -->
  <line x1="515" y1="435" x2="515" y2="455" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
  <rect x="511" y="430" width="8" height="6" rx="1" fill="#A09080"/>
  <line x1="535" y1="435" x2="535" y2="455" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <line x1="555" y1="432" x2="575" y2="438" stroke="#A09080" stroke-width="4" stroke-linecap="round"/>

  <!-- Mortar bucket -->
  <path d="M280,430 Q280,410 295,408 L345,408 Q360,410 360,430 Z" fill="#D0C8B5"/>
  <rect x="281" y="430" width="78" height="20" rx="3" fill="#C0B8A5"/>
  <!-- Mortar content -->
  <path d="M285,410 Q320,405 355,410" stroke="#B0A895" stroke-width="2" fill="#C8C0AA" opacity="0.8"/>
  <!-- Bucket handle -->
  <path d="M290,408 Q320,390 350,408" stroke="#8B7355" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Bottom decorative border accent -->
  <rect x="80" y="448" width="370" height="4" fill="#8B7355" opacity="0.4"/>
  <rect x="450" y="448" width="370" height="4" fill="#F97316" opacity="0.5"/>

  <!-- Construction site sign (orange) -->
  <rect x="755" y="390" width="90" height="55" rx="4" fill="#F97316" filter="url(#shadow)"/>
  <rect x="758" y="393" width="84" height="49" rx="3" fill="#E06010"/>
  <!-- Hard hat symbol on sign -->
  <ellipse cx="800" cy="408" rx="18" ry="13" fill="#F97316"/>
  <rect x="782" y="413" width="36" height="6" rx="2" fill="#F97316"/>
  <ellipse cx="800" cy="407" rx="14" ry="8" fill="#FFE090"/>
  <!-- Sign pole -->
  <rect x="797" y="445" width="6" height="40" fill="#8B7355"/>

  <!-- Orange accent stripe along scaffolding -->
  <rect x="428" y="110" width="4" height="345" rx="2" fill="#F97316" opacity="0.6"/>

  <!-- Sun in sky -->
  <circle cx="820" cy="85" r="35" fill="#FFE090" opacity="0.7"/>
  <circle cx="820" cy="85" r="28" fill="#FFD060" opacity="0.8"/>
  <!-- Sun rays -->
  <line x1="820" y1="40" x2="820" y2="50" stroke="#FFD060" stroke-width="3" opacity="0.5"/>
  <line x1="855" y1="50" x2="848" y2="57" stroke="#FFD060" stroke-width="3" opacity="0.5"/>
  <line x1="865" y1="85" x2="855" y2="85" stroke="#FFD060" stroke-width="3" opacity="0.5"/>
  <line x1="785" y1="50" x2="792" y2="57" stroke="#FFD060" stroke-width="3" opacity="0.5"/>
  <line x1="775" y1="85" x2="785" y2="85" stroke="#FFD060" stroke-width="3" opacity="0.5"/>
</svg>
