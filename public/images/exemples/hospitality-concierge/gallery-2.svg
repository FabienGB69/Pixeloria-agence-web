  <text x="354" y="120" font-size="8" fill="#FFFDF5" opacity="0.6">Late checkout request</text>
  <rect x="420" y="125" width="68" height="12" rx="6" fill="#D4A853"/>
  <text x="454" y="134" text-anchor="middle" font-size="7" fill="#0F1E38" font-weight="bold">CONFIRMED</text>
  <rect x="344" y="145" width="152" height="46" rx="5" fill="#0F1E38" opacity="0.6"/>
  <text x="354" y="161" font-size="9" fill="#FFFDF5">Al-Rashid, F. — 502</text>
  <text x="354" y="173" font-size="8" fill="#FFFDF5" opacity="0.6">Dinner reservation</text>
  <rect x="420" y="178" width="68" height="12" rx="6" fill="#7B2D42"/>
  <text x="454" y="187" text-anchor="middle" font-size="7" fill="#FFFDF5" font-weight="bold">PENDING</text>
  <rect x="344" y="198" width="152" height="46" rx="5" fill="#0F1E38" opacity="0.6"/>
  <text x="354" y="214" font-size="9" fill="#D4A853">Chen, M. — PH Suite</text>
  <text x="354" y="226" font-size="8" fill="#FFFDF5" opacity="0.6">Private event setup</text>
  <rect x="420" y="231" width="68" height="12" rx="6" fill="#c8983a"/>
  <text x="454" y="240" text-anchor="middle" font-size="7" fill="#FFFDF5" font-weight="bold">VIP</text>
  <rect x="344" y="251" width="152" height="46" rx="5" fill="#0F1E38" opacity="0.6"/>
  <text x="354" y="267" font-size="9" fill="#FFFDF5">Park, S. — Suite 318</text>
  <text x="354" y="279" font-size="8" fill="#FFFDF5" opacity="0.6">Floral arrangement</text>
  <rect x="420" y="284" width="68" height="12" rx="6" fill="#1a6a3a"/>
  <text x="454" y="293" text-anchor="middle" font-size="7" fill="#FFFDF5" font-weight="bold">CONFIRMED</text>
  <!-- Label -->
  <rect x="0" y="316" width="520" height="44" fill="#7B2D42"/>
  <rect x="0" y="314" width="520" height="4" fill="url(#goldG)"/>
  <text x="260" y="343" text-anchor="middle" font-size="15" fill="#FFFDF5" font-weight="bold" letter-spacing="2">BOOKING MANAGEMENT</text>
