  <rect x="365" y="163" width="3" height="4" rx="1" fill="white" opacity="0.9"/>
  <path d="M377 162 Q381 165 377 168" stroke="white" stroke-width="1.5" fill="none"/>

  <!-- Card below line -->
  <rect x="325" y="188" width="96" height="90" rx="8" fill="url(#cardPur)" filter="url(#cardShadow)"/>
  <rect x="325" y="188" width="96" height="6" rx="8" fill="#7C3AED" opacity="0.5"/>
  <line x1="373" y1="177" x2="373" y2="185" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
  <!-- Icon: microphone / speaker -->
