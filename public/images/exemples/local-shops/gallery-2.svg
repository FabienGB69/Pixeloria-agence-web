<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#f0e8d4"/>
    </linearGradient>
    <linearGradient id="headerG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="btnG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0a5a54"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000018"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="520" height="360" fill="url(#bgG)"/>
  <!-- Header / nav bar -->
  <rect x="0" y="0" width="520" height="48" fill="#1C1917"/>
  <rect x="0" y="46" width="520" height="3" fill="url(#headerG)"/>
  <!-- Logo area -->
  <rect x="16" y="12" width="100" height="26" rx="4" fill="#B45309" opacity="0.9"/>
  <text x="66" y="29" text-anchor="middle" font-size="10" fill="#FFFBEB" font-weight="bold">LOCAL SHOP</text>
  <!-- Nav links -->
  <text x="160" y="30" font-size="10" fill="#FFFBEB" opacity="0.7">Home</text>
  <text x="210" y="30" font-size="10" fill="#FFFBEB" opacity="0.7">Catalog</text>
  <text x="268" y="30" font-size="10" fill="#FFFBEB" opacity="0.9" font-weight="bold">Shop</text>
  <text x="316" y="30" font-size="10" fill="#FFFBEB" opacity="0.7">About</text>
  <!-- Cart icon with badge -->
  <text x="460" y="32" font-size="18" fill="#FFFBEB">&#128722;</text>
  <circle cx="482" cy="14" r="9" fill="#B45309"/>
  <text x="482" y="18" text-anchor="middle" font-size="8" fill="#FFFBEB" font-weight="bold">3</text>
  <!-- Search bar -->
  <rect x="14" y="56" width="320" height="28" rx="14" fill="#ffffff" stroke="#d8c8a8" stroke-width="1.5"/>
  <text x="32" y="74" font-size="10" fill="#1C1917" opacity="0.5">Search products...</text>
  <rect x="336" y="56" width="80" height="28" rx="14" fill="url(#btnG)"/>
  <text x="376" y="74" text-anchor="middle" font-size="10" fill="#FFFBEB" font-weight="bold">Search</text>
  <!-- Filter pills -->
  <rect x="14" y="92" width="60" height="20" rx="10" fill="#B45309"/>
  <text x="44" y="105" text-anchor="middle" font-size="8" fill="#FFFBEB" font-weight="bold">All Items</text>
  <rect x="80" y="92" width="52" height="20" rx="10" fill="#ffffff" stroke="#d8c8a8" stroke-width="1"/>
  <text x="106" y="105" text-anchor="middle" font-size="8" fill="#1C1917" opacity="0.7">Pantry</text>
  <rect x="138" y="92" width="52" height="20" rx="10" fill="#ffffff" stroke="#d8c8a8" stroke-width="1"/>
  <text x="164" y="105" text-anchor="middle" font-size="8" fill="#1C1917" opacity="0.7">Crafts</text>
  <rect x="196" y="92" width="52" height="20" rx="10" fill="#ffffff" stroke="#d8c8a8" stroke-width="1"/>
  <text x="222" y="105" text-anchor="middle" font-size="8" fill="#1C1917" opacity="0.7">Books</text>
  <rect x="254" y="92" width="52" height="20" rx="10" fill="#0F766E" opacity="0.15" stroke="#0F766E" stroke-width="1"/>
  <text x="280" y="105" text-anchor="middle" font-size="8" fill="#0F766E">Gifts</text>
  <!-- Product card 1 -->
  <rect x="14" y="122" width="112" height="148" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="14" y="122" width="112" height="80" rx="8" fill="#f8e8c0"/>
  <rect x="14" y="178" width="112" height="24" fill="#f8e8c0"/>
  <circle cx="70" cy="162" r="28" fill="#e8c870" opacity="0.8"/>
  <circle cx="70" cy="162" r="18" fill="#d4a830" opacity="0.7"/>
  <text x="70" y="167" text-anchor="middle" font-size="10" fill="#FFFBEB">&#127852;</text>
  <text x="70" y="215" text-anchor="middle" font-size="8" fill="#1C1917" font-weight="bold">Artisan Honey</text>
  <text x="70" y="228" text-anchor="middle" font-size="7" fill="#1C1917" opacity="0.6">Local Farm · 450g</text>
  <text x="70" y="243" text-anchor="middle" font-size="10" fill="#B45309" font-weight="bold">$12.99</text>
  <rect x="24" y="252" width="92" height="12" rx="6" fill="url(#btnG)"/>
  <text x="70" y="261" text-anchor="middle" font-size="7" fill="#FFFBEB" font-weight="bold">Add to Cart</text>
  <!-- Product card 2 -->
  <rect x="136" y="122" width="112" height="148" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="136" y="122" width="112" height="80" rx="8" fill="#d8f0e8"/>
  <rect x="136" y="178" width="112" height="24" fill="#d8f0e8"/>
  <circle cx="192" cy="162" r="28" fill="#60b890" opacity="0.8"/>
  <circle cx="192" cy="162" r="18" fill="#40a870" opacity="0.7"/>
  <text x="192" y="167" text-anchor="middle" font-size="10" fill="#FFFBEB">&#127807;</text>
  <text x="192" y="215" text-anchor="middle" font-size="8" fill="#1C1917" font-weight="bold">Herb Tea Blend</text>
  <text x="192" y="228" text-anchor="middle" font-size="7" fill="#1C1917" opacity="0.6">Organic · 20 bags</text>
  <text x="192" y="243" text-anchor="middle" font-size="10" fill="#B45309" font-weight="bold">$8.50</text>
  <rect x="146" y="252" width="92" height="12" rx="6" fill="url(#btnG)"/>
  <text x="192" y="261" text-anchor="middle" font-size="7" fill="#FFFBEB" font-weight="bold">Add to Cart</text>
  <!-- Product card 3 -->
  <rect x="258" y="122" width="112" height="148" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="258" y="122" width="112" height="80" rx="8" fill="#f0e0d8"/>
  <rect x="258" y="178" width="112" height="24" fill="#f0e0d8"/>
  <circle cx="314" cy="162" r="28" fill="#e09070" opacity="0.8"/>
  <circle cx="314" cy="162" r="18" fill="#c87050" opacity="0.7"/>
  <text x="314" y="167" text-anchor="middle" font-size="10" fill="#FFFBEB">&#127775;</text>
  <text x="314" y="215" text-anchor="middle" font-size="8" fill="#1C1917" font-weight="bold">Beeswax Candle</text>
  <text x="314" y="228" text-anchor="middle" font-size="7" fill="#1C1917" opacity="0.6">Handmade · 200g</text>
  <text x="314" y="243" text-anchor="middle" font-size="10" fill="#B45309" font-weight="bold">$18.00</text>
  <rect x="268" y="252" width="92" height="12" rx="6" fill="url(#btnG)"/>
  <text x="314" y="261" text-anchor="middle" font-size="7" fill="#FFFBEB" font-weight="bold">Add to Cart</text>
  <!-- Product card 4 -->
  <rect x="380" y="122" width="112" height="148" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="380" y="122" width="112" height="80" rx="8" fill="#e8e0f8"/>
  <rect x="380" y="178" width="112" height="24" fill="#e8e0f8"/>
  <circle cx="436" cy="162" r="28" fill="#a090d0" opacity="0.8"/>
  <circle cx="436" cy="162" r="18" fill="#8070b0" opacity="0.7"/>
  <text x="436" y="167" text-anchor="middle" font-size="10" fill="#FFFBEB">&#127873;</text>
  <text x="436" y="215" text-anchor="middle" font-size="8" fill="#1C1917" font-weight="bold">Gift Box Set</text>
  <text x="436" y="228" text-anchor="middle" font-size="7" fill="#1C1917" opacity="0.6">Assorted · 5 items</text>
  <text x="436" y="243" text-anchor="middle" font-size="10" fill="#B45309" font-weight="bold">$34.95</text>
  <rect x="390" y="252" width="92" height="12" rx="6" fill="#B45309" opacity="0.9"/>
  <text x="436" y="261" text-anchor="middle" font-size="7" fill="#FFFBEB" font-weight="bold">POPULAR</text>
  <!-- Label -->
  <rect x="0" y="316" width="520" height="44" fill="#1C1917"/>
  <rect x="0" y="314" width="520" height="4" fill="url(#headerG)"/>
  <text x="260" y="343" text-anchor="middle" font-size="15" fill="#FFFBEB" font-weight="bold" letter-spacing="2">ONLINE STORE</text>
</svg>
