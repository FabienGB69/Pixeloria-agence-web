  <rect x="18" y="227" width="328" height="30" rx="4" fill="url(#bookedGrad)" opacity="0.85"/>
  <text x="182" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#0F1E38">Réservé · Famille Chen (7 nuits)</text>

  <!-- Row 5 -->
  <text x="40" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">29</text>
  <text x="87" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">30</text>
