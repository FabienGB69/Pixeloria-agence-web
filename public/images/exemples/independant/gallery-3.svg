<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="timelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cardBlu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="cardYel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="cardGrn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="cardPur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="cardOra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <filter id="mileShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="360" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="bold">Parcours &amp; Réalisations</text>
  <line x1="140" y1="34" x2="380" y2="34" stroke="#2563EB" stroke-width="1.5" opacity="0.4"/>

  <!-- TIMELINE horizontal line -->
  <line x1="50" y1="165" x2="470" y2="165" stroke="url(#timelineGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrow at end -->
  <polygon points="470,165 458,159 458,171" fill="#2563EB"/>

  <!-- Timeline year labels below line -->
  <text x="78" y="185" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="bold">2019</text>
  <text x="183" y="185" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="bold">2020</text>
  <text x="288" y="185" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="bold">2022</text>
  <text x="373" y="185" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="bold">2023</text>
  <text x="458" y="185" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="bold">2024</text>

  <!-- Connecting dotted segments between markers -->
  <line x1="78" y1="165" x2="183" y2="165" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="183" y1="165" x2="288" y2="165" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="288" y1="165" x2="373" y2="165" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="373" y1="165" x2="458" y2="165" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- MILESTONE 1: 2019 — Lancement Freelance -->
  <!-- Marker circle -->
  <circle cx="78" cy="165" r="12" fill="#1E3A5F" filter="url(#mileShadow)"/>
  <circle cx="78" cy="165" r="8" fill="#2563EB"/>
  <!-- Laptop icon inside circle -->
  <rect x="73" y="162" width="10" height="7" rx="1" fill="white" opacity="0.9"/>
  <rect x="71" y="169" width="14" height="2" rx="1" fill="white" opacity="0.7"/>

  <!-- Card above line -->
  <rect x="30" y="58" width="96" height="90" rx="8" fill="url(#cardBlu)" filter="url(#cardShadow)"/>
  <rect x="30" y="58" width="96" height="6" rx="8" fill="#2563EB" opacity="0.5"/>
  <rect x="30" y="62" width="96" height="2" fill="#2563EB" opacity="0.5"/>
  <!-- Connector line -->
  <line x1="78" y1="148" x2="78" y2="153" stroke="#2563EB" stroke-width="2" opacity="0.5"/>
  <!-- Icon: laptop -->
  <rect x="57" y="72" width="42" height="28" rx="4" fill="#2563EB" opacity="0.8"/>
  <rect x="60" y="75" width="36" height="20" rx="2" fill="#DBEAFE"/>
  <rect x="62" y="77" width="32" height="3" rx="1" fill="#2563EB" opacity="0.7"/>
  <rect x="62" y="83" width="20" height="2" rx="1" fill="#93C5FD"/>
  <rect x="62" y="88" width="28" height="2" rx="1" fill="#93C5FD" opacity="0.7"/>
  <rect x="55" y="100" width="46" height="4" rx="2" fill="#1E3A5F" opacity="0.5"/>
  <!-- Text -->
  <text x="78" y="115" text-anchor="middle" font-size="8.5" fill="#1E3A5F" font-weight="bold">Lancement</text>
  <text x="78" y="125" text-anchor="middle" font-size="8.5" fill="#1E3A5F" font-weight="bold">Freelance</text>
  <rect x="36" y="130" width="64" height="12" rx="6" fill="#2563EB" opacity="0.2"/>
  <text x="68" y="140" text-anchor="middle" font-size="7" fill="#1E3A5F">Dev web · 3 clients</text>

  <!-- MILESTONE 2: 2020 — Agence partenaire -->
  <circle cx="183" cy="165" r="12" fill="#D97706" filter="url(#mileShadow)"/>
  <circle cx="183" cy="165" r="8" fill="#F59E0B"/>
  <!-- Chart bars icon -->
  <rect x="178" y="163" width="3" height="5" fill="white" opacity="0.9"/>
  <rect x="182" y="160" width="3" height="8" fill="white" opacity="0.9"/>
  <rect x="186" y="162" width="3" height="6" fill="white" opacity="0.9"/>

