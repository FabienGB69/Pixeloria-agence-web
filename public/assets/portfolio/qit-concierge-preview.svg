<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif" role="img" aria-label="Aperçu du site Qit Concierge — conciergerie location courte durée">
  <defs>
    <linearGradient id="qcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D18"/>
      <stop offset="100%" stop-color="#14141F"/>
    </linearGradient>
    <linearGradient id="qcGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#F0C96A"/>
    </linearGradient>
    <linearGradient id="qcCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#12121C"/>
    </linearGradient>
    <linearGradient id="qcHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1A2E"/>
      <stop offset="100%" stop-color="#0D0D18"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="600" height="400" fill="url(#qcBg)"/>

  <!-- Browser chrome -->
  <rect width="600" height="32" fill="#1A1A28" rx="0"/>
  <circle cx="18" cy="16" r="5" fill="#FF5F57"/>
  <circle cx="34" cy="16" r="5" fill="#FEBC2E"/>
  <circle cx="50" cy="16" r="5" fill="#28C840"/>
  <!-- URL bar -->
  <rect x="80" y="8" width="300" height="16" rx="8" fill="#252535"/>
  <text x="230" y="20" text-anchor="middle" font-size="9" fill="#8888AA">qitconcierge.fr</text>

  <!-- Header nav bar -->
  <rect x="0" y="32" width="600" height="48" fill="#0D0D18" opacity="0.95"/>
  <rect x="0" y="79" width="600" height="1" fill="#D4A843" opacity="0.3"/>
  <!-- Logo area -->
  <text x="28" y="62" font-size="13" font-weight="700" fill="#F0C96A" letter-spacing="2">QIT</text>
  <text x="55" y="62" font-size="13" font-weight="300" fill="#E8E8F0" letter-spacing="1">CONCIERGE</text>
  <!-- Nav links -->
  <text x="340" y="62" font-size="9" fill="#C0C0D8">Services</text>
  <text x="400" y="62" font-size="9" fill="#C0C0D8">Comment ça marche</text>
  <text x="490" y="62" font-size="9" fill="#C0C0D8">Contact</text>
  <!-- CTA button -->
  <rect x="540" y="50" width="50" height="20" rx="4" fill="url(#qcGold)"/>
  <text x="565" y="64" text-anchor="middle" font-size="8" font-weight="700" fill="#0D0D18">Devis</text>

  <!-- Hero section -->
  <rect x="0" y="80" width="600" height="160" fill="url(#qcHero)"/>

  <!-- Subtle background pattern -->
  <g opacity="0.04" stroke="#D4A843" stroke-width="0.5">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="100" y1="80" x2="100" y2="240"/>
    <line x1="200" y1="80" x2="200" y2="240"/>
    <line x1="300" y1="80" x2="300" y2="240"/>
    <line x1="400" y1="80" x2="400" y2="240"/>
    <line x1="500" y1="80" x2="500" y2="240"/>
  </g>

  <!-- Gold decorative line -->
  <rect x="28" y="104" width="40" height="2" fill="url(#qcGold)" rx="1"/>

  <!-- Hero headline -->
  <text x="28" y="132" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Gérez vos locations</text>
  <text x="28" y="156" font-size="20" font-weight="700" fill="url(#qcGold)" letter-spacing="-0.5">courte durée</text>
  <text x="28" y="174" font-size="20" font-weight="300" fill="#E0E0F0" letter-spacing="-0.5">sans contraintes.</text>

  <!-- Hero sub -->
  <text x="28" y="198" font-size="9" fill="#9090B0">Conciergerie professionnelle · Gestion complète · Airbnb &amp; Booking</text>

  <!-- CTA hero buttons -->
  <rect x="28" y="210" width="120" height="26" rx="5" fill="url(#qcGold)"/>
  <text x="88" y="227" text-anchor="middle" font-size="9" font-weight="700" fill="#0D0D18">Demander un devis</text>
  <rect x="158" y="210" width="100" height="26" rx="5" fill="none" stroke="#D4A843" stroke-width="1"/>
  <text x="208" y="227" text-anchor="middle" font-size="9" fill="#D4A843">Nos services →</text>

  <!-- Stats row on hero right -->
  <rect x="380" y="95" width="200" height="130" rx="12" fill="#1A1A2E" opacity="0.7" stroke="#D4A843" stroke-opacity="0.2" stroke-width="1"/>
  <text x="480" y="118" text-anchor="middle" font-size="8" fill="#9090B0" letter-spacing="1">BIENS GÉRÉS</text>
  <text x="480" y="142" text-anchor="middle" font-size="26" font-weight="800" fill="#F0C96A">47+</text>
  <line x1="400" y1="155" x2="560" y2="155" stroke="#D4A843" stroke-opacity="0.15"/>
  <text x="440" y="172" text-anchor="middle" font-size="8" fill="#9090B0">TAUX OCCUPATION</text>
  <text x="440" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">92%</text>
  <text x="530" y="172" text-anchor="middle" font-size="8" fill="#9090B0">SATISFACTION</text>
  <g fill="#F0C96A">
    <text x="510" y="190" font-size="10">★</text>
    <text x="521" y="190" font-size="10">★</text>
    <text x="532" y="190" font-size="10">★</text>
    <text x="543" y="190" font-size="10">★</text>
    <text x="554" y="190" font-size="10">★</text>
  </g>

  <!-- Services section -->
  <rect x="0" y="240" width="600" height="160" fill="#0F0F1A"/>
  <text x="300" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Nos services de conciergerie</text>
  <rect x="260" y="273" width="80" height="1.5" fill="url(#qcGold)" rx="1"/>

  <!-- Service cards row -->
  <rect x="18" y="285" width="172" height="90" rx="8" fill="url(#qcCard)" stroke="#D4A843" stroke-opacity="0.15" stroke-width="1"/>
  <text x="104" y="308" text-anchor="middle" font-size="16">🏠</text>
  <text x="104" y="326" text-anchor="middle" font-size="9" font-weight="700" fill="#F0C96A">Gestion locative</text>
  <text x="104" y="340" text-anchor="middle" font-size="8" fill="#8888AA">Accueil, ménage,</text>
  <text x="104" y="352" text-anchor="middle" font-size="8" fill="#8888AA">linge, check-out</text>

  <rect x="214" y="285" width="172" height="90" rx="8" fill="url(#qcCard)" stroke="#D4A843" stroke-opacity="0.15" stroke-width="1"/>
  <text x="300" y="308" text-anchor="middle" font-size="16">📅</text>
  <text x="300" y="326" text-anchor="middle" font-size="9" font-weight="700" fill="#F0C96A">Optimisation agenda</text>
  <text x="300" y="340" text-anchor="middle" font-size="8" fill="#8888AA">Airbnb · Booking</text>
  <text x="300" y="352" text-anchor="middle" font-size="8" fill="#8888AA">VRBO · Direct</text>

  <rect x="410" y="285" width="172" height="90" rx="8" fill="url(#qcCard)" stroke="#D4A843" stroke-opacity="0.15" stroke-width="1"/>
  <text x="496" y="308" text-anchor="middle" font-size="16">💬</text>
  <text x="496" y="326" text-anchor="middle" font-size="9" font-weight="700" fill="#F0C96A">Service voyageurs</text>
  <text x="496" y="340" text-anchor="middle" font-size="8" fill="#8888AA">Réponses 24/7,</text>
  <text x="496" y="352" text-anchor="middle" font-size="8" fill="#8888AA">coordination complète</text>

  <!-- Footer strip -->
  <rect x="0" y="385" width="600" height="15" fill="#0A0A12"/>
  <text x="300" y="395" text-anchor="middle" font-size="7" fill="#444466">© 2026 Qit Concierge · Créé par Pixeloria</text>
</svg>
