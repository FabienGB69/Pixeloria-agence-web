  </defs>
  <!-- Background -->
  <rect width="520" height="360" fill="url(#bgG)"/>
  <!-- Header bar -->
  <rect x="0" y="0" width="520" height="42" fill="#0a1628"/>
  <rect x="0" y="40" width="520" height="2" fill="url(#goldG)"/>
  <text x="20" y="27" font-size="13" fill="#D4A853" font-weight="bold" letter-spacing="1">CONCIERGE PORTAL</text>
  <!-- Navigation dots -->
  <circle cx="420" cy="21" r="5" fill="#D4A853" opacity="0.9"/>
  <circle cx="436" cy="21" r="5" fill="#FFFDF5" opacity="0.3"/>
  <circle cx="452" cy="21" r="5" fill="#FFFDF5" opacity="0.3"/>
  <circle cx="468" cy="21" r="5" fill="#FFFDF5" opacity="0.3"/>
  <!-- Calendar main panel -->
