<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="ceilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F4EE"/>
      <stop offset="100%" stop-color="#EDE8E0"/>
    </linearGradient>
    <linearGradient id="wallLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8E2D8"/>
      <stop offset="100%" stop-color="#F2EDE5"/>
    </linearGradient>
    <linearGradient id="wallBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE8DE"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4B896"/>
      <stop offset="100%" stop-color="#C4A882"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="40%" stop-color="#FFF8E0"/>
      <stop offset="100%" stop-color="#F5EEC8"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6CAB8"/>
      <stop offset="100%" stop-color="#BFB49E"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FFFBE0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFBE0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: back wall -->
  <rect width="520" height="360" fill="url(#wallBack)"/>

  <!-- Ceiling -->
  <polygon points="0,0 520,0 460,80 60,80" fill="url(#ceilGrad)"/>
  <!-- Ceiling cornice -->
  <polygon points="0,0 520,0 460,80 60,80" fill="none" stroke="#CFC8BC" stroke-width="1.5"/>

  <!-- Left wall (perspective) -->
  <polygon points="0,0 60,80 60,310 0,360" fill="url(#wallLeft)"/>
  <!-- Left wall baseboard -->
  <rect x="0" y="305" width="62" height="8" fill="#C8C0B4" opacity="0.7"/>

  <!-- Floor (perspective) -->
  <polygon points="0,360 520,360 460,310 60,310" fill="url(#floorGrad)"/>
  <!-- Parquet lines horizontal -->
  <line x1="60" y1="320" x2="460" y2="320" stroke="#B89870" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="330" x2="460" y2="330" stroke="#B89870" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="340" x2="460" y2="340" stroke="#B89870" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="350" x2="460" y2="350" stroke="#B89870" stroke-width="0.8" opacity="0.4"/>
  <line x1="60" y1="360" x2="460" y2="360" stroke="#B89870" stroke-width="0.8" opacity="0.4"/>
  <line x1="30" y1="310" x2="490" y2="310" stroke="#C4A880" stroke-width="1" opacity="0.3"/>
  <!-- Parquet planks (vertical joints) -->
  <line x1="110" y1="310" x2="85" y2="360" stroke="#B89870" stroke-width="0.6" opacity="0.4"/>
  <line x1="170" y1="310" x2="140" y2="360" stroke="#B89870" stroke-width="0.6" opacity="0.4"/>
  <line x1="230" y1="310" x2="195" y2="360" stroke="#B89870" stroke-width="0.6" opacity="0.4"/>
  <line x1="290" y1="310" x2="250" y2="360" stroke="#B89870" stroke-width="0.6" opacity="0.4"/>
  <line x1="350" y1="310" x2="305" y2="360" stroke="#B89870" stroke-width="0.6" opacity="0.4"/>
  <line x1="410" y1="310" x2="360" y2="360" stroke="#B89870" stroke-width="0.6" opacity="0.4"/>

  <!-- Back wall baseboard -->
  <rect x="60" y="300" width="400" height="10" rx="1" fill="#D6CFCA" opacity="0.6"/>

  <!-- Large bay window (back wall, right side) -->
  <rect x="280" y="82" width="174" height="218" rx="3" fill="url(#windowLight)"/>
  <!-- Sun glow overlay -->
  <rect x="280" y="82" width="174" height="218" fill="url(#sunGlow)"/>
  <!-- Window frame -->
  <rect x="280" y="82" width="174" height="218" rx="3" fill="none" stroke="#B8A898" stroke-width="3"/>
  <!-- Window dividers -->
  <line x1="367" y1="82" x2="367" y2="300" stroke="#B8A898" stroke-width="2.5"/>
  <line x1="280" y1="185" x2="454" y2="185" stroke="#B8A898" stroke-width="2"/>
  <!-- Window light rays -->
  <line x1="320" y1="82" x2="200" y2="310" stroke="#FFF8D0" stroke-width="20" opacity="0.25"/>
  <line x1="400" y1="82" x2="310" y2="310" stroke="#FFF8D0" stroke-width="12" opacity="0.18"/>
  <!-- Window pane reflections -->
  <rect x="284" y="86" width="78" height="94" fill="#FFFEF5" opacity="0.3"/>
  <rect x="371" y="86" width="78" height="94" fill="#FFFEF5" opacity="0.18"/>

  <!-- Curtains -->
  <!-- Left curtain -->
  <path d="M278,82 C262,110 258,150 264,200 C258,240 260,270 264,300 L276,300 C270,270 272,240 278,200 C272,150 276,108 280,82Z" fill="#D8CFC4" opacity="0.85"/>
  <path d="M264,82 C252,115 248,160 252,205 C246,248 249,278 252,300 L258,300 C256,278 258,248 264,205 C260,160 264,113 268,82Z" fill="#C8BFB4" opacity="0.75"/>
  <!-- Right curtain -->
  <path d="M454,82 C468,110 474,150 468,200 C474,240 472,270 468,300 L456,300 C462,270 460,240 454,200 C460,150 456,108 452,82Z" fill="#D8CFC4" opacity="0.85"/>
  <path d="M470,82 C480,115 484,160 480,205 C486,248 484,278 480,300 L474,300 C476,278 480,248 474,205 C478,160 474,113 470,82Z" fill="#C8BFB4" opacity="0.75"/>

  <!-- Sofa (perspective) -->
  <!-- Sofa base -->
  <rect x="95" y="255" width="218" height="48" rx="8" fill="url(#sofaGrad)"/>
  <!-- Sofa back -->
  <rect x="95" y="220" width="218" height="42" rx="8" fill="#C8BEAC"/>
  <!-- Sofa cushions -->
  <rect x="100" y="222" width="100" height="38" rx="6" fill="#D2C6B4"/>
  <rect x="206" y="222" width="100" height="38" rx="6" fill="#CAC0AE"/>
  <!-- Cushion divider shadow -->
  <line x1="205" y1="222" x2="205" y2="260" stroke="#B0A898" stroke-width="1.5"/>
  <!-- Sofa left arm -->
  <rect x="85" y="220" width="18" height="68" rx="5" fill="#BFBAA8"/>
  <!-- Sofa right arm -->
  <rect x="305" y="220" width="18" height="68" rx="5" fill="#BFBAA8"/>
  <!-- Sofa legs -->
  <rect x="100" y="300" width="8" height="14" rx="2" fill="#8A7E6A"/>
  <rect x="300" y="300" width="8" height="14" rx="2" fill="#8A7E6A"/>

  <!-- Decorative throw pillow on sofa -->
  <rect x="190" y="226" width="32" height="28" rx="5" fill="#A8C4D8" opacity="0.75"/>
  <line x1="196" y1="232" x2="216" y2="248" stroke="#8AAFC8" stroke-width="1" opacity="0.6"/>
  <line x1="216" y1="232" x2="196" y2="248" stroke="#8AAFC8" stroke-width="1" opacity="0.6"/>

  <!-- Coffee table -->
  <ellipse cx="205" cy="300" rx="68" ry="16" fill="#C8B89A" opacity="0.6"/>
  <ellipse cx="205" cy="296" rx="68" ry="14" fill="#D4C4A8"/>
  <rect x="196" y="296" width="18" height="16" rx="2" fill="#BCA888"/>
  <!-- Table decoration: small vase -->
  <ellipse cx="218" cy="292" rx="5" ry="3" fill="#C9A84C" opacity="0.7"/>
  <rect x="215" y="276" width="7" height="16" rx="3" fill="#8AAA7A" opacity="0.8"/>

  <!-- Plant in corner -->
  <!-- Pot -->
  <ellipse cx="70" cy="305" rx="18" ry="8" fill="#C09878"/>
  <rect x="54" y="286" width="32" height="20" rx="3" fill="#C09878"/>
  <ellipse cx="70" cy="286" rx="16" ry="6" fill="#D4AE8E"/>
  <!-- Plant leaves -->
  <ellipse cx="70" cy="270" rx="22" ry="28" fill="#4A7A40" opacity="0.85"/>
  <ellipse cx="55" cy="262" rx="16" ry="22" fill="#3A6830" opacity="0.8"/>
  <ellipse cx="84" cy="260" rx="14" ry="20" fill="#5A8A4A" opacity="0.8"/>
  <ellipse cx="70" cy="255" rx="10" ry="16" fill="#6A9A58" opacity="0.7"/>

  <!-- Small side table (right) -->
  <ellipse cx="430" cy="284" rx="22" ry="10" fill="#C4B89A" opacity="0.7"/>
  <ellipse cx="430" cy="280" rx="22" ry="10" fill="#D0C4A4"/>
  <rect x="426" y="280" width="8" height="28" rx="2" fill="#B8A888"/>
  <!-- Book on side table -->
  <rect x="418" y="272" width="22" height="8" rx="1" fill="#8AAFC8" opacity="0.75"/>
  <rect x="418" y="265" width="22" height="7" rx="1" fill="#C9A84C" opacity="0.65"/>

  <!-- SALON label badge -->
  <rect x="8" y="10" width="88" height="28" rx="5" fill="#1A2E4A" opacity="0.85"/>
  <text x="52" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" letter-spacing="1.5">SALON</text>

  <!-- Light rays on floor from window -->
  <polygon points="310,300 454,300 490,360 270,360" fill="#FFFBE0" opacity="0.18"/>
</svg>
