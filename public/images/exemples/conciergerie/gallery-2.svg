  <rect x="18" y="262" width="136" height="30" rx="4" fill="url(#availGrad)" opacity="0.7"/>
  <text x="87" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1A4A28">Disponible</text>

  <!-- Legend -->
  <rect x="18" y="300" width="12" height="12" rx="2" fill="url(#bookedGrad)"/>
  <text x="36" y="310" font-family="Arial, sans-serif" font-size="8" fill="#4A4A50">Réservé</text>
  <rect x="90" y="300" width="12" height="12" rx="2" fill="url(#availGrad)"/>
  <text x="108" y="310" font-family="Arial, sans-serif" font-size="8" fill="#4A4A50">Disponible</text>
  <rect x="176" y="300" width="12" height="12" rx="2" fill="url(#partialGrad)"/>
  <text x="194" y="310" font-family="Arial, sans-serif" font-size="8" fill="#4A4A50">Option</text>
  <circle cx="248" cy="306" r="6" fill="#0F1E38"/>
  <text x="266" y="310" font-family="Arial, sans-serif" font-size="8" fill="#4A4A50">Aujourd'hui</text>

  <!-- Stats sidebar -->
  <rect x="358" y="92" width="148" height="76" rx="10" fill="url(#statCardGrad)" filter="url(#cardShadow)"/>
  <text x="432" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8A8880">Taux d'occupation</text>
  <text x="432" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#D4A853">87%</text>
  <!-- Occupancy bar -->
  <rect x="372" y="152" width="120" height="8" rx="4" fill="#EEE8E0"/>
  <rect x="372" y="152" width="104" height="8" rx="4" fill="url(#bookedGrad)"/>

  <rect x="358" y="178" width="148" height="60" rx="10" fill="url(#statCardGrad)" filter="url(#cardShadow)"/>
  <text x="432" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8A8880">Revenus juin</text>
  <text x="432" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0F1E38">4 200 €</text>

  <rect x="358" y="248" width="68" height="56" rx="10" fill="url(#statCardGrad)" filter="url(#cardShadow)"/>
  <text x="392" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8A8880">Séjours</text>
  <text x="392" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1E38">12</text>

  <rect x="438" y="248" width="68" height="56" rx="10" fill="url(#statCardGrad)" filter="url(#cardShadow)"/>
  <text x="472" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8A8880">Note moy.</text>
  <text x="472" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#D4A853">4,9</text>
  <text x="472" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D4A853">★★★★★</text>

  <!-- GESTION LOCATIVE label -->
  <rect x="358" y="314" width="148" height="28" rx="5" fill="#0F1E38" opacity="0.9"/>
  <rect x="361" y="317" width="142" height="22" rx="4" fill="none" stroke="#D4A853" stroke-width="1"/>
  <text x="432" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#D4A853" letter-spacing="0.5">GESTION LOCATIVE</text>
