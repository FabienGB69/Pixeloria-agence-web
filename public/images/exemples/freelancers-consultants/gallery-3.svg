  <circle cx="260" cy="175" r="30" fill="none" stroke="#F8FAFC" stroke-width="1.5" opacity="0.3"/>
  <!-- Person icon in center -->
  <circle cx="260" cy="164" r="10" fill="#F8FAFC" opacity="0.9"/>
  <path d="M242 185 Q242 175 260 175 Q278 175 278 185" fill="#F8FAFC" opacity="0.8"/>
  <!-- Client nodes -->
  <!-- Node 1: Top-left -->
  <circle cx="90" cy="88" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="90" cy="88" r="22" fill="none" stroke="#EA580C" stroke-width="2"/>
  <circle cx="90" cy="88" r="8" fill="url(#nodeGlow)" opacity="0.6"/>
  <text x="90" y="83" text-anchor="middle" font-size="9" fill="#EA580C" font-weight="bold">T</text>
  <text x="90" y="95" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">TECH</text>
  <text x="90" y="120" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">TechStart</text>
  <!-- Node 2: Top-center -->
  <circle cx="260" cy="55" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="260" cy="55" r="22" fill="none" stroke="#2563EB" stroke-width="2"/>
  <text x="260" y="50" text-anchor="middle" font-size="9" fill="#2563EB" font-weight="bold">F</text>
  <text x="260" y="62" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">FIN</text>
  <text x="260" y="87" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">FinGroup</text>
  <!-- Node 3: Top-right -->
  <circle cx="430" cy="88" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="430" cy="88" r="22" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="83" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="bold">G</text>
  <text x="430" y="95" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">GROW</text>
  <text x="430" y="120" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">GrowthCo</text>
  <!-- Node 4: Right -->
  <circle cx="460" cy="195" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="460" cy="195" r="22" fill="none" stroke="#9333ea" stroke-width="2"/>
  <text x="460" y="190" text-anchor="middle" font-size="9" fill="#9333ea" font-weight="bold">N</text>
  <text x="460" y="202" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">NOVA</text>
  <text x="460" y="230" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">Nova Design</text>
  <!-- Node 5: Bottom-right -->
  <circle cx="430" cy="278" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="430" cy="278" r="22" fill="none" stroke="#EA580C" stroke-width="2"/>
  <text x="430" y="273" text-anchor="middle" font-size="9" fill="#EA580C" font-weight="bold">R</text>
  <text x="430" y="285" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">RETAIL</text>
  <text x="430" y="256" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">RetailPro</text>
  <!-- Node 6: Bottom-center -->
  <circle cx="260" cy="295" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="260" cy="295" r="22" fill="none" stroke="#0891b2" stroke-width="2"/>
  <text x="260" y="290" text-anchor="middle" font-size="9" fill="#0891b2" font-weight="bold">M</text>
  <text x="260" y="302" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">MED</text>
  <text x="260" y="328" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">MedConnect</text>
  <!-- Node 7: Bottom-left -->
  <circle cx="90" cy="278" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="90" cy="278" r="22" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="273" text-anchor="middle" font-size="9" fill="#d97706" font-weight="bold">E</text>
  <text x="90" y="285" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">EDU</text>
  <text x="90" y="256" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">EduSpark</text>
  <!-- Node 8: Left -->
  <circle cx="60" cy="195" r="24" fill="#1a3060" opacity="0.9"/>
  <circle cx="60" cy="195" r="22" fill="none" stroke="#2563EB" stroke-width="2"/>
  <text x="60" y="190" text-anchor="middle" font-size="9" fill="#2563EB" font-weight="bold">S</text>
  <text x="60" y="202" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.8">SaaS</text>
  <text x="60" y="230" text-anchor="middle" font-size="7" fill="#F8FAFC" opacity="0.5">SaaSBase</text>
  <!-- Label -->
  <rect x="0" y="316" width="520" height="44" fill="#0F172A" opacity="0.95"/>
  <rect x="0" y="314" width="520" height="4" fill="url(#blueG)"/>
  <text x="260" y="343" text-anchor="middle" font-size="15" fill="#F8FAFC" font-weight="bold" letter-spacing="2">YOUR NETWORK</text>
</svg>
