  <text x="87" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8A8880">MAR</text>
  <text x="134" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8A8880">MER</text>
  <text x="181" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8A8880">JEU</text>
  <text x="228" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8A8880">VEN</text>
  <text x="275" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#D4A853" font-weight="600">SAM</text>
  <text x="322" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#D4A853" font-weight="600">DIM</text>

  <!-- Calendar grid lines -->
  <line x1="16" y1="120" x2="346" y2="120" stroke="#EEE8E0" stroke-width="1"/>
  <line x1="16" y1="155" x2="346" y2="155" stroke="#EEE8E0" stroke-width="1"/>
  <line x1="16" y1="190" x2="346" y2="190" stroke="#EEE8E0" stroke-width="1"/>
  <line x1="16" y1="225" x2="346" y2="225" stroke="#EEE8E0" stroke-width="1"/>
  <line x1="16" y1="260" x2="346" y2="260" stroke="#EEE8E0" stroke-width="1"/>
  <!-- Vertical lines -->
  <line x1="63" y1="120" x2="63" y2="330" stroke="#EEE8E0" stroke-width="0.8"/>
  <line x1="110" y1="120" x2="110" y2="330" stroke="#EEE8E0" stroke-width="0.8"/>
  <line x1="157" y1="120" x2="157" y2="330" stroke="#EEE8E0" stroke-width="0.8"/>
  <line x1="204" y1="120" x2="204" y2="330" stroke="#EEE8E0" stroke-width="0.8"/>
  <line x1="251" y1="120" x2="251" y2="330" stroke="#EEE8E0" stroke-width="0.8"/>
  <line x1="298" y1="120" x2="298" y2="330" stroke="#EEE8E0" stroke-width="0.8"/>

  <!-- Day numbers row 1 (Mon-Sun) -->
  <!-- Row 1 day numbers -->
  <text x="40" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">1</text>
  <text x="87" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">2</text>
  <text x="134" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">3</text>
  <text x="181" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">4</text>
  <text x="228" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">5</text>
  <text x="275" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">6</text>
  <text x="322" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">7</text>
