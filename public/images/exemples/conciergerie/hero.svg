<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif">
  <defs>
    <!-- Deep navy background -->
    <linearGradient id="bgNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1E38"/>
      <stop offset="100%" stop-color="#162640"/>
    </linearGradient>
    <!-- Luxury room blur background -->
    <linearGradient id="roomBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3050"/>
      <stop offset="50%" stop-color="#0F2040"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="goldHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C86A"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#B88C38"/>
    </linearGradient>
    <!-- Key gold -->
    <linearGradient id="keyGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D070"/>
      <stop offset="40%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#A87830"/>
    </linearGradient>
    <!-- Hand skin -->
    <linearGradient id="handSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8C0"/>
      <stop offset="100%" stop-color="#D8B898"/>
    </linearGradient>
    <!-- Badge gold dark -->
    <linearGradient id="badgeNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1E38"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <!-- Room glow left -->
    <radialGradient id="roomGlow1" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2A4870" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F1E38" stop-opacity="0"/>
    </radialGradient>
    <!-- Room glow right -->
    <radialGradient id="roomGlow2" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#D4A853" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4A853" stop-opacity="0"/>
    </radialGradient>
    <!-- Lamp glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFD870" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD870" stop-opacity="0"/>
    </radialGradient>
    <!-- Key glow -->
    <radialGradient id="keyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0D070" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F0D070" stop-opacity="0"/>
    </radialGradient>
    <filter id="heroShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBlur3">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Deep navy base background -->
  <rect width="900" height="560" fill="url(#bgNavy)"/>

  <!-- Blurred luxury room background (soft shapes) -->
  <!-- Suggested sofa shape (blurred) -->
  <rect x="0" y="0" width="900" height="560" fill="url(#roomBg)" opacity="0.7"/>
  <rect x="0" y="340" width="900" height="220" fill="#06100A" opacity="0.5"/>

  <!-- Room glow overlays -->
  <rect x="0" y="0" width="900" height="560" fill="url(#roomGlow1)"/>
  <rect x="0" y="0" width="900" height="560" fill="url(#roomGlow2)"/>

  <!-- Blurred room elements (suggested furniture) -->
  <!-- Floor suggestion -->
  <rect x="0" y="420" width="900" height="8" fill="#1A3050" opacity="0.6" filter="url(#softBlur3)"/>

  <!-- Blurred sofa suggestion left -->
  <rect x="30" y="350" width="240" height="90" rx="20" fill="#182840" opacity="0.5" filter="url(#softBlur3)"/>
  <!-- Sofa arm left -->
  <rect x="20" y="340" width="38" height="100" rx="12" fill="#1A2E48" opacity="0.4" filter="url(#softBlur3)"/>

  <!-- Blurred floor lamp -->
  <ellipse cx="750" cy="410" rx="20" ry="8" fill="#0F1E30" opacity="0.5" filter="url(#softBlur3)"/>
  <rect x="744" y="180" width="12" height="230" rx="6" fill="#1A2A40" opacity="0.35" filter="url(#softBlur3)"/>
  <!-- Lamp shade -->
  <ellipse cx="750" cy="180" rx="40" ry="18" fill="#D4A853" opacity="0.15" filter="url(#softBlur3)"/>
  <!-- Lamp warm glow -->
  <ellipse cx="750" cy="200" rx="120" ry="80" fill="url(#lampGlow)" opacity="0.5"/>

  <!-- Blurred painting on wall -->
  <rect x="620" y="80" width="160" height="110" rx="6" fill="#1A2A42" opacity="0.5" filter="url(#softBlur3)"/>
  <rect x="626" y="86" width="148" height="98" rx="4" fill="#D4A853" opacity="0.06" filter="url(#softBlur3)"/>

  <!-- Window with subtle light (right) -->
  <rect x="820" y="60" width="80" height="260" rx="3" fill="#1A3050" opacity="0.4" filter="url(#softBlur3)"/>
  <rect x="824" y="64" width="72" height="252" rx="2" fill="#C8E0F8" opacity="0.08" filter="url(#softBlur3)"/>

  <!-- Decorative gold bokeh circles -->
  <circle cx="80" cy="80" r="40" fill="#D4A853" opacity="0.04"/>
  <circle cx="820" cy="100" r="60" fill="#D4A853" opacity="0.04"/>
  <circle cx="450" cy="500" r="80" fill="#D4A853" opacity="0.03"/>
  <circle cx="160" cy="420" r="30" fill="#D4A853" opacity="0.05"/>
  <circle cx="700" cy="460" r="25" fill="#D4A853" opacity="0.05"/>

  <!-- Key glow aura -->
  <ellipse cx="460" cy="290" rx="120" ry="80" fill="url(#keyGlow)"/>

  <!-- Hand holding key (center stage) -->
  <!-- Hand/wrist -->
  <ellipse cx="460" cy="420" rx="55" ry="28" fill="url(#handSkin)" opacity="0.95"/>
  <!-- Palm -->
  <rect x="415" y="360" width="90" height="80" rx="18" fill="url(#handSkin)"/>
  <!-- Fingers (simplified) -->
  <!-- Index finger -->
  <rect x="442" y="295" width="20" height="80" rx="10" fill="url(#handSkin)"/>
  <!-- Middle finger -->
  <rect x="465" y="285" width="20" height="88" rx="10" fill="url(#handSkin)"/>
  <!-- Ring finger -->
  <rect x="488" y="295" width="18" height="80" rx="9" fill="url(#handSkin)"/>
  <!-- Thumb (side) -->
  <ellipse cx="418" cy="370" rx="14" ry="22" fill="url(#handSkin)" transform="rotate(-25, 418, 370)"/>
  <!-- Little finger (hint) -->
  <rect x="509" y="308" width="15" height="68" rx="8" fill="url(#handSkin)" opacity="0.9"/>
  <!-- Hand shadow -->
  <ellipse cx="460" cy="440" rx="52" ry="14" fill="#000000" opacity="0.25" filter="url(#softBlur3)"/>

  <!-- KEY -->
  <!-- Key ring -->
  <circle cx="462" cy="240" r="32" fill="none" stroke="url(#keyGold)" stroke-width="9"/>
  <circle cx="462" cy="240" r="20" fill="none" stroke="url(#keyGold)" stroke-width="5"/>
  <!-- Key bow detail lines -->
  <circle cx="462" cy="240" r="32" fill="none" stroke="#F0D070" stroke-width="2" opacity="0.4"/>
  <!-- Key blade (shaft) -->
  <rect x="456" y="268" width="14" height="80" rx="4" fill="url(#keyGold)"/>
  <!-- Key teeth -->
  <rect x="470" y="298" width="14" height="8" rx="2" fill="url(#keyGold)"/>
  <rect x="470" y="314" width="10" height="7" rx="2" fill="url(#keyGold)"/>
  <rect x="470" y="329" width="14" height="7" rx="2" fill="url(#keyGold)"/>
  <!-- Key shine highlight -->
  <line x1="458" y1="270" x2="458" y2="345" stroke="#F8E890" stroke-width="2" opacity="0.5"/>
  <ellipse cx="450" cy="230" rx="10" ry="10" fill="none" stroke="#F8E890" stroke-width="2" opacity="0.3"/>

  <!-- Key glow filter overlay -->
  <rect x="420" y="200" width="86" height="200" fill="none" filter="url(#goldGlow)"/>

  <!-- 5 Stars rating -->
  <!-- Stars row -->
  <text x="180" y="135" font-family="Arial, sans-serif" font-size="28" fill="#D4A853" opacity="0.95">★★★★★</text>
  <!-- 5.0 label -->
  <rect x="182" y="148" width="58" height="20" rx="5" fill="#D4A853" opacity="0.15"/>
  <text x="211" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#D4A853">5,0 / 5</text>

  <!-- Small calendar icon -->
  <rect x="680" y="110" width="52" height="48" rx="6" fill="#0F1E38" stroke="#D4A853" stroke-width="1.5"/>
  <rect x="680" y="110" width="52" height="14" rx="5" fill="#D4A853"/>
  <!-- Calendar grid dots -->
  <circle cx="694" cy="136" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="706" cy="136" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="718" cy="136" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="694" cy="148" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="706" cy="148" r="2.5" fill="#D4A853"/>
  <circle cx="718" cy="148" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <!-- Calendar month text -->
  <text x="706" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#0F1E38">JUIN</text>

  <!-- Map pin icon -->
  <circle cx="760" cy="200" r="14" fill="#D4A853" opacity="0.9"/>
  <circle cx="760" cy="197" r="7" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="753,205 767,205 760,218" fill="#D4A853" opacity="0.9"/>

  <!-- Conciergerie Premium badge -->
  <rect x="268" y="460" width="360" height="72" rx="12" fill="url(#badgeNavy)" stroke="#D4A853" stroke-width="2" filter="url(#heroShadow)"/>
  <rect x="272" y="464" width="352" height="64" rx="10" fill="none" stroke="#D4A853" stroke-width="0.5" opacity="0.4"/>
  <!-- Gold accent line -->
  <rect x="300" y="476" width="56" height="2" rx="1" fill="url(#goldHero)"/>
  <text x="448" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#D4A853" letter-spacing="3">CONCIERGERIE</text>
  <text x="448" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#F0D890" letter-spacing="5">PREMIUM</text>
  <!-- Stars in badge -->
  <text x="540" y="476" font-family="Arial, sans-serif" font-size="10" fill="#D4A853" opacity="0.6">★★★</text>

  <!-- Decorative thin gold lines (luxury feel) -->
  <line x1="0" y1="552" x2="900" y2="552" stroke="#D4A853" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="558" x2="900" y2="558" stroke="#D4A853" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="8" x2="900" y2="8" stroke="#D4A853" stroke-width="1" opacity="0.25"/>
</svg>
