<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Pixeloria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint:  #26d8be;
      --cyan:  #2ca7ff;
      --green: #35e38f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #050f1a;
      color: #f0faf8;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    :focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 3px;
      border-radius: 4px;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 700;
      line-height: 1;
      margin: 0 0 1rem;
      background: linear-gradient(135deg, var(--green), var(--mint), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h1 {
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      font-weight: 600;
      margin: 0 0 0.75rem;
    }
    p {
      color: rgba(240, 250, 248, 0.6);
      margin: 0 0 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.5rem;
      background: linear-gradient(135deg, var(--green), var(--mint), var(--cyan));
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(38, 216, 190, 0.35);
    }
    .glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--mint), var(--cyan));
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="container">
    <p class="code" aria-label="Erreur 404">404</p>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée.<br>Retournez à l'accueil pour continuer.</p>
    <a href="/" class="btn">← Retour à l'accueil</a>
  </div>
</body>
</html>
