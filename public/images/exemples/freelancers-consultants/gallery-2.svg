<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#e8f0fc"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4fe"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1a50d0"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB14"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="520" height="360" fill="url(#bgG)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="520" height="5" fill="url(#blueG)"/>
  <!-- Header -->
  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Client Success Stories</text>
  <text x="260" y="52" text-anchor="middle" font-size="10" fill="#0F172A" opacity="0.5">Trusted by 40+ businesses worldwide</text>
  <!-- Testimonial card 1 -->
  <rect x="14" y="66" width="152" height="210" rx="12" fill="url(#cardG)" filter="url(#cardShadow)"/>
  <rect x="14" y="66" width="152" height="4" rx="2" fill="#2563EB"/>
  <!-- Avatar -->
  <circle cx="90" cy="104" r="26" fill="#2563EB" opacity="0.15"/>
  <circle cx="90" cy="104" r="22" fill="#2563EB"/>
  <text x="90" y="110" text-anchor="middle" font-size="18" fill="#F8FAFC" font-weight="bold">S</text>
  <!-- Stars -->
  <text x="90" y="137" text-anchor="middle" font-size="12" fill="#EA580C">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  <!-- Name & company -->
  <text x="90" y="153" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">Sarah K.</text>
  <text x="90" y="166" text-anchor="middle" font-size="8" fill="#2563EB">TechStart Inc.</text>
  <!-- Quote lines -->
  <rect x="24" y="174" width="132" height="5" rx="2" fill="#0F172A" opacity="0.1"/>
  <rect x="24" y="184" width="120" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="24" y="194" width="132" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="24" y="204" width="100" height="5" rx="2" fill="#0F172A" opacity="0.06"/>
  <!-- Quote mark -->
  <text x="24" y="175" font-size="24" fill="#2563EB" opacity="0.2">"</text>
  <text x="22" y="256" font-size="8" fill="#0F172A" opacity="0.6" font-style="italic">"Transformed our operations"</text>
  <rect x="24" y="262" width="132" height="8" rx="4" fill="#2563EB" opacity="0.1"/>
  <text x="90" y="269" text-anchor="middle" font-size="7" fill="#2563EB">Strategy Consulting</text>
  <!-- Testimonial card 2 -->
  <rect x="184" y="66" width="152" height="210" rx="12" fill="url(#cardG)" filter="url(#cardShadow)"/>
  <rect x="184" y="66" width="152" height="4" rx="2" fill="#EA580C"/>
  <circle cx="260" cy="104" r="26" fill="#EA580C" opacity="0.12"/>
  <circle cx="260" cy="104" r="22" fill="#EA580C"/>
  <text x="260" y="110" text-anchor="middle" font-size="18" fill="#F8FAFC" font-weight="bold">M</text>
  <text x="260" y="137" text-anchor="middle" font-size="12" fill="#EA580C">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  <text x="260" y="153" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">Marcus L.</text>
  <text x="260" y="166" text-anchor="middle" font-size="8" fill="#EA580C">Global Ventures</text>
  <rect x="194" y="174" width="132" height="5" rx="2" fill="#0F172A" opacity="0.1"/>
  <rect x="194" y="184" width="118" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="194" y="194" width="132" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="194" y="204" width="108" height="5" rx="2" fill="#0F172A" opacity="0.06"/>
  <text x="194" y="175" font-size="24" fill="#EA580C" opacity="0.2">"</text>
  <text x="192" y="256" font-size="8" fill="#0F172A" opacity="0.6" font-style="italic">"Exceeded every expectation"</text>
  <rect x="194" y="262" width="132" height="8" rx="4" fill="#EA580C" opacity="0.1"/>
  <text x="260" y="269" text-anchor="middle" font-size="7" fill="#EA580C">Market Research</text>
  <!-- Testimonial card 3 -->
  <rect x="354" y="66" width="152" height="210" rx="12" fill="url(#cardG)" filter="url(#cardShadow)"/>
  <rect x="354" y="66" width="152" height="4" rx="2" fill="#0F172A"/>
  <circle cx="430" cy="104" r="26" fill="#0F172A" opacity="0.08"/>
  <circle cx="430" cy="104" r="22" fill="#0F172A"/>
  <text x="430" y="110" text-anchor="middle" font-size="18" fill="#F8FAFC" font-weight="bold">A</text>
  <text x="430" y="137" text-anchor="middle" font-size="12" fill="#EA580C">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  <text x="430" y="153" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">Amira T.</text>
  <text x="430" y="166" text-anchor="middle" font-size="8" fill="#0F172A" opacity="0.6">Nova Design Co.</text>
  <rect x="364" y="174" width="132" height="5" rx="2" fill="#0F172A" opacity="0.1"/>
  <rect x="364" y="184" width="124" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="364" y="194" width="132" height="5" rx="2" fill="#0F172A" opacity="0.08"/>
  <rect x="364" y="204" width="112" height="5" rx="2" fill="#0F172A" opacity="0.06"/>
  <text x="364" y="175" font-size="24" fill="#0F172A" opacity="0.15">"</text>
  <text x="362" y="256" font-size="8" fill="#0F172A" opacity="0.6" font-style="italic">"Best investment we made"</text>
  <rect x="364" y="262" width="132" height="8" rx="4" fill="#0F172A" opacity="0.08"/>
  <text x="430" y="269" text-anchor="middle" font-size="7" fill="#0F172A" opacity="0.7">Brand Strategy</text>
  <!-- Overall stats bar -->
  <rect x="14" y="290" width="492" height="40" rx="8" fill="#2563EB" opacity="0.07"/>
  <rect x="14" y="290" width="492" height="40" rx="8" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  <text x="90" y="308" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="bold">40+</text>
  <text x="90" y="322" text-anchor="middle" font-size="8" fill="#0F172A" opacity="0.6">Clients Served</text>
  <line x1="170" y1="296" x2="170" y2="324" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  <text x="248" y="308" text-anchor="middle" font-size="11" fill="#EA580C" font-weight="bold">98%</text>
  <text x="248" y="322" text-anchor="middle" font-size="8" fill="#0F172A" opacity="0.6">Satisfaction Rate</text>
  <line x1="340" y1="296" x2="340" y2="324" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  <text x="420" y="308" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="bold">4.9 ★</text>
  <text x="420" y="322" text-anchor="middle" font-size="8" fill="#0F172A" opacity="0.6">Average Rating</text>
  <!-- Label -->
  <rect x="0" y="336" width="520" height="24" fill="#0F172A"/>
  <rect x="0" y="334" width="520" height="4" fill="url(#blueG)"/>
  <text x="260" y="353" text-anchor="middle" font-size="13" fill="#F8FAFC" font-weight="bold" letter-spacing="2">CLIENT SUCCESS</text>
</svg>
