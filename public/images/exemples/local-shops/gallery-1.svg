  <rect x="198" y="34" width="26" height="28" rx="4" fill="#f0d850" stroke="#d0b030" stroke-width="1.5"/>
  <rect x="230" y="36" width="24" height="26" rx="4" fill="#50b888" stroke="#309060" stroke-width="1.5"/>
  <rect x="260" y="34" width="28" height="28" rx="4" fill="#e88050" stroke="#c05030" stroke-width="1.5"/>
  <rect x="294" y="36" width="24" height="26" rx="4" fill="#7090d0" stroke="#5070b0" stroke-width="1.5"/>
  <rect x="198" y="96" width="130" height="26" rx="3" fill="#e8d0a0" opacity="0.8"/>
  <rect x="204" y="99" width="52" height="20" rx="2" fill="#c8a860"/>
  <rect x="262" y="99" width="52" height="20" rx="2" fill="#b09050"/>
  <!-- Candles row -->
  <rect x="198" y="153" width="12" height="30" rx="2" fill="#f5e070"/>
  <rect x="215" y="150" width="12" height="33" rx="2" fill="#f0c850"/>
  <rect x="232" y="155" width="12" height="28" rx="2" fill="#e8d060"/>
  <circle cx="204" cy="152" r="3" fill="#f0a030" opacity="0.9"/>
  <circle cx="221" cy="149" r="3" fill="#f0a030" opacity="0.9"/>
  <circle cx="238" cy="154" r="3" fill="#f0a030" opacity="0.9"/>
  <rect x="252" y="152" width="70" height="30" rx="4" fill="#d0b880"/>
  <!-- Right shelf -->
  <rect x="360" y="50" width="14" height="250" fill="url(#shelfG)"/>
  <rect x="490" y="50" width="14" height="250" fill="url(#shelfG)"/>
  <rect x="358" y="80" width="148" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="358" y="140" width="148" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="358" y="200" width="148" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <rect x="358" y="260" width="148" height="14" rx="2" fill="url(#shelfG)" filter="url(#shadow)"/>
  <!-- Right shelf items -->
  <rect x="368" y="56" width="20" height="26" rx="3" fill="#70a870"/>
  <rect x="392" y="56" width="20" height="26" rx="3" fill="#d07850"/>
  <rect x="416" y="56" width="20" height="26" rx="3" fill="#5080b0"/>
  <rect x="440" y="56" width="20" height="26" rx="3" fill="#b05070"/>
  <rect x="464" y="56" width="20" height="26" rx="3" fill="#a0a030"/>
  <rect x="368" y="116" width="110" height="26" rx="4" fill="#d8c8a0"/>
  <rect x="374" y="120" width="48" height="18" rx="2" fill="#c0a870"/>
  <rect x="426" y="120" width="48" height="18" rx="2" fill="#b09860"/>
  <rect x="368" y="176" width="50" height="26" rx="4" fill="#a0c890"/>
  <rect x="424" y="178" width="48" height="22" rx="4" fill="#c0d8a0"/>
  <!-- Warm lighting spots on ceiling -->
  <circle cx="130" cy="10" r="8" fill="#f5d850" opacity="0.8"/>
  <circle cx="330" cy="10" r="8" fill="#f5d850" opacity="0.8"/>
  <!-- Label -->
  <rect x="0" y="316" width="520" height="44" fill="#B45309"/>
  <rect x="0" y="314" width="520" height="4" fill="#0F766E"/>
  <text x="260" y="343" text-anchor="middle" font-size="14" fill="#FFFBEB" font-weight="bold" letter-spacing="2">IN-STORE EXPERIENCE</text>
</svg>
