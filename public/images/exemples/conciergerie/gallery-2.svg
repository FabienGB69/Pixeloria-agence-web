  <text x="134" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">17</text>
  <text x="181" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">18</text>
  <text x="228" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4A4A50">19</text>
  <text x="275" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">20</text>
  <text x="322" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A030" font-weight="600">21</text>
