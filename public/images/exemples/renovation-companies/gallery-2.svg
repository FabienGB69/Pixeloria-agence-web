<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2840"/>
      <stop offset="40%" stop-color="#f0902a"/>
      <stop offset="70%" stop-color="#f8c060"/>
      <stop offset="100%" stop-color="#fce090"/>
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#3a3030"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#ea6010"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000050"/>
    </filter>
  </defs>
  <!-- Sky background (sunrise) -->
  <rect width="520" height="360" fill="url(#skyG)"/>
  <!-- Sunrise glow -->
  <ellipse cx="260" cy="290" rx="200" ry="80" fill="#f8c060" opacity="0.25"/>
  <ellipse cx="260" cy="310" rx="140" ry="50" fill="#F97316" opacity="0.2"/>
  <!-- Ground / site base -->
  <rect x="0" y="280" width="520" height="80" fill="url(#groundG)"/>
  <rect x="0" y="276" width="520" height="8" fill="#5a5050"/>
  <!-- Dirt/gravel texture on ground -->
  <g fill="#6a5a50" opacity="0.4">
    <circle cx="30" cy="290" r="4"/>
    <circle cx="70" cy="294" r="3"/>
    <circle cx="120" cy="288" r="4"/>
    <circle cx="180" cy="292" r="3"/>
    <circle cx="240" cy="287" r="4"/>
    <circle cx="310" cy="293" r="3"/>
    <circle cx="370" cy="289" r="4"/>
    <circle cx="430" cy="291" r="3"/>
    <circle cx="490" cy="287" r="4"/>
  </g>
  <!-- Scaffolding structure -->
  <!-- Main vertical poles -->
  <rect x="60" y="80" width="8" height="220" fill="#78716C"/>
  <rect x="150" y="60" width="8" height="240" fill="#78716C"/>
  <rect x="240" y="70" width="8" height="230" fill="#78716C"/>
  <rect x="330" y="55" width="8" height="245" fill="#78716C"/>
  <rect x="420" y="75" width="8" height="225" fill="#78716C"/>
  <!-- Cross-braces -->
  <line x1="60" y1="150" x2="158" y2="200" stroke="#78716C" stroke-width="4"/>
  <line x1="150" y1="150" x2="68" y2="200" stroke="#78716C" stroke-width="4"/>
  <line x1="150" y1="130" x2="248" y2="180" stroke="#78716C" stroke-width="4"/>
  <line x1="240" y1="130" x2="158" y2="180" stroke="#78716C" stroke-width="4"/>
  <line x1="240" y1="110" x2="338" y2="160" stroke="#78716C" stroke-width="4"/>
  <line x1="330" y1="110" x2="248" y2="160" stroke="#78716C" stroke-width="4"/>
  <line x1="330" y1="120" x2="428" y2="170" stroke="#78716C" stroke-width="4"/>
  <line x1="420" y1="120" x2="338" y2="170" stroke="#78716C" stroke-width="4"/>
  <!-- Horizontal platforms -->
  <rect x="55" y="140" width="100" height="8" rx="2" fill="#9a9088"/>
  <rect x="145" y="120" width="100" height="8" rx="2" fill="#9a9088"/>
  <rect x="235" y="100" width="100" height="8" rx="2" fill="#9a9088"/>
  <rect x="325" y="90" width="100" height="8" rx="2" fill="#9a9088"/>
  <rect x="55" y="210" width="100" height="8" rx="2" fill="#9a9088"/>
  <rect x="145" y="200" width="100" height="8" rx="2" fill="#9a9088"/>
  <rect x="235" y="190" width="100" height="8" rx="2" fill="#9a9088"/>
  <rect x="325" y="185" width="100" height="8" rx="2" fill="#9a9088"/>
  <!-- House structure behind scaffolding -->
  <rect x="40" y="100" width="440" height="200" fill="#78716C" opacity="0.3"/>
  <rect x="40" y="100" width="440" height="8" fill="#9a9088" opacity="0.5"/>
  <!-- Windows being installed -->
  <rect x="80" y="120" width="60" height="55" fill="#5080a0" opacity="0.5"/>
  <rect x="80" y="120" width="60" height="55" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="200" y="108" width="60" height="55" fill="#5080a0" opacity="0.5"/>
  <rect x="200" y="108" width="60" height="55" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="320" y="100" width="60" height="55" fill="#5080a0" opacity="0.5"/>
  <rect x="320" y="100" width="60" height="55" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Worker silhouettes on scaffold -->
  <!-- Worker 1 (on platform ~level 2) -->
  <ellipse cx="104" cy="130" rx="9" ry="10" fill="#1a2840"/>
  <rect x="96" y="140" width="16" height="22" rx="4" fill="#F97316" opacity="0.8"/>
  <!-- Hard hat -->
  <ellipse cx="104" cy="122" rx="10" ry="6" fill="#F97316"/>
  <rect x="96" y="128" width="16" height="4" fill="#F97316" opacity="0.7"/>
  <!-- Worker arm holding tool -->
  <line x1="112" y1="145" x2="126" y2="135" stroke="#1a2840" stroke-width="4"/>
  <rect x="124" y="128" width="6" height="18" rx="1" fill="#78716C"/>
  <!-- Worker 2 -->
  <ellipse cx="270" cy="115" rx="9" ry="10" fill="#1a2840"/>
  <rect x="262" y="125" width="16" height="22" rx="4" fill="#334155" opacity="0.9"/>
  <ellipse cx="270" cy="107" rx="10" ry="6" fill="#F97316"/>
  <rect x="262" y="113" width="16" height="4" fill="#F97316" opacity="0.7"/>
  <line x1="278" y1="132" x2="290" y2="120" stroke="#1a2840" stroke-width="4"/>
  <!-- Worker 3 -->
  <ellipse cx="380" cy="107" rx="9" ry="10" fill="#1a2840"/>
  <rect x="372" y="117" width="16" height="22" rx="4" fill="#F97316" opacity="0.8"/>
  <ellipse cx="380" cy="99" rx="10" ry="6" fill="#F97316"/>
  <rect x="372" y="105" width="16" height="4" fill="#F97316" opacity="0.7"/>
  <!-- Worker 3 with blueprint roll -->
  <rect x="388" y="115" width="16" height="8" rx="3" fill="#FAFAF9" opacity="0.7"/>
  <!-- Equipment on ground -->
  <!-- Cement mixer -->
  <ellipse cx="30" cy="278" rx="22" ry="18" fill="#6a6460"/>
  <rect x="10" y="260" width="14" height="20" rx="2" fill="#5a5450"/>
  <ellipse cx="30" cy="262" rx="16" ry="12" fill="#5a5450"/>
  <!-- Supply pallets -->
  <rect x="80" y="260" width="60" height="20" rx="2" fill="#8B6520" opacity="0.8"/>
  <rect x="80" y="258" width="60" height="6" rx="1" fill="#a07838" opacity="0.6"/>
  <rect x="168" y="264" width="50" height="16" rx="2" fill="#6a6460" opacity="0.7"/>
  <!-- Ladder -->
  <line x1="440" y1="80" x2="445" y2="285" stroke="#9a9088" stroke-width="4"/>
  <line x1="460" y1="78" x2="465" y2="283" stroke="#9a9088" stroke-width="4"/>
  <line x1="441" y1="110" x2="464" y2="109" stroke="#9a9088" stroke-width="3"/>
  <line x1="442" y1="140" x2="465" y2="139" stroke="#9a9088" stroke-width="3"/>
  <line x1="443" y1="170" x2="466" y2="169" stroke="#9a9088" stroke-width="3"/>
  <line x1="443" y1="200" x2="466" y2="199" stroke="#9a9088" stroke-width="3"/>
  <line x1="444" y1="230" x2="467" y2="229" stroke="#9a9088" stroke-width="3"/>
  <line x1="444" y1="258" x2="467" y2="257" stroke="#9a9088" stroke-width="3"/>
  <!-- Sunbeams on horizon -->
  <line x1="260" y1="310" x2="0" y2="200" stroke="#F97316" stroke-width="1" opacity="0.15"/>
  <line x1="260" y1="310" x2="100" y2="160" stroke="#F97316" stroke-width="1" opacity="0.15"/>
  <line x1="260" y1="310" x2="520" y2="200" stroke="#F97316" stroke-width="1" opacity="0.15"/>
  <line x1="260" y1="310" x2="400" y2="155" stroke="#F97316" stroke-width="1" opacity="0.15"/>
  <!-- Label -->
  <rect x="0" y="330" width="520" height="30" fill="#334155"/>
  <rect x="0" y="328" width="520" height="4" fill="url(#orangeG)"/>
  <text x="260" y="350" text-anchor="middle" font-size="14" fill="#FAFAF9" font-weight="bold" letter-spacing="2">OUR TEAM</text>
</svg>
