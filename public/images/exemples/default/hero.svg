<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1837;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#131d45;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1060;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1230;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="heroSectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#00d1ff;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d1ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2045;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1c1535;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2650;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e1840;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7a5cff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d1ff;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#00d1ff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2060;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1d1848;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00a550;stop-opacity:1"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="screenGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bgGrad)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="400" rx="200" ry="150" fill="url(#glowGrad)" filter="url(#softBlur)" opacity="0.7"/>
  <ellipse cx="700" cy="190" rx="180" ry="130" fill="url(#cyanGlow)" filter="url(#softBlur)" opacity="0.6"/>
  <ellipse cx="460" cy="300" rx="220" ry="160" fill="url(#glowGrad)" filter="url(#softBlur)" opacity="0.3"/>

  <!-- Floating geometric decorations -->
  <circle cx="826" cy="76" r="62" fill="none" stroke="#7a5cff" stroke-width="1.5" opacity="0.18"/>
  <circle cx="826" cy="76" r="40" fill="none" stroke="#00d1ff" stroke-width="1" opacity="0.18"/>
  <circle cx="76" cy="480" r="50" fill="none" stroke="#7a5cff" stroke-width="1.5" opacity="0.18"/>
  <circle cx="856" cy="420" r="32" fill="none" stroke="#00d1ff" stroke-width="1" opacity="0.22"/>
  <circle cx="56" cy="100" r="4" fill="#7a5cff" opacity="0.5"/>
  <circle cx="848" cy="320" r="5" fill="#00d1ff" opacity="0.5"/>
  <circle cx="130" cy="316" r="3" fill="#00d1ff" opacity="0.4"/>
  <circle cx="762" cy="484" r="4" fill="#7a5cff" opacity="0.4"/>
  <circle cx="46" cy="224" r="6" fill="#7a5cff" opacity="0.3"/>
  <circle cx="876" cy="168" r="3" fill="#00d1ff" opacity="0.6"/>
  <polygon points="98,148 114,176 82,176" fill="none" stroke="#7a5cff" stroke-width="1.5" opacity="0.3"/>
  <polygon points="802,382 814,402 790,402" fill="none" stroke="#00d1ff" stroke-width="1.5" opacity="0.3"/>
  <rect x="830" y="240" width="12" height="12" rx="2" fill="none" stroke="#7a5cff" stroke-width="1.5" opacity="0.3" transform="rotate(20 836 246)"/>
  <rect x="54" y="380" width="10" height="10" rx="2" fill="none" stroke="#00d1ff" stroke-width="1.5" opacity="0.3" transform="rotate(-15 59 385)"/>

  <!-- Desk surface -->
  <rect x="80" y="412" width="740" height="18" rx="4" fill="url(#deskGrad)" opacity="0.9"/>
  <rect x="80" y="428" width="740" height="55" rx="0" fill="#110d2c" opacity="0.8"/>

  <!-- Laptop base / keyboard -->
  <rect x="212" y="394" width="476" height="20" rx="6" fill="url(#laptopGrad)"/>
  <rect x="216" y="396" width="468" height="16" rx="4" fill="#221e46" opacity="0.6"/>
  <rect x="280" y="398" width="240" height="9" rx="3" fill="#1a1540" opacity="0.7"/>
  <rect x="385" y="406" width="130" height="7" rx="4" fill="#1d1745" opacity="0.8"/>

  <!-- Laptop hinge -->
  <rect x="220" y="389" width="460" height="6" rx="0" fill="#0a0820" opacity="0.6"/>

  <!-- Laptop screen outer frame -->
  <rect x="196" y="118" width="508" height="276" rx="10" fill="url(#laptopGrad)"/>
  <!-- Screen bezel -->
  <rect x="204" y="126" width="492" height="260" rx="7" fill="#08091a"/>
  <!-- Screen area -->
  <rect x="210" y="132" width="480" height="250" rx="4" fill="url(#screenGrad)" filter="url(#screenGlow)"/>

  <!-- WEBSITE MOCKUP on screen -->
  <!-- Navbar -->
  <rect x="210" y="132" width="480" height="28" rx="4" fill="#0a0d22"/>
  <rect x="210" y="152" width="480" height="8" rx="0" fill="#0a0d22"/>
  <circle cx="228" cy="146" r="5" fill="#7a5cff"/>
  <rect x="237" y="142" width="38" height="6" rx="2" fill="#d0c8ff" opacity="0.85"/>
  <rect x="348" y="142" width="26" height="5" rx="2" fill="#7070a0" opacity="0.7"/>
  <rect x="386" y="142" width="26" height="5" rx="2" fill="#7070a0" opacity="0.7"/>
  <rect x="424" y="142" width="26" height="5" rx="2" fill="#7070a0" opacity="0.7"/>
  <rect x="636" y="138" width="44" height="14" rx="7" fill="#7a5cff"/>
  <rect x="640" y="142" width="36" height="6" rx="3" fill="white" opacity="0.9"/>

  <!-- Hero gradient block on screen -->
  <rect x="210" y="160" width="480" height="86" fill="url(#heroSectionGrad)" opacity="0.88"/>
  <rect x="262" y="174" width="155" height="10" rx="3" fill="white" opacity="0.95"/>
  <rect x="262" y="190" width="196" height="7" rx="2" fill="white" opacity="0.7"/>
  <rect x="262" y="203" width="176" height="7" rx="2" fill="white" opacity="0.5"/>
  <rect x="262" y="218" width="58" height="16" rx="8" fill="white"/>
  <rect x="328" y="218" width="58" height="16" rx="8" fill="none" stroke="white" stroke-width="1.5" opacity="0.7"/>

  <!-- Cards section label -->
  <rect x="210" y="246" width="480" height="8" rx="0" fill="#0c1028"/>
  <rect x="312" y="254" width="116" height="8" rx="2" fill="#7a5cff" opacity="0.7"/>

  <!-- Three content cards on screen -->
  <rect x="218" y="267" width="140" height="62" rx="4" fill="url(#cardGrad)"/>
  <rect x="370" y="267" width="140" height="62" rx="4" fill="url(#cardGrad)"/>
  <rect x="522" y="267" width="140" height="62" rx="4" fill="url(#cardGrad)"/>
  <circle cx="238" cy="281" r="7" fill="#7a5cff" opacity="0.85"/>
  <circle cx="390" cy="281" r="7" fill="#00d1ff" opacity="0.85"/>
  <circle cx="542" cy="281" r="7" fill="#7a5cff" opacity="0.65"/>
  <rect x="252" y="277" width="78" height="5" rx="2" fill="#c0b8ff" opacity="0.85"/>
  <rect x="219" y="294" width="118" height="4" rx="2" fill="#707090" opacity="0.7"/>
  <rect x="219" y="304" width="98" height="4" rx="2" fill="#707090" opacity="0.5"/>
  <rect x="404" y="277" width="78" height="5" rx="2" fill="#80eeff" opacity="0.85"/>
  <rect x="371" y="294" width="118" height="4" rx="2" fill="#707090" opacity="0.7"/>
  <rect x="371" y="304" width="98" height="4" rx="2" fill="#707090" opacity="0.5"/>
  <rect x="556" y="277" width="78" height="5" rx="2" fill="#c0b8ff" opacity="0.85"/>
  <rect x="523" y="294" width="118" height="4" rx="2" fill="#707090" opacity="0.7"/>
  <rect x="523" y="304" width="98" height="4" rx="2" fill="#707090" opacity="0.5"/>

  <!-- Screen footer zone -->
  <rect x="210" y="329" width="480" height="53" rx="0" fill="#080a1c"/>
  <rect x="320" y="346" width="100" height="5" rx="2" fill="#3a3a60" opacity="0.5"/>
  <rect x="440" y="346" width="60" height="5" rx="2" fill="#3a3a60" opacity="0.4"/>
  <rect x="280" y="360" width="30" height="4" rx="2" fill="#3a3a60" opacity="0.35"/>
  <rect x="320" y="360" width="30" height="4" rx="2" fill="#3a3a60" opacity="0.35"/>
  <rect x="360" y="360" width="30" height="4" rx="2" fill="#3a3a60" opacity="0.35"/>

  <!-- Laptop camera -->
  <circle cx="450" cy="129" r="3" fill="#1a1840"/>
  <circle cx="450" cy="129" r="1.5" fill="#0a0820"/>
  <!-- Screen top shine -->
  <rect x="210" y="132" width="480" height="40" rx="4" fill="white" opacity="0.025"/>

  <!-- Coffee cup (right of desk) -->
  <rect x="658" y="370" width="44" height="38" rx="4" fill="#2a2050"/>
  <rect x="658" y="370" width="44" height="10" rx="3" fill="#3a3060"/>
  <path d="M702,380 Q716,380 716,390 Q716,400 702,400" fill="none" stroke="#2a2050" stroke-width="4" stroke-linecap="round"/>
  <rect x="662" y="373" width="36" height="6" rx="2" fill="#120800" opacity="0.6"/>
  <path d="M672,366 Q674,358 672,352" fill="none" stroke="#8080b0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M681,364 Q683,356 681,350" fill="none" stroke="#8080b0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M690,366 Q692,358 690,352" fill="none" stroke="#8080b0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Notebook (left of desk) -->
  <rect x="155" y="366" width="62" height="46" rx="3" fill="#1e2a60" transform="rotate(-5 186 389)"/>
  <rect x="159" y="370" width="54" height="38" rx="2" fill="white" opacity="0.04" transform="rotate(-5 186 389)"/>
  <line x1="162" y1="378" x2="212" y2="375" stroke="#3a4070" stroke-width="1.2" opacity="0.55"/>
  <line x1="162" y1="385" x2="212" y2="382" stroke="#3a4070" stroke-width="1.2" opacity="0.55"/>
  <line x1="162" y1="392" x2="212" y2="389" stroke="#3a4070" stroke-width="1.2" opacity="0.55"/>
  <line x1="162" y1="399" x2="212" y2="396" stroke="#3a4070" stroke-width="1.2" opacity="0.55"/>
  <!-- Pen -->
  <rect x="216" y="372" width="5" height="36" rx="2" fill="#7a5cff" transform="rotate(-5 218 390)"/>
  <polygon points="216,408 221,408 218.5,416" fill="#c0c0d0" transform="rotate(-5 218 412)"/>

  <!-- Plant (far left) -->
  <rect x="88" y="388" width="40" height="26" rx="3" fill="#2a1a40"/>
  <rect x="84" y="385" width="48" height="8" rx="4" fill="#3a2a50"/>
  <rect x="90" y="390" width="36" height="6" rx="2" fill="#120810" opacity="0.6"/>
  <ellipse cx="109" cy="368" rx="14" ry="22" fill="url(#plantGrad)" opacity="0.9" transform="rotate(-15 109 368)"/>
  <ellipse cx="118" cy="360" rx="12" ry="20" fill="url(#plantGrad)" opacity="0.85" transform="rotate(10 118 360)"/>
  <ellipse cx="100" cy="365" rx="10" ry="18" fill="url(#plantGrad)" opacity="0.8" transform="rotate(-25 100 365)"/>
  <line x1="109" y1="386" x2="109" y2="376" stroke="#00a550" stroke-width="2"/>

  <!-- Badge "Site Web Professionnel" -->
  <rect x="316" y="26" width="268" height="40" rx="20" fill="url(#badgeGrad)" opacity="0.97"/>
  <rect x="318" y="28" width="264" height="36" rx="18" fill="white" opacity="0.06"/>
  <text x="450" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.8">&#x2726; Site Web Professionnel &#x2726;</text>

  <!-- Decorative connecting lines -->
  <line x1="694" y1="118" x2="726" y2="78" stroke="#00d1ff" stroke-width="1" opacity="0.2"/>
  <circle cx="726" cy="78" r="2.5" fill="#00d1ff" opacity="0.45"/>
  <circle cx="762" cy="58" r="3.5" fill="#00d1ff" opacity="0.3"/>
  <line x1="726" y1="78" x2="762" y2="58" stroke="#00d1ff" stroke-width="1" opacity="0.15"/>
  <line x1="210" y1="198" x2="160" y2="178" stroke="#7a5cff" stroke-width="1" opacity="0.2"/>
  <circle cx="160" cy="178" r="2.5" fill="#7a5cff" opacity="0.4"/>
</svg>
