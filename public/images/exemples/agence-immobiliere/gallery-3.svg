<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EFF5"/>
      <stop offset="100%" stop-color="#D8E8F0"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EC8E8"/>
      <stop offset="100%" stop-color="#5AAED4"/>
    </linearGradient>
    <linearGradient id="greenSpace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8CC86A"/>
      <stop offset="100%" stop-color="#6EAA4A"/>
    </linearGradient>
    <linearGradient id="bldgMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A88838"/>
    </linearGradient>
    <linearGradient id="bldgGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8D0C4"/>
      <stop offset="100%" stop-color="#C0B8AC"/>
    </linearGradient>
    <linearGradient id="bldgNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4060"/>
      <stop offset="100%" stop-color="#1A2E4A"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8C0B4"/>
      <stop offset="100%" stop-color="#B8B0A4"/>
    </linearGradient>
    <filter id="bldgShadow3d">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#1A2E4A" flood-opacity="0.3"/>
    </filter>
    <filter id="badgeShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Map background -->
  <rect width="520" height="360" fill="url(#mapBg)"/>

  <!-- Grid lines (map grid) -->
  <line x1="0" y1="90" x2="520" y2="90" stroke="#C8D8E4" stroke-width="0.8"/>
  <line x1="0" y1="180" x2="520" y2="180" stroke="#C8D8E4" stroke-width="0.8"/>
  <line x1="0" y1="270" x2="520" y2="270" stroke="#C8D8E4" stroke-width="0.8"/>
  <line x1="130" y1="0" x2="130" y2="360" stroke="#C8D8E4" stroke-width="0.8"/>
  <line x1="260" y1="0" x2="260" y2="360" stroke="#C8D8E4" stroke-width="0.8"/>
  <line x1="390" y1="0" x2="390" y2="360" stroke="#C8D8E4" stroke-width="0.8"/>

  <!-- River / canal (diagonal) -->
  <path d="M0,240 C60,230 100,220 160,215 C220,210 280,218 340,210 C400,202 460,195 520,188" stroke="url(#riverGrad)" stroke-width="22" fill="none" opacity="0.85"/>
  <path d="M0,240 C60,230 100,220 160,215 C220,210 280,218 340,210 C400,202 460,195 520,188" stroke="#A8DCF0" stroke-width="4" fill="none" opacity="0.5"/>
  <!-- River bank edge -->
  <path d="M0,250 C60,240 100,230 160,225 C220,220 280,228 340,220 C400,212 460,205 520,198" stroke="#B0D4E8" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Green parks -->
  <!-- Park 1 - top left -->
  <rect x="18" y="18" width="88" height="60" rx="8" fill="url(#greenSpace)" opacity="0.8"/>
  <circle cx="38" cy="35" r="8" fill="#A8D880" opacity="0.7"/>
  <circle cx="60" cy="28" r="6" fill="#90C870" opacity="0.7"/>
  <circle cx="82" cy="38" r="9" fill="#A8D880" opacity="0.65"/>
  <circle cx="52" cy="52" r="7" fill="#90C870" opacity="0.7"/>
  <circle cx="74" cy="58" r="6" fill="#A8D880" opacity="0.65"/>
  <!-- Park 1 label -->
  <text x="62" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4A8A30" font-weight="600">Parc du Quartier</text>

  <!-- Park 2 - middle right -->
  <rect x="420" y="110" width="82" height="55" rx="7" fill="url(#greenSpace)" opacity="0.75"/>
  <circle cx="440" cy="128" r="7" fill="#A8D880" opacity="0.7"/>
  <circle cx="462" cy="120" r="5" fill="#90C870" opacity="0.7"/>
  <circle cx="484" cy="130" r="8" fill="#A8D880" opacity="0.65"/>
  <circle cx="450" cy="146" r="6" fill="#90C870" opacity="0.7"/>
  <text x="461" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4A8A30" font-weight="600">Jardin Public</text>

  <!-- Roads (main) -->
  <!-- Horizontal main road -->
  <rect x="0" y="142" width="520" height="18" fill="url(#roadGrad)"/>
  <line x1="0" y1="151" x2="520" y2="151" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="18,12" opacity="0.7"/>
  <!-- Vertical main road -->
  <rect x="228" y="0" width="20" height="360" fill="url(#roadGrad)"/>
  <line x1="238" y1="0" x2="238" y2="360" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="18,12" opacity="0.7"/>
  <!-- Secondary road horizontal -->
  <rect x="0" y="292" width="520" height="12" fill="#D0C8BC" opacity="0.8"/>
  <!-- Secondary road vertical -->
  <rect x="102" y="0" width="12" height="360" fill="#D0C8BC" opacity="0.8"/>
  <rect x="378" y="0" width="12" height="360" fill="#D0C8BC" opacity="0.8"/>

  <!-- Building blocks – 3D extrusions -->
  <!-- Block A – large featured (gold, center) -->
  <!-- Shadow / side -->
  <polygon points="142,88 228,88 228,142 142,142" fill="#D4B850" opacity="0.3"/>
  <polygon points="228,88 240,78 240,132 228,142" fill="#A88820" opacity="0.4"/>
  <!-- Top face -->
  <polygon points="142,88 228,88 240,78 154,78" fill="#E8C85A" opacity="0.7"/>
  <!-- Front face -->
  <rect x="142" y="88" width="86" height="54" rx="2" fill="url(#bldgMain)" filter="url(#bldgShadow3d)"/>
  <!-- Windows on main block -->
  <rect x="152" y="96" width="14" height="16" rx="1" fill="#FFF8D0" opacity="0.7"/>
  <rect x="172" y="96" width="14" height="16" rx="1" fill="#FFF8D0" opacity="0.7"/>
  <rect x="192" y="96" width="14" height="16" rx="1" fill="#FFF8D0" opacity="0.7"/>
  <rect x="212" y="96" width="10" height="16" rx="1" fill="#FFF8D0" opacity="0.7"/>
  <rect x="152" y="118" width="14" height="16" rx="1" fill="#FFF8D0" opacity="0.65"/>
  <rect x="172" y="118" width="14" height="16" rx="1" fill="#FFF8D0" opacity="0.65"/>
  <rect x="192" y="118" width="14" height="16" rx="1" fill="#FFF8D0" opacity="0.65"/>

  <!-- Block B (navy, top right quadrant) -->
  <polygon points="250,30 375,30 375,90 250,90" fill="#1A2E4A" opacity="0.15"/>
  <polygon points="375,30 388,20 388,80 375,90" fill="#0E1E34" opacity="0.25"/>
  <polygon points="250,30 375,30 388,20 263,20" fill="#2A4060" opacity="0.3"/>
  <rect x="250" y="30" width="125" height="60" rx="2" fill="url(#bldgNavy)" filter="url(#bldgShadow3d)"/>
  <rect x="260" y="38" width="12" height="14" rx="1" fill="#C8E4F5" opacity="0.5"/>
  <rect x="278" y="38" width="12" height="14" rx="1" fill="#C8E4F5" opacity="0.5"/>
  <rect x="296" y="38" width="12" height="14" rx="1" fill="#C8E4F5" opacity="0.5"/>
  <rect x="314" y="38" width="12" height="14" rx="1" fill="#C8E4F5" opacity="0.5"/>
  <rect x="332" y="38" width="12" height="14" rx="1" fill="#C8E4F5" opacity="0.5"/>
  <rect x="350" y="38" width="18" height="14" rx="1" fill="#C8E4F5" opacity="0.5"/>
  <rect x="260" y="56" width="12" height="24" rx="1" fill="#C8E4F5" opacity="0.4"/>
  <rect x="278" y="56" width="12" height="24" rx="1" fill="#C8E4F5" opacity="0.4"/>
  <rect x="296" y="56" width="12" height="24" rx="1" fill="#C8E4F5" opacity="0.4"/>
  <rect x="338" y="56" width="30" height="24" rx="1" fill="#C8E4F5" opacity="0.4"/>

  <!-- Block C (gray, bottom left below road) -->
  <polygon points="18,164 100,164 100,230 18,230" fill="#D8D0C4" opacity="0.2"/>
  <polygon points="100,164 112,154 112,220 100,230" fill="#C0B8AC" opacity="0.3"/>
  <polygon points="18,164 100,164 112,154 30,154" fill="#E8E0D4" opacity="0.35"/>
  <rect x="18" y="164" width="82" height="66" rx="2" fill="url(#bldgGray)" filter="url(#bldgShadow3d)"/>
  <rect x="26" y="172" width="10" height="12" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="40" y="172" width="10" height="12" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="54" y="172" width="10" height="12" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="68" y="172" width="10" height="12" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="26" y="190" width="10" height="12" rx="1" fill="#A8C4DC" opacity="0.45"/>
  <rect x="40" y="190" width="10" height="12" rx="1" fill="#A8C4DC" opacity="0.45"/>
  <rect x="60" y="188" width="18" height="28" rx="1" fill="#A8C4DC" opacity="0.4"/>

  <!-- Block D (gray, right below canal) -->
  <polygon points="250,260 375,260 375,300 250,300" fill="#D0C8BC" opacity="0.2"/>
  <polygon points="375,260 387,250 387,290 375,300" fill="#C0B8AC" opacity="0.25"/>
  <polygon points="250,260 375,260 387,250 262,250" fill="#E0D8CC" opacity="0.3"/>
  <rect x="250" y="260" width="125" height="40" rx="2" fill="url(#bldgGray)" filter="url(#bldgShadow3d)"/>
  <rect x="258" y="268" width="10" height="10" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="274" y="268" width="10" height="10" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="290" y="268" width="10" height="10" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="306" y="268" width="10" height="10" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="322" y="268" width="10" height="10" rx="1" fill="#A8C4DC" opacity="0.5"/>
  <rect x="338" y="268" width="22" height="18" rx="1" fill="#A8C4DC" opacity="0.45"/>

  <!-- Distance indicator pins -->
  <!-- School pin -->
  <circle cx="76" cy="122" r="10" fill="#1A2E4A" opacity="0.9"/>
  <text x="76" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">🎓</text>
  <line x1="76" y1="132" x2="76" y2="142" stroke="#1A2E4A" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="44" y="106" width="62" height="16" rx="4" fill="#1A2E4A" opacity="0.85"/>
  <text x="75" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">École : 350 m</text>

  <!-- Metro pin -->
  <circle cx="450" cy="260" r="10" fill="#C9A84C" opacity="0.9"/>
  <text x="450" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">M</text>
  <line x1="450" y1="248" x2="450" y2="242" stroke="#C9A84C" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="418" y="226" width="64" height="16" rx="4" fill="#C9A84C" opacity="0.9"/>
  <text x="450" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">Métro : 200 m</text>

  <!-- Bus pin -->
  <circle cx="320" cy="308" r="9" fill="#E87050" opacity="0.9"/>
  <text x="320" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">B</text>
  <rect x="288" y="322" width="64" height="16" rx="4" fill="#E87050" opacity="0.85"/>
  <text x="320" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">Bus : 80 m</text>

  <!-- Location pin for the property -->
  <circle cx="185" cy="108" r="14" fill="#1A2E4A"/>
  <circle cx="185" cy="105" r="9" fill="#C9A84C"/>
  <circle cx="185" cy="105" r="4" fill="#FFFFFF"/>
  <!-- Pin shadow/drop -->
  <ellipse cx="185" cy="122" rx="5" ry="2" fill="#1A2E4A" opacity="0.3"/>

  <!-- QUARTIER PRISÉ badge -->
  <rect x="310" y="310" width="148" height="38" rx="8" fill="#1A2E4A" filter="url(#badgeShadow)"/>
  <rect x="313" y="313" width="142" height="32" rx="6" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <text x="384" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#C9A84C" letter-spacing="1.5">QUARTIER PRISÉ</text>
  <text x="384" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8AAFC8">Paris 16e · Vue Canal</text>

  <!-- Compass rose (top right) -->
  <circle cx="488" cy="32" r="18" fill="#FFFFFF" opacity="0.8" stroke="#B8C8D8" stroke-width="1"/>
  <line x1="488" y1="18" x2="488" y2="46" stroke="#1A2E4A" stroke-width="1.5"/>
  <line x1="474" y1="32" x2="502" y2="32" stroke="#1A2E4A" stroke-width="1.5"/>
  <polygon points="488,18 485,28 488,25 491,28" fill="#C9A84C"/>
  <text x="488" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#1A2E4A">N</text>

  <!-- Scale bar -->
  <rect x="18" y="338" width="80" height="4" rx="2" fill="#1A2E4A" opacity="0.5"/>
  <rect x="58" y="334" width="1" height="12" fill="#1A2E4A" opacity="0.5"/>
  <rect x="18" y="334" width="1" height="12" fill="#1A2E4A" opacity="0.5"/>
  <rect x="98" y="334" width="1" height="12" fill="#1A2E4A" opacity="0.5"/>
  <text x="18" y="356" font-family="Arial, sans-serif" font-size="7" fill="#4A5A6A">0</text>
  <text x="52" y="356" font-family="Arial, sans-serif" font-size="7" fill="#4A5A6A">100 m</text>
  <text x="86" y="356" font-family="Arial, sans-serif" font-size="7" fill="#4A5A6A">200 m</text>
</svg>
