<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2010"/>
      <stop offset="100%" stop-color="#5A3820"/>
    </linearGradient>
    <linearGradient id="windowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E0F0"/>
      <stop offset="100%" stop-color="#A8C8E0"/>
    </linearGradient>
    <radialGradient id="spot1" cx="30%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#FFF5C0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF5C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#FFF5C0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF5C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0703A"/>
      <stop offset="100%" stop-color="#7A5020"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4A20"/>
      <stop offset="100%" stop-color="#5A3010"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background: dark wood shop interior -->
  <rect width="520" height="360" fill="url(#bgGrad)"/>

  <!-- Wood grain texture lines -->
  <line x1="0" y1="45" x2="520" y2="45" stroke="#4A2808" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="90" x2="520" y2="90" stroke="#4A2808" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="0" x2="70" y2="360" stroke="#4A2808" stroke-width="1" opacity="0.2"/>
  <line x1="200" y1="0" x2="190" y2="360" stroke="#4A2808" stroke-width="1" opacity="0.2"/>
  <line x1="380" y1="0" x2="370" y2="360" stroke="#4A2808" stroke-width="1" opacity="0.2"/>

  <!-- Window frame outer -->
  <rect x="30" y="20" width="460" height="295" rx="5" fill="url(#frameGrad)" filter="url(#shadow)"/>

  <!-- Window glass -->
  <rect x="42" y="32" width="436" height="271" rx="3" fill="url(#windowBg)"/>

  <!-- Spotlights shining down -->
  <rect x="42" y="32" width="436" height="271" rx="3" fill="url(#spot1)"/>
  <rect x="42" y="32" width="436" height="271" rx="3" fill="url(#spot2)"/>

  <!-- Spotlight lamp icons at top -->
  <rect x="130" y="26" width="14" height="10" rx="2" fill="#FFE050"/>
  <polygon points="120,36 150,36 145,46 125,46" fill="#FFD020" opacity="0.8"/>
  <rect x="376" y="26" width="14" height="10" rx="2" fill="#FFE050"/>
  <polygon points="366,36 396,36 391,46 371,46" fill="#FFD020" opacity="0.8"/>

  <!-- SHELF 1 (top tier) -->
  <rect x="55" y="95" width="410" height="12" rx="2" fill="url(#shelfGrad)" filter="url(#shadow)"/>
  <rect x="55" y="105" width="410" height="4" rx="1" fill="#5A3010" opacity="0.5"/>
  <!-- Shelf 1 supports -->
  <rect x="68" y="96" width="8" height="80" rx="1" fill="#7A5020" opacity="0.5"/>
  <rect x="445" y="96" width="8" height="80" rx="1" fill="#7A5020" opacity="0.5"/>

  <!-- SHELF 1 PRODUCTS -->
  <!-- Tall bottle left -->
  <rect x="75" y="52" width="22" height="42" rx="4" fill="#2D6A4F"/>
  <rect x="78" y="48" width="16" height="8" rx="3" fill="#2D6A4F"/>
  <rect x="81" y="44" width="10" height="6" rx="2" fill="#2D6A4F"/>
  <rect x="79" y="56" width="14" height="18" rx="1" fill="#FFF8F0" opacity="0.9"/>
  <text x="86" y="66" text-anchor="middle" font-size="5" fill="#2D6A4F" font-weight="bold">HUILE</text>
  <text x="86" y="72" text-anchor="middle" font-size="4" fill="#2D6A4F">Extra</text>
  <!-- Price tag -->
  <rect x="75" y="90" width="22" height="10" rx="2" fill="white" opacity="0.9" filter="url(#shadow)"/>
  <text x="86" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">4.90€</text>

  <!-- Jar -->
  <rect x="112" y="58" width="32" height="36" rx="5" fill="#E8734A" opacity="0.9"/>
  <ellipse cx="128" cy="58" rx="16" ry="5" fill="#D4623A"/>
  <rect x="116" y="64" width="24" height="20" rx="1" fill="#FFF8F0" opacity="0.85"/>
  <text x="128" y="75" text-anchor="middle" font-size="5" fill="#8B5E3C" font-weight="bold">CONFITURE</text>
  <text x="128" y="81" text-anchor="middle" font-size="4" fill="#8B5E3C">Framboise</text>
  <rect x="112" y="90" width="32" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="128" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">3.50€</text>

  <!-- Honey jar -->
  <rect x="160" y="60" width="30" height="34" rx="5" fill="#F0A820"/>
  <ellipse cx="175" cy="60" rx="15" ry="5" fill="#D4901A"/>
  <rect x="164" y="65" width="22" height="18" rx="1" fill="#FFF8F0" opacity="0.85"/>
  <text x="175" y="75" text-anchor="middle" font-size="5" fill="#8B5E3C" font-weight="bold">MIEL</text>
  <text x="175" y="81" text-anchor="middle" font-size="4" fill="#8B5E3C">Lavande</text>
  <rect x="160" y="90" width="30" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="175" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">6.20€</text>

  <!-- Biscuit box -->
  <rect x="205" y="55" width="44" height="39" rx="3" fill="#8B5E3C"/>
  <rect x="208" y="58" width="38" height="28" rx="2" fill="#C4924A" opacity="0.85"/>
  <text x="227" y="70" text-anchor="middle" font-size="6" fill="#FFF8F0" font-weight="bold">BISCUITS</text>
  <text x="227" y="78" text-anchor="middle" font-size="5" fill="#FFF8F0">Artisanaux</text>
  <rect x="205" y="90" width="44" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="227" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">5.80€</text>

  <!-- Tall wine bottle -->
  <rect x="265" y="46" width="20" height="48" rx="4" fill="#2D6A4F" opacity="0.9"/>
  <rect x="268" y="40" width="14" height="10" rx="3" fill="#2D6A4F" opacity="0.9"/>
  <rect x="271" y="36" width="8" height="6" rx="2" fill="#C4924A"/>
  <rect x="267" y="56" width="16" height="22" rx="1" fill="#FFF8F0" opacity="0.85"/>
  <text x="275" y="66" text-anchor="middle" font-size="4" fill="#2D6A4F" font-weight="bold">VIN</text>
  <text x="275" y="72" text-anchor="middle" font-size="3.5" fill="#2D6A4F">Rouge</text>
  <rect x="263" y="90" width="26" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="276" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">8.90€</text>

  <!-- Ceramic pot -->
  <ellipse cx="320" cy="91" rx="20" ry="7" fill="#D4623A" opacity="0.8"/>
  <path d="M300 91 Q300 55 320 55 Q340 55 340 91Z" fill="#E8734A"/>
  <rect x="303" y="65" width="34" height="18" rx="1" fill="#FFF8F0" opacity="0.85"/>
  <text x="320" y="75" text-anchor="middle" font-size="5" fill="#8B5E3C" font-weight="bold">OLIVES</text>
  <text x="320" y="81" text-anchor="middle" font-size="4" fill="#8B5E3C">Marinées</text>
  <rect x="302" y="90" width="36" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="320" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">4.20€</text>

  <!-- Tea box -->
  <rect x="354" y="58" width="40" height="36" rx="3" fill="#2D6A4F"/>
  <rect x="357" y="61" width="34" height="24" rx="2" fill="#3A8463" opacity="0.8"/>
  <text x="374" y="72" text-anchor="middle" font-size="5.5" fill="#FFF8F0" font-weight="bold">THÉ</text>
  <text x="374" y="80" text-anchor="middle" font-size="4" fill="#FFF8F0">Montagne</text>
  <rect x="354" y="90" width="40" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="374" y="98" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">7.50€</text>

